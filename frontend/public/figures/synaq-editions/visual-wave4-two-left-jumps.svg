<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc"><title id="title">Таңбалы шамалар зертханасы</title><desc id="desc">Санақ басынан A нүктесіне, одан B нүктесіне екі рет солға жылжу орындалған. Бірінші және екінші жылжуды қосу арқылы көрсететін теңдікті таңдаңдар. Көрсетілген нүктелер: A(-4), B(-11). </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6574b1"/></marker></defs><rect width="480" height="300" fill="white"/><line x1="40" y1="210" x2="444" y2="210" stroke="#38557d" stroke-width="2" marker-end="url(#tip)"/><line x1="50" y1="205" x2="50" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="0"/><line x1="79.231" y1="205" x2="79.231" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="1"/><line x1="108.462" y1="205" x2="108.462" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="2"/><line x1="137.692" y1="205" x2="137.692" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="3"/><line x1="166.923" y1="205" x2="166.923" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="4"/><line x1="196.154" y1="205" x2="196.154" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="5"/><line x1="225.385" y1="205" x2="225.385" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="6"/><line x1="254.615" y1="205" x2="254.615" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="7"/><line x1="283.846" y1="205" x2="283.846" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="8"/><line x1="313.077" y1="205" x2="313.077" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="9"/><line x1="342.308" y1="205" x2="342.308" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="10"/><line x1="371.538" y1="205" x2="371.538" y2="215" stroke="#6782a7" stroke-width="1.5" data-tick="11"/><line x1="400.769" y1="205" x2="400.769" y2="215" stroke="#6782a7" stroke-width="1.5" data