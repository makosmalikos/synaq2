<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиын элементтерін суреттен оқу</title><desc id="desc">U дөңгелегінің ішінде 0,6; 3 алым, 5 бөлім; 6 алым, 10 бөлім; 0,375; 3 алым, 8 бөлім; 0,7; 7 алым, 10 бөлім. Сыртында жазба жоқ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="32" text-anchor="middle" fill="#203549" font-size="22">Жиынның ішіндегі және сыртындағы белгілер</text><circle data-set="U" cx="220" cy="190" r="132" fill="#b7d5fa" fill-opacity=".44" stroke="#203549" stroke-width="2"/><text x="95" y="77" text-anchor="middle" fill="#203549" font-size="29">U</text><g data-entry="0"><circle cx="194" cy="95" r="2.8" fill="#203549"/><text x="220" y="104" text-anchor="middle" fill="#203549" font-size="27">0,6</text></g><g data-entry="1"><circle cx="119" cy="155" r="2.8" fill="#203549"/><text x="145" y="144" text-anchor="middle" fill="#203549" font-size="25">3</text><line x1="128" y1="152" x2="162" y2="152" stroke="#203549" stroke-width="1.8"/><text x="145" y="180" text-anchor="middle" fill="#203549" font-size="25">5</text></g><g data-entry="2"><circle cx="269" cy="155" r="2.8" fill="#203549"/><text x="295" y="144" text-anchor="middle" fill="#203549" font-size="25">6</text><line x1="278" y1="152" x2="312" y2="152" stroke="#203549" stroke-width="1.8"/><text x="295" y="180" text-anchor="middle" fill="#203549" font-size="25">10</text></g><g data-entry="3"><circle cx="194" cy="200" r="2.8" fill="#203549"/><text x="220" y="209" text-anchor="middle" fill="#203549" font-size="27">0,375</text></g><g data-entry="4"><circle cx="119" cy="255" r="2.8" fill="#203549"/><text x="145" y="244" text-anchor="middle" fill="#203549" font-size="25">3</text><line x1="128" y1="252" x2="162" y2="252" stroke="#203549" stroke-width="1.8"/><text x="145" y="280" text-anchor="middle" fill="#203549" font-size="25">8</text></g><g data-entry="5"><circle cx="269" cy="255" r="2.8" fill="#203549"/><text x="295" y="264" text-anchor="middle" fill="#203549" font-size="27">0,7</text></g><g data-entry="6"><circle cx="194" cy="285" r="2.8" fill="#203549"/><text x="220" y="274" text-anchor="middle" fill="#203549" font-size="25">7</text><line x1="203" y1="282" x2="237" y2="282" stroke="#203549" stroke-width="1.8"/><text x="220" y="310" text-anchor="middle" fill="#203549" font-size="25">10</text></g></g></svg>