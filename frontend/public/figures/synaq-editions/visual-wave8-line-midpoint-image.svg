<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="title desc"><title id="title">Координаталар және симметрия</title><desc id="desc">Сандық түзуде P нүктесі симметрия центрі болсын. A нүктесінің осы центрге қатысты A₁ бейнесінің координатасын табыңыз. Жауапқа тек санды жазыңыз. Белгіленген координаталар: A(-4), P(1). A₁ берілмеген. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a8"/></marker></defs><rect width="480" height="220" fill="white"/><line x1="33" y1="115" x2="448" y2="115" stroke="#7186a8" stroke-width="1.8" marker-end="url(#tip)"/><line x1="48" y1="110" x2="48" y2="120" stroke="#8099b9"/><line x1="86.4" y1="110" x2="86.4" y2="120" stroke="#8099b9"/><line x1="124.8" y1="110" x2="124.8" y2="120" stroke="#8099b9"/><line x1="163.2" y1="110" x2="163.2" y2="120" stroke="#8099b9"/><line x1="201.6" y1="110" x2="201.6" y2="120" stroke="#8099b9"/><line x1="240" y1="110" x2="240" y2="120" stroke="#8099b9"/><line x1="278.4" y1="110" x2="278.4" y2="120" stroke="#8099b9"/><line x1="316.8" y1="110" x2="316.8" y2="120" stroke="#8099b9"/><line x1="355.2" y1="110" x2="355.2" y2="120" stroke="#8099b9"/><line x1="393.6" y1="110" x2="393.6" y2="120" stroke="#8099b9"/><line x1="432" y1="110" x2="432" y2="120" stroke="#8099b9"/><text x="278.4" y="140" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">0</text><text x="316.8" y="140" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">1</text><circle cx="124.8" cy="115" r="4.4" fill="#6e59bc" data-point="A" data-x="-4" data-y="0"/><text x="124.8" y="90" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">A</text><circle cx="316.8" cy="115" r="4.4" fill="#6e59bc" data-point="P" data-x="1" data-y="0"/><text x="316.8" y="90" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">P</text></svg>
