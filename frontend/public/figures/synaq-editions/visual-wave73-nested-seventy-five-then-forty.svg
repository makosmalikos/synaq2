<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Санның бөлігін пайызбен табу</title><desc id="desc">Жоғарғы толық жолақ 3600, көк бөлігі 75%, қалғаны 25%. Төменде жоғарғы көк бөлік ұлғайтылып жаңа толық жолақ 100% ретінде көрсетілген. Оның сары бөлігі 40%, қалғаны 60%.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="64" x2="444" y2="64" stroke="#23394b" stroke-width="1.3" data-brace="original"/><line x1="30" y1="57" x2="30" y2="71" stroke="#23394b" stroke-width="1.3" /><line x1="444" y1="57" x2="444" y2="71" stroke="#23394b" stroke-width="1.3" /><text x="237" y="50" text-anchor="middle" fill="#23394b" font-size="27" data-whole="original">3600</text><rect data-upper="first" x="30" y="95" width="310.5" height="52" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="185.25" y="130" text-anchor="middle" fill="#23394b" font-size="27" data-percent="upper-first">75%</text><rect data-upper="rest" x="340.5" y="95" width="103.5" height="52" fill="#fff" stroke="#23394b" stroke-width="1.5"/><text x="392.25" y="130" text-anchor="middle" fill="#23394b" font-size="27" data-percent="upper-rest">25%</text><line x1="30" y1="147" x2="30" y2="240" stroke="#23394b" stroke-width="1.3" stroke-dasharray="4 5" stroke-opacity=".45"/><line x1="340.5" y1="147" x2="444" y2="240" stroke="#23394b" stroke-width="1.3" stroke-dasharray="4 5" stroke-opacity=".45"/><text x="240" y="212" text-anchor="middle" fill="#23394b" font-size="25" >Көк бөлік — жаңа 100%</text><rect data-lower="yellow" x="30" y="240" width="165.6" height="52" fill="#ecc95c" stroke="#23394b" stroke-width="1.5"/><text x="112.8" y="275" text-anchor="middle" fill="#23394b" font-size="27" data-percent="lower-yellow">40%</text><rect data-lower="rest" x="195.6" y="240" width="248.4" height="52" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="319.8" y="275" text-anchor="middle" fill="#23394b" font-size="27" data-percent="lower-rest">60%</text></g></svg>