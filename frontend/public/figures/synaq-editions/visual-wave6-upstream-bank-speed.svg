<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Қозғалыс пен өзгерістер сызбасы</title><desc id="desc">Қайық пен ағыс нұсқарларының бағыттарын салыстырыңыз. Қайық ағыспен бе, әлде ағысқа қарсы ма қозғалып барады? Оның жағаға қатысты жылдамдығын таңдаңыз. Ағыс оңға бағытталған, жылдамдығы 5 км/сағ. Қайық солға бағытталған; меншікті жылдамдығы 18 км/сағ. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6b80ae"/></marker></defs><rect width="480" height="360" fill="white"/><rect x="25" y="91" width="430" height="179" rx="20" fill="#e4f1ff"/><path d="M40,110 Q60,102 80,110 T120,110 T160,110 T200,110 T240,110 T280,110 T320,110 T360,110 T400,110 T440,110" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,144 Q60,136 80,144 T120,144 T160,144 T200,144 T240,144 T280,144 T320,144 T360,144 T400,144 T440,144" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,178 Q60,170 80,178 T120,178 T160,178 T200,178 T240,178 T280,178 T320,178 T360,178 T400,178 T440,178" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,212 Q60,204 80,212 T120,212 T160,212 T200,212 T240,212 T280,212 T320,212 T360,212 T400,212 T440,212" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,246 Q60,238 80,246 T120,246 T160,246 T200,246 T240,246 T280,246 T320,246 T360,246 T400,246 T440,246" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><g transform="translate(480 0) scale(-1 1)"><path d="M178,185 L298,185 L278,216 L197,216 Z" fill="#8c83da" stroke="#5c63a9" stroke-width="1.8"/><rect x="211" y="155" width="47" height="30" rx="5" fill="#fff2cf" stroke="#b99d69" stroke-width="1.5"/><rect x="220" y="162" width="24" height="15" rx="2" fill="#9cc9ee"/></g><text x="240" y="120" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Меншікті: 18 км/сағ</text><line x1="325" y1="239" x2="155" y2="239" stroke="#7d69c7" stroke-width="2.8" marker-end="url(#tip)" data-boat-direction="-1"/><line x1="150" y1="294" x2="330" y2="294" stroke="#558fb6" stroke-width="2.8" marker-end="url(#tip)" data-current-direction="1"/><text x="240" y="326" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Ағыс: 5 км/сағ</text></svg>
