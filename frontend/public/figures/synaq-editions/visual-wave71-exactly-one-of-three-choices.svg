<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">K, L, M жиындарының диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек K = 8; тек L = 11; тек M = 6; тек K және L = 4; тек K және M = 2; тек L және M = 3; үшеуіне де ортақ = 2.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="150" r="110" fill="#80b6ec" fill-opacity=".24"/><circle cx="300" cy="150" r="110" fill="#ebc561" fill-opacity=".24"/><circle cx="240" cy="240" r="110" fill="#74c9a4" fill-opacity=".24"/><circle data-set="K" cx="180" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="L" cx="300" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="M" cx="240" cy="240" r="110" fill="none" stroke="#203549" stroke-width="2"/><text x="125" y="150" text-anchor="middle" fill="#203549" font-size="30" data-region="A" data-count="8">8</text><text x="355" y="145" text-anchor="middle" fill="#203549" font-size="30" data-region="B" data-count="11">11</text><text x="240" y="302" text-anchor="middle" fill="#203549" font-size="30" data-region="C" data-count="6">6</text><text x="240" y="88" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="4">4</text><text x="162" y="235" text-anchor="middle" fill="#203549" font-size="30" data-region="AC" data-count="2">2</text><text x="316" y="235" text-anchor="middle" fill="#203549" font-size="30" data-region="BC" data-count="3">3</text><text x="240" y="178" text-anchor="middle" fill="#203549" font-size="30" data-region="ABC" data-count="2">2</text><text x="65" y="70" text-anchor="middle" fill="#203549" font-size="28" >K</text><text x="415" y="70" text-anchor="middle" fill="#203549" font-size="28" >L</text><text x="365" y="330" text-anchor="middle" fill="#203549" font-size="28" >M</text></g></svg>