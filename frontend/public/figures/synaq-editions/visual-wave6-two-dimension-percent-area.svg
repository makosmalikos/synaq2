<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Қозғалыс пен өзгерістер сызбасы</title><desc id="desc">Көк тік төртбұрыштың өлшемдері сантиметрмен берілген. Оның ұзындығы мен ені көрсетілген пайыздарға артты; жаңа шекарасы үзік сызықпен салынған. Жаңа аудан неше см² болады? Жауапқа тек санды жазыңыз. Бастапқы өлшемдер 8 см және 5 см; ұзындығы +25%, ені +40%. Сызбалардың төменгі сол жақ төбелері ортақ. Жаңа өлшемдер санмен берілмеген. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6b80ae"/></marker></defs><rect width="480" height="360" fill="white"/><rect x="104" y="103" width="240" height="168" fill="#fff4df" stroke="#d4a15b" stroke-width="2" stroke-dasharray="7 5" data-new-width="240" data-new-height="168"/><rect x="104" y="151" width="192" height="120" fill="#bfd4f7" stroke="#6283b5" stroke-width="2" data-original-width="192" data-original-height="120"/><text x="200" y="299" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">8 см</text><text x="68" y="211" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">5 см</text><text x="240" y="42" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Ұзындығы +25%</text><text x="380" y="184" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Ені</text><text x="380" y="214" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">+40%</text><line x1="296" y1="134" x2="344" y2="134" stroke="#bd8c47" stroke-width="2.8" marker-end="url(#tip)" /><line x1="87" y1="151" x2="87" y2="103" stroke="#bd8c47" stroke-width="2.8" marker-end="url(#tip)" /></svg>
