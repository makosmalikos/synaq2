<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көбейту және бөлу</title><desc id="desc">Екі ауыл арасы 396 км, солдан оңға 72 км/сағ, оңнан солға 60 км/сағ нұсқарлары.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="56" y1="230" x2="424" y2="230" stroke="#203549" stroke-width="2.4" /><text x="56" y="268" font-size="22" fill="#203549" text-anchor="middle">1-ауыл</text><text x="424" y="268" font-size="22" fill="#203549" text-anchor="middle">2-ауыл</text><line x1="56" y1="102" x2="424" y2="102" stroke="#203549" stroke-width="2" /><line x1="56" y1="102" x2="56" y2="110" stroke="#203549" stroke-width="2" /><line x1="424" y1="102" x2="424" y2="110" stroke="#203549" stroke-width="2" /><text x="240" y="89" font-size="24" fill="#203549" text-anchor="middle">396 км</text><circle cx="56" cy="230" r="5" fill="#203549"/><circle cx="424" cy="230" r="5" fill="#203549"/><line x1="76" y1="188" x2="208" y2="188" stroke="#315ce8" stroke-width="3" data-velocity="72" data-direction="right"/><polygon points="215,188 204,182 204,194" fill="#315ce8"/><line x1="404" y1="188" x2="272" y2="188" stroke="#8459ce" stroke-width="3" data-velocity="60" data-direction="left"/><polygon points="265,188 276,182 276,194" fill="#8459ce"/><text x="142" y="164" font-size="22" fill="#315ce8" text-anchor="middle">72 км/сағ</text><text x="338" y="164" font-size="22" fill="#8459ce" text-anchor="middle">60 км/сағ</text></g></svg>