<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Алгебралық сызба</title><desc id="desc">Тікбұрышты үшбұрыш. Көлденең катеті m, тік катеті 9 см. Суреттегі қатынас m = 8 үшін сақталған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-legs="8,9" points="90,285 294.44444444444446,285 90,55" fill="#eaf0ff" stroke="#315ce8" stroke-width="3"/><path d="M 90 267 L 108 267 L 108 285" stroke="#203549" fill="none"/><text x="192.22222222222223" y="320" font-size="25" fill="#203549" text-anchor="middle">m</text><text x="65" y="178" font-size="25" fill="#203549" text-anchor="middle">9</text></g></svg>