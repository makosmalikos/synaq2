<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Түзулер мен бұрыштар</title><desc id="desc">O нүктесінен сәулелер: R — оңға бағыттан сағат тіліне қарсы 0° бағытында; S — оңға бағыттан сағат тіліне қарсы 60° бағытында; T — оңға бағыттан сағат тіліне қарсы 180° бағытында; U — оңға бағыттан сағат тіліне қарсы 240° бағытында. Жоғарғы оң сектордан сағат тіліне қарсы сектор белгілері 2, 4, 3, 1.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="180" x2="400" y2="180" stroke="#315ce8" stroke-width="3" data-ray="R" data-degrees="0"/><line x1="240" y1="180" x2="320" y2="41.43593539448983" stroke="#315ce8" stroke-width="3" data-ray="S" data-degrees="60"/><line x1="240" y1="180" x2="80" y2="179.99999999999997" stroke="#315ce8" stroke-width="3" data-ray="T" data-degrees="180"/><line x1="240" y1="180" x2="159.99999999999994" y2="318.56406460551017" stroke="#315ce8" stroke-width="3" data-ray="U" data-degrees="240"/><circle cx="240" cy="180" r="4" fill="#203549"/><text x="226" y="200" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">O</text><text x="303.219854476264" y="152.5" font-size="29" fill="#8459ce" text-anchor="middle">2</text><text x="203.5" y="125.78014552373597" font-size="29" fill="#8459ce" text-anchor="middle">4</text><text x="176.780145523736" y="225.5" font-size="29" fill="#8459ce" text-anchor="middle">3</text><text x="276.5" y="252.219854476264" font-size="29" fill="#8459ce" text-anchor="middle">1</text></g></svg>