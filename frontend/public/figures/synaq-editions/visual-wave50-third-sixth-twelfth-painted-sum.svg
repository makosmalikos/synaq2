<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бірлік бөлшектердің үлестері</title><desc id="desc">Бір бүтін жолақтың сол жағынан ретімен көк 1/3, сары 1/6, күлгін 1/12 бөліктері, одан кейін ақ бөлік. Үш боялған үлес қабыспайды.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="23">Бір бүтіннің үш боялған үлесі</text><rect data-share="0" x="42" y="166" width="132" height="79" fill="#9ec8ed" stroke="#203549" stroke-width="1.7"/><g data-unit="1/3"><text x="108" y="194" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="93" y1="201" x2="123" y2="201" stroke="#203549" stroke-width="2"/><text x="108" y="225" text-anchor="middle" fill="#203549" font-size="22">3</text></g><rect data-share="1" x="174" y="166" width="66" height="79" fill="#f6d16e" stroke="#203549" stroke-width="1.7"/><g data-unit="1/6"><text x="207" y="194" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="192" y1="201" x2="222" y2="201" stroke="#203549" stroke-width="2"/><text x="207" y="225" text-anchor="middle" fill="#203549" font-size="22">6</text></g><rect data-share="2" x="240" y="166" width="33" height="79" fill="#c1a1de" stroke="#203549" stroke-width="1.7"/><g data-unit="1/12"><text x="256.5" y="194" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="241.5" y1="201" x2="271.5" y2="201" stroke="#203549" stroke-width="2"/><text x="256.5" y="225" text-anchor="middle" fill="#203549" font-size="22">12</text></g><rect data-white="true" x="273" y="166" width="165" height="79" fill="#fff" stroke="#203549" stroke-width="1.7"/></g></svg>