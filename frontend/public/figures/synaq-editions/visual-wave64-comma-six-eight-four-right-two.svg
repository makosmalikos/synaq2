<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық үтір мен он дәрежелерін оқу</title><desc id="desc">Төрт ұяшықтағы цифрлар солдан 0, 6, 8, 4. Сұр үтір 1 цифрдан кейін, қызыл үтір 3 цифрдан кейін. Қызыл екі доға оңға қарай көрші орындарға өтеді.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="24">Үтірдің жаңа орнын оқыңыз</text><rect x="80" y="142" width="80" height="68" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="120" y="189" text-anchor="middle" fill="#939dab" font-size="36">0</text><rect x="160" y="142" width="80" height="68" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="200" y="189" text-anchor="middle" fill="#203549" font-size="36">6</text><rect x="240" y="142" width="80" height="68" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="280" y="189" text-anchor="middle" fill="#203549" font-size="36">8</text><rect x="320" y="142" width="80" height="68" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="360" y="189" text-anchor="middle" fill="#203549" font-size="36">4</text><path d="M 160 213 q 3 14 -8 25" stroke="#9ca5b2" stroke-width="8" fill="none" data-comma-slot="1"/><path d="M 320 213 q 3 14 -8 25" stroke="#cd5366" stroke-width="8" fill="none" data-comma-slot="3"/><path d="M 160 134 C 164 77, 232 77, 240 134" stroke="#cd5366" stroke-width="3" fill="none"/><path d="M 240 134 l -10 -5 l 9 -5 Z" fill="#cd5366"/><path d="M 240 134 C 244 77, 312 77, 320 134" stroke="#cd5366" stroke-width="3" fill="none"/><path d="M 320 134 l -10 -5 l 9 -5 Z" fill="#cd5366"/></g></svg>