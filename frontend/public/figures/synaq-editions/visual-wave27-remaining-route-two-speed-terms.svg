<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Әріпті өрнек</title><desc id="desc">P пен Q арасы 720 км. Алғашқы жүрілген бөлік 90 км/сағ және t сағ; екіншісі 60 км/сағ және 3 сағ; соңғы бөлік сұрақ белгісімен көрсетілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="50" y1="99" x2="430" y2="99" stroke="#203549" stroke-width="1.5" /><line x1="46" y1="95" x2="54" y2="103" stroke="#203549" stroke-width="1.5" /><line x1="426" y1="95" x2="434" y2="103" stroke="#203549" stroke-width="1.5" /><text x="240" y="125" text-anchor="middle" font-size="22" fill="#203549">720 км</text><line data-route-part="0" x1="50" y1="174" x2="145" y2="174" stroke="#315ce8" stroke-width="5"/><line data-route-part="1" x1="145" y1="174" x2="240" y2="174" stroke="#8958c7" stroke-width="5"/><line data-route-part="2" x1="240" y1="174" x2="430" y2="174" stroke="#203549" stroke-width="5"/><circle cx="50" cy="174" r="4" fill="#203549"/><circle cx="145" cy="174" r="4" fill="#203549"/><circle cx="240" cy="174" r="4" fill="#203549"/><circle cx="430" cy="174" r="4" fill="#203549"/><text x="97.5" y="153" text-anchor="middle" font-size="22" fill="#203549">90</text><text x="192.5" y="153" text-anchor="middle" font-size="22" fill="#203549">60</text><text x="335" y="153" text-anchor="middle" font-size="22" fill="#203549">?</text><text x="97.5" y="214" text-anchor="middle" font-size="22" fill="#203549">t</text><text x="192.5" y="214" text-anchor="middle" font-size="22" fill="#203549">3</text><text x="50" y="245" text-anchor="middle" font-size="22" fill="#203549">P</text><text x="430" y="245" text-anchor="middle" font-size="22" fill="#203549">Q</text><text x="240" y="306" text-anchor="middle" font-size="20" fill="#203549">Жылдамдық · км/сағ     Уақыт · сағ</text></g></svg>