<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">Шаршының төрт қабырғасына жанасатын O центрлі шеңбер. Жазу: шаршы периметрі 72 см. Радиус пен диаметр санмен белгіленбеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-frame="square" points="125,275 355,275 355,45 125,45" fill="none" stroke="#213a53" stroke-width="2.5"/><circle data-circle="main" cx="240" cy="160" r="115" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-point="O" cx="240" cy="160" r="3.8" fill="#213a53"/><text x="225" y="184" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text><text x="240" y="337" text-anchor="middle" fill="#213a53" font-size="27" data-given="squareP">Pшаршы = 72 см</text></g></svg>