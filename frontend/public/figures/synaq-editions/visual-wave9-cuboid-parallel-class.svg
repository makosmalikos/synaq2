<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Түзулер мен бұрыштар</title><desc id="desc">Тікбұрышты JKLMJ₁K₁L₁M₁ денесі. JK = 6, KL = 4, JJ₁ = 3 шартты бірлік; JJ₁ бөлектелген. J, K, L, M — төменгі, индексті нүктелер — оларға сәйкес жоғарғы төбелер. Үзік сызық — жасырын қыр.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="100" y1="280" x2="328" y2="280" stroke="#315ce8" stroke-width="2.6" data-edge="JK"/><line x1="328" y1="280" x2="416" y2="160" stroke="#315ce8" stroke-width="2.6" data-edge="KL"/><line x1="416" y1="160" x2="188" y2="160" stroke="#315ce8" stroke-width="2.6" data-edge="LM" stroke-dasharray="7 5"/><line x1="188" y1="160" x2="100" y2="280" stroke="#315ce8" stroke-width="2.6" data-edge="MJ" stroke-dasharray="7 5"/><line x1="100" y1="145" x2="328" y2="145" stroke="#315ce8" stroke-width="2.6" data-edge="J₁K₁"/><line x1="328" y1="145" x2="416" y2="25" stroke="#315ce8" stroke-width="2.6" data-edge="K₁L₁"/><line x1="416" y1="25" x2="188" y2="25" stroke="#315ce8" stroke-width="2.6" data-edge="L₁M₁"/><line x1="188" y1="25" x2="100" y2="145" stroke="#315ce8" stroke-width="2.6" data-edge="M₁J₁"/><line x1="100" y1="280" x2="100" y2="145" stroke="#ef8b35" stroke-width="5" data-edge="JJ₁"/><line x1="328" y1="280" x2="328" y2="145" stroke="#315ce8" stroke-width="2.6" data-edge="KK₁"/><line x1="416" y1="160" x2="416" y2="25" stroke="#315ce8" stroke-width="2.6" data-edge="LL₁"/><line x1="188" y1="160" x2="188" y2="25" stroke="#315ce8" stroke-width="2.6" data-edge="MM₁" stroke-dasharray="7 5"/><text x="86" y="296" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">J</text><text x="342" y="296" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">K</text><text x="430" y="176" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">L</text><text x="174" y="176" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">M</text><text x="86" y="145" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">J₁</text><text x="342" y="145" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">K₁</text><text x="430" y="25" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">L₁</text><text x="174" y="25" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">M₁</text></g></svg>