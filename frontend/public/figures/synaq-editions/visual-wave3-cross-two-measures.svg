<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Құрама фигуралар шеберханасы</title><desc id="desc">Бір шаршының төрт жағына тағы төрт бірдей шаршы толық қабырғаларымен жалғанған. Әр шаршының қабырғасы 3 см. Көк айқыш фигураның ауданы мен сыртқы периметрі көрсетілген дұрыс жұпты таңдаңдар. Көк бөліктер есепке алынады; ашық түсті ойықтар мен бос орындар алынбайды.</desc><rect width="480" height="360" fill="white"/><rect x="205.833" y="52.5" width="68.333" height="68.333" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="137.5" y="120.833" width="68.333" height="68.333" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="205.833" y="120.833" width="68.333" height="68.333" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="274.167" y="120.833" width="68.333" height="68.333" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="205.833" y="189.167" width="68.333" height="68.333" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><path d="M205.833,52.5L274.167,52.5 M274.167,52.5L274.167,120.833 M205.833,120.833L205.833,52.5 M137.5,120.833L205.833,120.833 M205.833,189.167L137.5,189.167 M137.5,189.167L137.5,120.833 M274.167,120.833L342.5,120.833 M342.5,120.833L342.5,189.167 M342.5,189.167L274.167,189.167 M274.167,189.167L274.167,257.5 M274.167,257.5L205.833,257.5 M205.833,257.5L205.833,189.167" fill="none" stroke="#496fa7" stroke-width="2.3" stroke-linecap="square"/><path d="M205.833,281.5L274.167,281.5 M205.833,277.5v8 M274.167,277.5v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="240" y="268.5" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3 см</text><text x="240" y="350" font-family="Arial,sans-serif" font-size="16" text-an