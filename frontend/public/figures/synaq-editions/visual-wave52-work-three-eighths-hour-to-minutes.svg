<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кері сандар мен жұмыс үлестері</title><desc id="desc">Бір тапсырысқа тең толық жолақ 8 тең ұяшыққа бөлінген, сол жақтағы 3 ұяшығы көк. Көк бөлік бір сағатта орындалады.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="23">Бір сағаттағы жұмыс</text><rect data-strip="rate" data-part="0" data-painted="true" x="42" y="163" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="1" data-painted="true" x="91.5" y="163" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="2" data-painted="true" x="141" y="163" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="3" data-painted="false" x="190.5" y="163" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="4" data-painted="false" x="240" y="163" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="5" data-painted="false" x="289.5" y="163" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="6" data-painted="false" x="339" y="163" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="7" data-painted="false" x="388.5" y="163" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/></g></svg>