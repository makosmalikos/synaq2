<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай көбейткіштер</title><desc id="desc">Тіктөртбұрыш ішінде S = 221 м². Көлденең белгі a, тік белгі b; өлшемдердің мәндері жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="95" y="76" width="290" height="198" fill="#d3e6fc" stroke="#203549" stroke-width="2"/><text x="240" y="186" text-anchor="middle" fill="#203549" font-size="29" >S = 221 м²</text><line x1="95" y1="302" x2="385" y2="302" stroke="#203549" stroke-width="1.8" /><text x="240" y="332" text-anchor="middle" fill="#203549" font-size="28" >a</text><line x1="63" y1="76" x2="63" y2="274" stroke="#203549" stroke-width="1.8" /><text x="42" y="186" text-anchor="middle" fill="#203549" font-size="28" >b</text></g></svg>