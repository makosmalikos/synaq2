<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиындардың бірігуі мен қиылысуы</title><desc id="desc">U/V/W шеңберлері; соңғысының алғашқы екеуінің ішінде жататын бөліктері көк, қалған нүктелер ақ.</desc><defs><clipPath id="firstTwoUnion"><circle cx="180" cy="150" r="110"/><circle cx="300" cy="150" r="110"/></clipPath></defs><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Бірігу және қиылысу</text><circle data-shading="third-in-first-two" cx="240" cy="240" r="110" fill="#a8d3fa" clip-path="url(#firstTwoUnion)"/><circle data-set="U" cx="180" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="V" cx="300" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="W" cx="240" cy="240" r="110" fill="none" stroke="#203549" stroke-width="2" /><text x="65" y="70" text-anchor="middle" fill="#203549" font-size="28">U</text><text x="415" y="70" text-anchor="middle" fill="#203549" font-size="28">V</text><text x="365" y="330" text-anchor="middle" fill="#203549" font-size="28">W</text></g></svg>