<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Құрама фигуралар шеберханасы</title><desc id="desc">Еден жоспарындағы сыртқы тіктөртбұрыш 7 × 5 м. Жоғарғы оң бұрышындағы 3 × 2 м ойыққа плитка төселмейді. Көк еденге қабырғасы 25 см шаршы плиткалар қиылмай толық төселеді. Бір қорапта 12 плитка бар. Материал жетуі үшін ең аз неше бүтін қорап алу керек? Көк бөліктер есепке алынады; ашық түсті ойықтар мен бос орындар алынбайды.</desc><rect width="480" height="360" fill="white"/><rect x="107.5" y="60.357" width="265" height="189.286" fill="#a8bfff" fill-opacity="1" /><rect x="258.929" y="60.357" width="113.571" height="75.714" fill="#fff7e9" stroke="#d49648" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M107.5,60.357L145.357,60.357 M107.5,98.214L107.5,60.357 M145.357,60.357L183.214,60.357 M183.214,60.357L221.071,60.357 M221.071,60.357L258.929,60.357 M258.929,60.357L258.929,98.214 M107.5,136.071L107.5,98.214 M258.929,98.214L258.929,136.071 M107.5,173.929L107.5,136.071 M258.929,136.071L296.786,136.071 M296.786,136.071L334.643,136.071 M334.643,136.071L372.5,136.071 M372.5,136.071L372.5,173.929 M107.5,211.786L107.5,173.929 M372.5,173.929L372.5,211.786 M145.357,249.643L107.5,249.643 M107.5,249.643L107.5,211.786 M183.214,249.643L145.357,249.643 M221.071,249.643L183.214,249.643 M258.929,249.643L221.071,249.643 M296.786,249.643L258.929,249.643 M334.643,249.643L296.786,249.643 M372.5,211.786L372.5,249.643 M372.5,249.643L334.643,249.643" fill="none" stroke="#496fa7" stroke-width="2.3" stroke-linecap="square"/><path d="M107.5,273.643L372.5,273.643 M107.5,269.643v8 M372.5,269.643v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="240" y="260.643" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">7 м</text><path d="M83.5,60.357L83.5,249.643 M79.5,60.357h8 M79.5,249.643h8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="58.5" y="155" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">5 м</text><path d="M258.929,36.357L372.5,36.357 M258.929,32.357v8 M372.5,32.357v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="315.714" y="23.357" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3 м</text><path d="M396.5,136.071L396.5,60.357 M392.5,136.071h8 M392.5,60.357h8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="421.5" y="98.214" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2 м</text><text x="240" y="350" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#4164a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Көк бөлік есепке алынады</text></svg>
