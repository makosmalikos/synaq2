<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттердегі сандар тізбегі</title><desc id="desc">1…6 нөмірлі алты карточка, 1,2,3 жоғарғы қатарда солдан оңға;4,5,6 төменгі қатарда оңнан солға. Бірінші0,12, екінші0,36, алтыншы сары сұрақ белгісі. Бес нұсқардың әрқайсысында ×3.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#203549"/></marker></defs><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="32" text-anchor="middle" fill="#203549" font-size="23">Әр нұсқардың амалын орындаңыз</text><rect x="33" y="90" width="86" height="49" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-machine-box="1"/><text x="76" y="123" text-anchor="middle" fill="#203549" font-size="26">0,12</text><text x="76" y="77" text-anchor="middle" fill="#203549" font-size="23">1</text><rect x="197" y="90" width="86" height="49" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-machine-box="2"/><text x="240" y="123" text-anchor="middle" fill="#203549" font-size="26">0,36</text><text x="240" y="77" text-anchor="middle" fill="#203549" font-size="23">2</text><rect x="361" y="90" width="86" height="49" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-machine-box="3"/><text x="404" y="123" text-anchor="middle" fill="#203549" font-size="26"></text><text x="404" y="77" text-anchor="middle" fill="#203549" font-size="23">3</text><rect x="361" y="235" width="86" height="49" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-machine-box="4"/><text x="404" y="268" text-anchor="middle" fill="#203549" font-size="26"></text><text x="404" y="314" text-anchor="middle" fill="#203549" font-size="23">4</text><rect x="197" y="235" width="86" height="49" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-machine-box="5"/><text x="240" y="268" text-anchor="middle" fill="#203549" font-size="26"></text><text x="240" y="314" text-anchor="middle" fill="#203549" font-size="23">5</text><rect x="33" y="235" width="86" height="49" fill="#fff0b8" stroke="#203549" stroke-width="1.8" data-machine-box="6"/><text x="76" y="268" text-anchor="middle" fill="#203549" font-size="26">?</text><text x="76" y="314" text-anchor="middle" fill="#203549" font-size="23">6</text><line x1="126" y1="114" x2="189" y2="114" stroke="#203549" stroke-width="1.8" marker-end="url(#arr)" data-machine-arrow="0"/><text x="157.5" y="97" text-anchor="middle" fill="#203549" font-size="23">×3</text><line x1="290" y1="114" x2="353" y2="114" stroke="#203549" stroke-width="1.8" marker-end="url(#arr)" data-machine-arrow="1"/><text x="321.5" y="97" text-anchor="middle" fill="#203549" font-size="23">×3</text><line x1="404" y1="143" x2="404" y2="226" stroke="#203549" stroke-width="1.8" marker-end="url(#arr)" data-machine-arrow="2"/><text x="443" y="195" text-anchor="middle" fill="#203549" font-size="23">×3</text><line x1="354" y1="259" x2="291" y2="259" stroke="#203549" stroke-width="1.8" marker-end="url(#arr)" data-machine-arrow="3"/><text x="322.5" y="242" text-anchor="middle" fill="#203549" font-size="23">×3</text><line x1="190" y1="259" x2="127" y2="259" stroke="#203549" stroke-width="1.8" marker-end="url(#arr)" data-machine-arrow="4"/><text x="158.5" y="242" text-anchor="middle" fill="#203549" font-size="23">×3</text></g></svg>