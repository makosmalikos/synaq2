<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлшектердің қосындысы мен айырмасы</title><desc id="desc">Масштабсыз үшбұрыш: сол қабырға 3/8 м, табаны 7/20 м; оң қабырға «?». Барлық берілген ұзындық метрмен.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="46" text-anchor="middle" fill="#203549" font-size="22">Берілген ұзындықтар — метрмен</text><polygon data-triangle="true" points="105,254 210,105 390,254" fill="#e8effd" stroke="#203549" stroke-width="3"/><g data-fraction="3/8"><text x="118" y="164" text-anchor="middle" fill="#203549" font-size="25">3</text><line x1="102" y1="171" x2="134" y2="171" stroke="#203549" stroke-width="2" /><text x="118" y="195" text-anchor="middle" fill="#203549" font-size="25">8</text></g><g data-fraction="7/20"><text x="250" y="285" text-anchor="middle" fill="#203549" font-size="25">7</text><line x1="234" y1="292" x2="266" y2="292" stroke="#203549" stroke-width="2" /><text x="250" y="316" text-anchor="middle" fill="#203549" font-size="25">20</text></g><text x="327" y="167" text-anchor="middle" fill="#203549" font-size="31">?</text><text x="240" y="344" text-anchor="middle" fill="#203549" font-size="19">Сызба масштабсыз</text></g></svg>