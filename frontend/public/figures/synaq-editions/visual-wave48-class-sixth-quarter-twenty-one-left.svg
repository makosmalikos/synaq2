<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлшектердің қосындысы мен айырмасы</title><desc id="desc">Бір толық жолақтағы үш қабыспайтын бөлік: көк 1/6, күлгін 1/4 бастапқы сынып үлесі; қалған ақ бөлікте 21 оқушы. Жолақ үстінде барлық оқушы саны белгісіз екені «?» арқылы көрсетілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="23">Сыныптағы барлық оқушы</text><line x1="42" y1="118" x2="438" y2="118" stroke="#203549" stroke-width="2" /><line x1="42" y1="118" x2="51" y2="113" stroke="#203549" stroke-width="2" /><line x1="42" y1="118" x2="51" y2="123" stroke="#203549" stroke-width="2" /><line x1="438" y1="118" x2="429" y2="113" stroke="#203549" stroke-width="2" /><line x1="438" y1="118" x2="429" y2="123" stroke="#203549" stroke-width="2" /><text x="240" y="103" text-anchor="middle" fill="#203549" font-size="30">?</text><rect data-class-part="0" x="42" y="170" width="66" height="76" fill="#9ec8ed" stroke="#203549" stroke-width="2"/><g data-fraction="1/6"><text x="75" y="195" text-anchor="middle" fill="#203549" font-size="23">1</text><line x1="59" y1="202" x2="91" y2="202" stroke="#203549" stroke-width="2" /><text x="75" y="226" text-anchor="middle" fill="#203549" font-size="23">6</text></g><rect data-class-part="1" x="108" y="170" width="99" height="76" fill="#c1a1de" stroke="#203549" stroke-width="2"/><g data-fraction="1/4"><text x="157.5" y="195" text-anchor="middle" fill="#203549" font-size="23">1</text><line x1="141.5" y1="202" x2="173.5" y2="202" stroke="#203549" stroke-width="2" /><text x="157.5" y="226" text-anchor="middle" fill="#203549" font-size="23">4</text></g><rect data-class-part="2" x="207" y="170" width="231" height="76" fill="#fff" stroke="#203549" stroke-width="2"/><text x="322.5" y="218" text-anchor="middle" fill="#203549" font-size="30">21</text><text x="240" y="305" text-anchor="middle" fill="#203549" font-size="21">Екі үйірменің үлестері қабыспайды</text></g></svg>