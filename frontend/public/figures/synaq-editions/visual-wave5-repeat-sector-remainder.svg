<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Дана төсбелгінің 0,(8) бөлігін көк түспен белгілеуі керек. Төсбелгі тең секторларға бөлінген; қазір көк түспен белгіленген секторлар сызбада берілген. Ол тағы неше секторды бояуы керек? Жауапқа тек санды жазыңыз. Тең секторлар саны 9, көк секторлар саны 3. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="360" fill="white"/><path d="M240,175 L240,50 A125,125 0 0,1 320.348,79.244 Z" fill="#779ee7" stroke="white" stroke-width="2.6" data-sector="0" data-colored="true"/><path d="M240,175 L320.348,79.244 A125,125 0 0,1 363.101,153.294 Z" fill="#779ee7" stroke="white" stroke-width="2.6" data-sector="1" data-colored="true"/><path d="M240,175 L363.101,153.294 A125,125 0 0,1 348.253,237.5 Z" fill="#779ee7" stroke="white" stroke-width="2.6" data-sector="2" data-colored="true"/><path d="M240,175 L348.253,237.5 A125,125 0 0,1 282.753,292.462 Z" fill="#fff2db" stroke="white" stroke-width="2.6" data-sector="3" data-colored="false"/><path d="M240,175 L282.753,292.462 A125,125 0 0,1 197.247,292.462 Z" fill="#fff2db" stroke="white" stroke-width="2.6" data-sector="4" data-colored="false"/><path d="M240,175 L197.247,292.462 A125,125 0 0,1 131.747,237.5 Z" fill="#fff2db" stroke="white" stroke-width="2.6" data-sector="5" data-colored="false"/><path d="M240,175 L131.747,237.5 A125,125 0 0,1 116.899,153.294 Z" fill="#fff2db" stroke="white" stroke-width="2.6" data-sector="6" data-colored="false"/><path d="M240,175 L116.899,153.294 A125,125 0 0,1 159.652,79.244 Z" fill="#fff2db" stroke="white" stroke-width="2.6" data-sector="7" data-colored="false"/><path d="M240,175 L159.652,79.244 A125,125 0 0,1 240,50 Z" fill="#fff2db" stroke="white" s