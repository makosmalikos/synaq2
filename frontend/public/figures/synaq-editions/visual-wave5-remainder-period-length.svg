<svg xmlns="http://www.w3.org/2000/svg" width="480" height="245" viewBox="0 0 480 245" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Бөлу қадамдарының кестесінде бастапқы қалдық қайталанғанға дейінгі барлық қадам көрсетілген. Алынатын ондық бөлшектің периодында неше цифр бар? Жауапқа тек санды жазыңыз. Берілген бөлу 3 : 11. Қадамдар [қалдық; цифр; жаңа қалдық]: 3; 2; 8 | 8; 7; 3. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="245" fill="white"/><text x="240" y="30" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="28" fill="#263f65" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">3 : 11</text><text x="100" y="72" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">Қалдық</text><text x="240" y="72" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">Цифр</text><text x="380" y="72" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">Келесі қалдық</text><line x1="37" y1="89" x2="443" y2="89" stroke="#a3b8d8"/><text x="100" y="113" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#335a86" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">3</text><text x="240" y="113" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#335a86" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">2</text><text x="380" y="113" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#335a86" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">8</text><line x1="45" y1="130" x2="435" y2="130" stroke="#e1eaf8"/><text x="100" y="145" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#335a86" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">8</text><text x="240" y="145" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#335a86" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">7</text><text x="380" y="145" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#c34e6b" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">3</text><line x1="45" y1="162" x2="435" y2="162" stroke="#e1eaf8"/><text x="240" y="215" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="19" fill="#a74d69" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">Бастапқы қалдық қайта пайда болды</text></svg>
