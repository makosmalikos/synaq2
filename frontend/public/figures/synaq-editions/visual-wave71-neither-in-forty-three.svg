<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">K, L жиындарының тіктөртбұрыш ішіндегі диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек K = белгісіз; тек K және L = 7; тек L = белгісіз; екі дөңгелектен де тыс = белгісіз. K толық саны 24; L толық саны 18; барлық U толық саны 43.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-universe="true" x="18" y="58" width="444" height="280" rx="4" fill="none" stroke="#203549" stroke-width="1.7"/><circle cx="170" cy="190" r="110" fill="#80b6ec" fill-opacity=".24"/><circle cx="310" cy="190" r="110" fill="#ebc561" fill-opacity=".24"/><circle data-set="K" cx="170" cy="190" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="L" cx="310" cy="190" r="110" fill="none" stroke="#203549" stroke-width="2"/><text x="240" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="7">7</text><text x="435" y="315" text-anchor="middle" fill="#203549" font-size="30" data-region="OUT" data-count="unknown">?</text><text x="80" y="90" text-anchor="middle" fill="#203549" font-size="29" >K</text><text x="400" y="90" text-anchor="middle" fill="#203549" font-size="29" >L</text><text x="130" y="30" text-anchor="middle" fill="#203549" font-size="25" data-total="A" data-value="24">n(K) = 24</text><text x="350" y="30" text-anchor="middle" fill="#203549" font-size="25" data-total="B" data-value="18">n(L) = 18</text><text x="110" y="326" text-anchor="middle" fill="#203549" font-size="25" data-total="universe" data-value="43">n(U) = 43</text></g></svg>