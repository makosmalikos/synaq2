<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кеңістіктегі фигура</title><desc id="desc">Цилиндр табанының диаметрі 14 см; ол табан центрі арқылы өтеді. Тік биіктігі 11 см. Табанның артқы жартысы үзік сызықпен берілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="240" cy="65" rx="120.9090909090909" ry="31" fill="#edf1ff" stroke="#315ce8" stroke-width="2.5"/><line x1="119.0909090909091" y1="65" x2="119.0909090909091" y2="255" stroke="#315ce8" stroke-width="2.5" /><line x1="360.9090909090909" y1="65" x2="360.9090909090909" y2="255" stroke="#315ce8" stroke-width="2.5" /><path d="M 119.0909090909091 255 A 120.9090909090909 31 0 0 1 360.9090909090909 255" fill="none" stroke="#315ce8" stroke-width="2" stroke-dasharray="7 5"/><path d="M 119.0909090909091 255 A 120.9090909090909 31 0 0 0 360.9090909090909 255" fill="none" stroke="#315ce8" stroke-width="2.5"/><line x1="119.0909090909091" y1="255" x2="360.9090909090909" y2="255" stroke="#8459ce" stroke-width="2" /><text x="240" y="311" font-size="25" fill="#8459ce" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">14 см</text><line x1="389.9090909090909" y1="65" x2="389.9090909090909" y2="255" stroke="#203549" stroke-width="1.5" /><text x="389.9090909090909" y="168" font-size="25" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">11 см</text><circle cx="240" cy="255" r="4" fill="#203549"/><text x="240" y="243" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">O</text></g></svg>