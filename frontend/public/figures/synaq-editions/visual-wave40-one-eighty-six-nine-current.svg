<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Өзендегі қозғалыс</title><desc id="desc">Сол жақ айлақ K, оң жақ M, арасы 180 км. Ағыс K-дан M-ге, оңға. Ағыс жылдамдығы көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="126" width="424" height="176" rx="12" fill="#e3f2fc"/><line x1="28" y1="126" x2="452" y2="126" stroke="#91b6ce" stroke-width="1.7" /><line x1="28" y1="302" x2="452" y2="302" stroke="#91b6ce" stroke-width="1.7" /><line x1="68" y1="66" x2="412" y2="66" stroke="#203549" stroke-width="1.7" /><line x1="68" y1="61" x2="68" y2="71" stroke="#203549" stroke-width="1.7" /><line x1="412" y1="61" x2="412" y2="71" stroke="#203549" stroke-width="1.7" /><text x="240" y="43" text-anchor="middle" fill="#203549" font-size="28" data-distance="180">180 км</text><rect x="62" y="108" width="12" height="18" fill="#203549"/><text x="68" y="101" text-anchor="middle" fill="#203549" font-size="25" >K</text><rect x="406" y="108" width="12" height="18" fill="#203549"/><text x="412" y="101" text-anchor="middle" fill="#203549" font-size="25" >M</text><line x1="187" y1="278" x2="291" y2="278" stroke="#5e9dba" stroke-width="2.3" data-current-direction="1"/><line x1="291" y1="278" x2="283" y2="273" stroke="#5e9dba" stroke-width="2.3" /><line x1="291" y1="278" x2="283" y2="283" stroke="#5e9dba" stroke-width="2.3" /><text x="240" y="342" text-anchor="middle" fill="#203549" font-size="24" >Ағыс: ?</text></g></svg>