<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлуді суретпен оқу</title><desc id="desc">Екі шеткі жазу 3,6 және 6. Аралық 6 тең қадамға бөлінген; K сол жақтан 4-бөлу нүктесінде.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="24">Координаталық сәуле</text><line x1="32" y1="185" x2="446" y2="185" stroke="#203549" stroke-width="2" /><path d="M 446 185 L 436 180 L 436 190 Z" fill="#203549"/><path d="M 20 185 L 31 185" stroke="#203549" stroke-width="2" stroke-dasharray="3 4"/><line x1="55" y1="175" x2="55" y2="195" stroke="#203549" stroke-width="2" data-tick="0"/><line x1="115" y1="175" x2="115" y2="195" stroke="#203549" stroke-width="2" data-tick="1"/><line x1="175" y1="175" x2="175" y2="195" stroke="#203549" stroke-width="2" data-tick="2"/><line x1="235" y1="175" x2="235" y2="195" stroke="#203549" stroke-width="2" data-tick="3"/><line x1="295" y1="175" x2="295" y2="195" stroke="#203549" stroke-width="2" data-tick="4"/><line x1="355" y1="175" x2="355" y2="195" stroke="#203549" stroke-width="2" data-tick="5"/><line x1="415" y1="175" x2="415" y2="195" stroke="#203549" stroke-width="2" data-tick="6"/><text x="55" y="235" text-anchor="middle" fill="#203549" font-size="26">3,6</text><text x="415" y="235" text-anchor="middle" fill="#203549" font-size="26">6</text><circle data-point="K" cx="295" cy="185" r="5" fill="#d15c72"/><text x="295" y="153" text-anchor="middle" fill="#203549" font-size="28">K</text></g></svg>