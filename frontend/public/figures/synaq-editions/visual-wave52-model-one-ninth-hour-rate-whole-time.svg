<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кері сандар мен жұмыс үлестері</title><desc id="desc">Толық жолақ 9 тең ұяшық, алғашқы 1 ұяшық көк. Ол бір сағаттағы жұмыс.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="23">Бір сағаттағы жұмыс</text><rect data-strip="rate" data-part="0" data-painted="true" x="42" y="163" width="44" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="1" data-painted="false" x="86" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="2" data-painted="false" x="130" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="3" data-painted="false" x="174" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="4" data-painted="false" x="218" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="5" data-painted="false" x="262" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="6" data-painted="false" x="306" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="7" data-painted="false" x="350" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="rate" data-part="8" data-painted="false" x="394" y="163" width="44" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/></g></svg>