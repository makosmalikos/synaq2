<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Түзулер мен бұрыштар</title><desc id="desc">O нүктесінен сәулелер: A — оңға бағыттан сағат тіліне қарсы 0° бағытында; E — оңға бағыттан сағат тіліне қарсы 28° бағытында; C — оңға бағыттан сағат тіліне қарсы 90° бағытында; B — оңға бағыттан сағат тіліне қарсы 180° бағытында; D — оңға бағыттан сағат тіліне қарсы 270° бағытында. Берілген AOE бұрышы 28°. Ізделген бұрыш EOC.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="220" y1="190" x2="362" y2="190" stroke="#315ce8" stroke-width="3" data-ray="A" data-degrees="0"/><text x="378" y="190" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">A</text><line x1="220" y1="190" x2="345.3785581859676" y2="123.33503808440351" stroke="#315ce8" stroke-width="3" data-ray="E" data-degrees="28"/><text x="359.5057196717105" y="115.82349307982925" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">E</text><line x1="220" y1="190" x2="220" y2="48" stroke="#315ce8" stroke-width="3" data-ray="C" data-degrees="90"/><text x="220" y="32" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">C</text><line x1="220" y1="190" x2="78" y2="189.99999999999997" stroke="#315ce8" stroke-width="3" data-ray="B" data-degrees="180"/><text x="62" y="189.99999999999997" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">B</text><line x1="220" y1="190" x2="219.99999999999997" y2="332" stroke="#315ce8" stroke-width="3" data-ray="D" data-degrees="270"/><text x="219.99999999999997" y="348" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">D</text><circle cx="220" cy="190" r="4" fill="#203549"/><text x="206" y="210" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">O</text><path d="M 285 190 A 65 65 0 0 0 277.3915935358302 159.4843484189171" fill="none" stroke="#8459ce" stroke-width="2"/><text x="312.1780939962197" y="174.01741991803158" font-size="22" fill="#8459ce" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">28°</text><path d="M 296.81644057872666 149.15597403762752 A 87 87 0 0 0 220 103" fill="none" stroke="#8459ce" stroke-width="2"/><text x="277.6842643899261" y="100.99726232136344" font-size="22" fill="#8459ce" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">?</text><path d="M 242 190 L 242 168 L 220 168" fill="none" stroke="#203549" stroke-width="1.6"/></g></svg>