<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">A және B центрлі екі шеңбер C,D нүктелерінде қиылысып, ACBD төртбұрышы салынған. Бірінші шеңбердің A арқылы өтетін диаметрінде 16 см, екіншісінің радиусында 6 см жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="first" cx="186.66666666666666" cy="160" r="106.66666666666667" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="second" cx="320" cy="160" r="80" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="186.66666666666666" y1="160" x2="272" y2="96.00000000000001" stroke="#213a53" stroke-width="2" data-kite-edge="first-upper"/><line x1="320" y1="160" x2="272" y2="96.00000000000001" stroke="#213a53" stroke-width="2" data-kite-edge="second-upper"/><line x1="320" y1="160" x2="272" y2="224" stroke="#213a53" stroke-width="2" data-kite-edge="second-lower"/><line x1="186.66666666666666" y1="160" x2="272" y2="224" stroke="#213a53" stroke-width="2" data-kite-edge="first-lower"/><circle data-point="A" cx="186.66666666666666" cy="160" r="3.8" fill="#213a53"/><text x="170.66666666666666" y="183" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text><circle data-point="B" cx="320" cy="160" r="3.8" fill="#213a53"/><text x="308" y="185" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="B">B</text><circle data-point="C" cx="272" cy="96.00000000000001" r="3.8" fill="#213a53"/><text x="284" y="85.00000000000001" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="C">C</text><circle data-point="D" cx="272" cy="224" r="3.8" fill="#213a53"/><text x="284" y="249" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="D">D</text><line x1="186.66666666666666" y1="266.6666666666667" x2="186.66666666666666" y2="53.33333333333333" stroke="#213a53" stroke-width="2" data-diameter="first"/><text x="146.66666666666666" y="168" text-anchor="middle" fill="#213a53" font-size="27" data-given="diameter">16 см</text><line x1="320" y1="160" x2="400" y2="160" stroke="#213a53" stroke-width="2" data-radius="second"/><text x="360" y="150" text-anchor="middle" fill="#213a53" font-size="27" data-given="radius">6 см</text></g></svg>