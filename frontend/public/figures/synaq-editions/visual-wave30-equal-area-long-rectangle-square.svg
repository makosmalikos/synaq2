<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Формуланы қолдану</title><desc id="desc">A тіктөртбұрышы 16 см × 4 см; B шаршысы 8 см қабырғалы.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-comparison="A" x="44" y="174" width="192" height="48" fill="#cddcff" stroke="#203549" stroke-width="1.8"/><rect data-comparison="B" x="324" y="126" width="96" height="96" fill="#f6d98e" stroke="#203549" stroke-width="1.8"/><text x="140" y="206" text-anchor="middle" fill="#203549" font-size="24">A</text><text x="372" y="182" text-anchor="middle" fill="#203549" font-size="24">B</text><text x="140" y="258" text-anchor="middle" fill="#203549" font-size="24">16 см</text><text x="268" y="206" text-anchor="middle" fill="#203549" font-size="23">4 см</text><text x="372" y="258" text-anchor="middle" fill="#203549" font-size="24">8 см</text></g></svg>