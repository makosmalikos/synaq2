<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: P; Q; R; S. Суреттегі доға жазулары: ∠QVR: ?. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="453" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="328.26065380374746" y2="109.00585254252175" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="339.9974428733948" y="94.93216272104857" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="175.70021305477428" y2="98.3377872922492" stroke="#23394b" stroke-width="2.1" data-ray="R"/><text x="167.14970947163255" y="82.84547177260151" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><line x1="240" y1="275" x2="59.282801163596076" y2="223.18017710640407" stroke="#23394b" stroke-width="2.1" data-ray="S"/><text x="35.25125876513812" y="224.28924321097907" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="S">S</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="QR" d="M270.5156515810829 217.60840646416975 A65 65 0 0 0 217.76869068383152 213.91997964891596" fill="none" stroke="#80b5ef" stroke-width="2.5"/><text x="246.0688132157389" y="196.2119276273953" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="QR">?</text></g></svg>