<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Деректер мен нұсқалар</title><desc id="desc">A, B, C, D, E, F ретімен қосылған дөңес алтыбұрыш. Тек шекара қабырғалары сызылған; диагональдар салынбаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-vertices="0,2;1,0;4,0;5,2;4,4;1,4" points="102.5,180 157.5,290 322.5,290 377.5,180 322.5,70 157.5,70" fill="#eef0ff" stroke="#315ce8" stroke-width="3"/><text x="82.5" y="187" font-size="24" fill="#203549" text-anchor="middle">A</text><text x="157.5" y="316" font-size="24" fill="#203549" text-anchor="middle">B</text><text x="322.5" y="316" font-size="24" fill="#203549" text-anchor="middle">C</text><text x="397.5" y="187" font-size="24" fill="#203549" text-anchor="middle">D</text><text x="322.5" y="54" font-size="24" fill="#203549" text-anchor="middle">E</text><text x="157.5" y="54" font-size="24" fill="#203549" text-anchor="middle">F</text></g></svg>