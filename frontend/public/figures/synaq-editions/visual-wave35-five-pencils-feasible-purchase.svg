<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Цифрлар қосындысы</title><desc id="desc">Бір қарындаш 36 тг, бір дәптер 45 тг, бір өшіргіш 63 тг. Әрқайсысының жеке суреті мен атауы берілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g data-item="pencil"><path d="M 41 146 H 118 L 137 155 L 118 164 H 41 Z" fill="#f7d17b" stroke="#846f3d" stroke-width="1.7"/><rect x="41" y="146" width="13" height="18" fill="#eaa3b7" stroke="#846f3d" stroke-width="1.3"/><line x1="118" y1="146" x2="118" y2="164" stroke="#846f3d" stroke-width="1.6" /></g><text x="88" y="223" text-anchor="middle" fill="#203549" font-size="22" >Қарындаш</text><text x="88" y="270" text-anchor="middle" fill="#203549" font-size="27" >36 тг</text><g data-item="notebook"><rect x="205" y="103" width="70" height="104" rx="5" fill="#77b49a" stroke="#426b5b" stroke-width="1.7"/><rect x="217" y="122" width="45" height="23" fill="#fff" stroke="#426b5b" stroke-width="1.3"/><line x1="211" y1="151" x2="211" y2="193" stroke="#426b5b" stroke-width="2" stroke-dasharray="4 7"/></g><text x="240" y="238" text-anchor="middle" fill="#203549" font-size="22" >Дәптер</text><text x="240" y="270" text-anchor="middle" fill="#203549" font-size="27" >45 тг</text><g data-item="eraser"><rect x="354" y="140" width="75" height="36" rx="5" fill="#eaa3b7" stroke="#776273" stroke-width="1.7"/><path d="M 359 140 H 391 V 176 H 359 Q 354 176 354 171 V 145 Q 354 140 359 140" fill="#8eb3ef" stroke="#776273" stroke-width="1.3"/></g><text x="392" y="223" text-anchor="middle" fill="#203549" font-size="22" >Өшіргіш</text><text x="392" y="270" text-anchor="middle" fill="#203549" font-size="27" >63 тг</text></g></svg>