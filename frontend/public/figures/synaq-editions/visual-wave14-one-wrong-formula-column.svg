117" x2="385" y2="245" stroke="#315ce8" stroke-width="1.4" /><text x="420" y="158" font-size="23" fill="#203549" text-anchor="middle">5</text><text x="420" y="222" font-size="23" fill="#203549" text-anchor="middle">23</text><g data-column="4" data-independent="5" data-dependent="23"/></g></svg>