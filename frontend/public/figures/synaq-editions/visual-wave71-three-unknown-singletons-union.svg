<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">M, N, P жиындарының диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек M = белгісіз; тек N = белгісіз; тек P = белгісіз; тек M және N = 4; тек M және P = 3; тек N және P = 5; үшеуіне де ортақ = 2. M толық саны 20; N толық саны 18; P толық саны 16.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="150" r="110" fill="#80b6ec" fill-opacity=".24"/><circle cx="300" cy="150" r="110" fill="#ebc561" fill-opacity=".24"/><circle cx="240" cy="240" r="110" fill="#74c9a4" fill-opacity=".24"/><circle data-set="M" cx="180" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="N" cx="300" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="P" cx="240" cy="240" r="110" fill="none" stroke="#203549" stroke-width="2"/><text x="125" y="150" text-anchor="middle" fill="#203549" font-size="30" data-region="A" data-count="unknown">?</text><text x="355" y="145" text-anchor="middle" fill="#203549" font-size="30" data-region="B" data-count="unknown">?</text><text x="240" y="302" text-anchor="middle" fill="#203549" font-size="30" data-region="C" data-count="unknown">?</text><text x="240" y="88" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="4">4</text><text x="162" y="235" text-anchor="middle" fill="#203549" font-size="30" data-region="AC" data-count="3">3</text><text x="316" y="235" text-anchor="middle" fill="#203549" font-size="30" data-region="BC" data-count="5">5</text><text x="240" y="178" text-anchor="middle" fill="#203549" font-size="30" data-region="ABC" data-count="2">2</text><text x="65" y="70" text-anchor="middle" fill="#203549" font-size="28" >M</text><text x="415" y="70" text-anchor="middle" fill="#203549" font-size="28" >N</text><text x="365" y="330" text-anchor="middle" fill="#203549" font-size="28" >P</text><text x="130" y="30" text-anchor="middle" fill="#203549" font-size="25" data-total="A" data-value="20">n(M) = 20</text><text x="350" y="30" text-anchor="middle" fill="#203549" font-size="25" data-total="B" data-value="18">n(N) = 18</text><text x="88" y="337" text-anchor="middle" fill="#203549" font-size="25" data-total="C" data-value="16">n(P) = 16</text></g></svg>