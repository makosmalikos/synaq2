<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" data-edition="geometry-courtyard-corner" data-model="l-shape-area"><title id="title">L пішінді гүлзар</title><desc id="desc">13 м × 9 м тіктөртбұрыштың жоғарғы оң жақ бұрышынан 4 м × 3 м бөлік алынған.</desc><rect width="720" height="500" fill="white"/><g stroke="#233b5d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" text-anchor="middle"><style>text{fill:#18304e;stroke:none}</style><polygon data-role="l-floor" data-unit-scale="32" points="135,110 423,110 423,206 551,206 551,398 135,398" fill="#c8dafd"/><line x1="135" y1="432" x2="551" y2="432" /><text x="343" y="476" data-given="width" data-value="13">13 м</text><line x1="100" y1="110" x2="100" y2="398" /><text x="50" y="264" data-given="height" data-value="9">9 м</text><line x1="423" y1="76" x2="551" y2="76" /><text x="487" y="58" data-given="cutWidth" data-value="4">4 м</text><line x1="581" y1="110" x2="581" y2="206" /><text x="640" y="168" data-given="cutHeight" data-value="3">3 м</text></g></svg>
