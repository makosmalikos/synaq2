<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">P, V, T бір түзуде. Оң жақта VT қабырғасы бойында тікбұрышты сызғыш тұр. VR қабырғасы VT-мен 45° жасайды; сол жақтағы сұралған бұрышқа сұрақ белгісі қойылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-ruler="known" points="180,270 380,270 380,70" fill="#8ec7db" fill-opacity=".75" stroke="#23394b" stroke-width="2"/><path data-right="known" d="M367 270 L367 257 L380 257" fill="none" stroke="#23394b" stroke-width="1.6"/><line x1="40" y1="270" x2="420" y2="270" stroke="#23394b" stroke-width="1.8" data-straight="true"/><text x="164" y="299" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="V">V</text><text x="25" y="278" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="P">P</text><text x="432" y="278" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="T">T</text><text x="392" y="58" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="R">R</text><path data-arc="TR" d="M260 270 A80 80 0 0 0 236.5685424949238 213.4314575050762" fill="none" stroke="#80b5ef" stroke-width="2.3"/><text x="275.15959184866256" y="238.58360646639574" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="TR">45°</text><path data-arc="RP" d="M243.63961030678928 206.36038969321072 A90 90 0 0 0 90 270" fill="none" stroke="#80b5ef" stroke-width="2.3"/><text x="136.75677214274486" y="173.6016128262246" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="RP">?</text></g></svg>