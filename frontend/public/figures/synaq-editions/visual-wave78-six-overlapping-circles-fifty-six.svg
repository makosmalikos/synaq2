<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">6 бірдей шеңбердің центрлері бір көлденең түзуде. Көрші шеңбер әрқайсысының центрінен өтеді, центрлер нүктемен көрінеді. Екі сыртқы шет арасындағы өлшем 56 см.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="row0" cx="115" cy="160" r="50" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-center="0" cx="115" cy="160" r="3.5" fill="#213a53"/><circle data-circle="row1" cx="165" cy="160" r="50" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-center="1" cx="165" cy="160" r="3.5" fill="#213a53"/><circle data-circle="row2" cx="215" cy="160" r="50" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-center="2" cx="215" cy="160" r="3.5" fill="#213a53"/><circle data-circle="row3" cx="265" cy="160" r="50" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-center="3" cx="265" cy="160" r="3.5" fill="#213a53"/><circle data-circle="row4" cx="315" cy="160" r="50" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-center="4" cx="315" cy="160" r="3.5" fill="#213a53"/><circle data-circle="row5" cx="365" cy="160" r="50" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-center="5" cx="365" cy="160" r="3.5" fill="#213a53"/><line x1="65" y1="246" x2="65" y2="266" stroke="#213a53" stroke-width="2" data-measure-end="left"/><line x1="415" y1="246" x2="415" y2="266" stroke="#213a53" stroke-width="2" data-measure-end="right"/><line x1="65" y1="260" x2="415" y2="260" stroke="#213a53" stroke-width="2" data-measure="total"/><text x="240" y="302" text-anchor="middle" fill="#213a53" font-size="28" data-given="span">56 см</text></g></svg>