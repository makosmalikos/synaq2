<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық координаталарды сәуледен оқу</title><desc id="desc">Жоғарғы сәуленің сол жақ белгісі 2, оң жағы 3, арасы 10 тең қадам. Сол жақтан 6 және 7 қадамдағы екі көрші белгі арасы көк. Көк кесінді төменде 10 есе үлкейтілген, оның физикалық ұзындығы жоғарғы бірлік кесіндісіне тең. Төменгі кесінді 10 тең қадамға бөлінген; A төменгі сол шеттен 4 қадамда.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="22">Көк аралықтың он есе үлкейтілуі</text><line x1="28" y1="111" x2="449" y2="111" stroke="#203549" stroke-width="1.7" data-axis="upper"/><path d="M 449 111 L 439 106 L 439 116 Z" fill="#203549"/><line x1="36" y1="101" x2="36" y2="121" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="0"/><line x1="75" y1="105" x2="75" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="1"/><line x1="114" y1="105" x2="114" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="2"/><line x1="153" y1="105" x2="153" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="3"/><line x1="192" y1="105" x2="192" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="4"/><line x1="231" y1="105" x2="231" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="5"/><line x1="270" y1="105" x2="270" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="6"/><line x1="309" y1="105" x2="309" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="7"/><line x1="348" y1="105" x2="348" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="8"/><line x1="387" y1="105" x2="387" y2="117" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="9"/><line x1="426" y1="101" x2="426" y2="121" stroke="#203549" stroke-width="1.7" data-tick-axis="upper" data-index="10"/><text x="36" y="155" text-anchor="middle" fill="#203549" font-size="24">2</text><text x="426" y="155" text-anchor="middle" fill="#203549" font-size="24">3</text><line x1="270" y1="111" x2="309" y2="111" stroke="#203549" stroke-width="1.7" data-highlight="true" style="stroke:#65a8e5;stroke-width:6"/><line x1="270" y1="120" x2="36" y2="265" stroke="#203549" stroke-width="1.7" stroke-dasharray="4 5" style="stroke:#91a5bc"/><line x1="309" y1="120" x2="426" y2="265" stroke="#203549" stroke-width="1.7" stroke-dasharray="4 5" style="stroke:#91a5bc"/><rect x="58" y="188" width="364" height="32" fill="#fff"/><text x="240" y="211" text-anchor="middle" fill="#203549" font-size="22">10 есе үлкейтілген аралық</text><line x1="28" y1="265" x2="449" y2="265" stroke="#203549" stroke-width="1.7" data-axis="lower"/><path d="M 449 265 L 439 260 L 439 270 Z" fill="#203549"/><line x1="36" y1="255" x2="36" y2="275" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="0"/><line x1="75" y1="259" x2="75" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="1"/><line x1="114" y1="259" x2="114" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="2"/><line x1="153" y1="259" x2="153" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="3"/><line x1="192" y1="259" x2="192" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="4"/><line x1="231" y1="259" x2="231" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="5"/><line x1="270" y1="259" x2="270" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="6"/><line x1="309" y1="259" x2="309" y2="271" stroke="#203549" stroke-width="1.7" data-tick-axis="lower" data-index="7"/><line x1="348" y1="