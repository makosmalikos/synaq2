<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="title desc"><title id="title">Рет пен аралықтар зертханасы</title><desc id="desc">Түзудегі u және v сандарының орналасуын салыстырыңыз. Төмендегі теңсіздіктердің қайсысы міндетті түрде дұрыс? Солдан оңға қарай u, v. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a7"/></marker></defs><rect width="480" height="190" fill="white"/><line x1="34" y1="105" x2="448" y2="105" stroke="#708aa9" stroke-width="1.6" marker-end="url(#tip)"/><line x1="48" y1="101" x2="48" y2="109" stroke="#849bb6"/><line x1="86.4" y1="101" x2="86.4" y2="109" stroke="#849bb6"/><line x1="124.8" y1="101" x2="124.8" y2="109" stroke="#849bb6"/><line x1="163.2" y1="101" x2="163.2" y2="109" stroke="#849bb6"/><line x1="201.6" y1="101" x2="201.6" y2="109" stroke="#849bb6"/><line x1="240" y1="101" x2="240" y2="109" stroke="#849bb6"/><line x1="278.4" y1="101" x2="278.4" y2="109" stroke="#849bb6"/><line x1="316.8" y1="101" x2="316.8" y2="109" stroke="#849bb6"/><line x1="355.2" y1="101" x2="355.2" y2="109" stroke="#849bb6"/><line x1="393.6" y1="101" x2="393.6" y2="109" stroke="#849bb6"/><line x1="432" y1="101" x2="432" y2="109" stroke="#849bb6"/><circle cx="124.8" cy="105" r="4.5" fill="#6653c1" data-point="u" data-value="-4"/><text x="124.8" y="80" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#5145b3" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">u</text><circle cx="316.8" cy="105" r="4.5" fill="#6653c1" data-point="v" data-value="1"/><text x="316.8" y="80" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#5145b3" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">v</text></svg>
