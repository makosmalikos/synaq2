<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлуді суретпен оқу</title><desc id="desc">6 тең бөлік бір жолақ, толық ұзындық 3,6 м. Бірінші бөлік көк, сұрақ белгісімен.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="44" text-anchor="middle" fill="#203549" font-size="24">Толық ұзындық — м</text><line x1="48" y1="119" x2="432" y2="119" stroke="#203549" stroke-width="2" /><line x1="48" y1="111" x2="48" y2="127" stroke="#203549" stroke-width="2" /><line x1="432" y1="111" x2="432" y2="127" stroke="#203549" stroke-width="2" /><text x="240" y="102" text-anchor="middle" fill="#203549" font-size="28">3,6</text><rect x="48" y="177" width="64" height="62" fill="#b6d9f8" stroke="#203549" stroke-width="1.6" data-part="0"/><rect x="112" y="177" width="64" height="62" fill="#fff" stroke="#203549" stroke-width="1.6" data-part="1"/><rect x="176" y="177" width="64" height="62" fill="#fff" stroke="#203549" stroke-width="1.6" data-part="2"/><rect x="240" y="177" width="64" height="62" fill="#fff" stroke="#203549" stroke-width="1.6" data-part="3"/><rect x="304" y="177" width="64" height="62" fill="#fff" stroke="#203549" stroke-width="1.6" data-part="4"/><rect x="368" y="177" width="64" height="62" fill="#fff" stroke="#203549" stroke-width="1.6" data-part="5"/><text x="80" y="218" text-anchor="middle" fill="#203549" font-size="29">?</text></g></svg>