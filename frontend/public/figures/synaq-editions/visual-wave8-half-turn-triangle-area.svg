<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Координаталар және симметрия</title><desc id="desc">Бірлік торда ABC үшбұрышы мен O нүктесі берілген. O центріне қатысты осы үшбұрыштың бейнесі салынды. Бейненің ауданы неше бірлік шаршыға тең? Жауапқа тек санды жазыңыз. AB көлденең 5 тор, AC тік 4 тор; A бұрышы тік. O үшбұрыштан оң жақта және жоғарыда. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a8"/></marker></defs><rect width="480" height="360" fill="white"/><line x1="84" y1="336" x2="84" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="336" x2="396" y2="336" stroke="#dde7f4" stroke-width="1"/><line x1="110" y1="336" x2="110" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="310" x2="396" y2="310" stroke="#dde7f4" stroke-width="1"/><line x1="136" y1="336" x2="136" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="284" x2="396" y2="284" stroke="#dde7f4" stroke-width="1"/><line x1="162" y1="336" x2="162" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="258" x2="396" y2="258" stroke="#dde7f4" stroke-width="1"/><line x1="188" y1="336" x2="188" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="232" x2="396" y2="232" stroke="#dde7f4" stroke-width="1"/><line x1="214" y1="336" x2="214" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="206" x2="396" y2="206" stroke="#dde7f4" stroke-width="1"/><line x1="240" y1="336" x2="240" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="180" x2="396" y2="180" stroke="#dde7f4" stroke-width="1"/><line x1="266" y1="336" x2="266" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="154" x2="396" y2="154" stroke="#dde7f4" stroke-width="1"/><line x1="292" y1="336" x2="292" y2="24" stroke="#dde7f4" stroke-width="1"/><line x1="84" y1="128" x2="396