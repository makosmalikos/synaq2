<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: Q; R; P. Шаршы тік бұрыш белгілері: ∠PVQ. Доға жазулары: ∠RVP: 31°. Белгісіз өлшемдер санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="240" y2="87" stroke="#23394b" stroke-width="1.8" data-ray="P"/><text x="240" y="71" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="1.8" data-ray="Q"/><text x="452" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="336.82715808309024" y2="113.85254746800291" stroke="#23394b" stroke-width="1.8" data-ray="R"/><text x="349.18807188093155" y="101.28053225115221" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="RP" d="M283.7782363673546 202.14077944032044 A85 85 0 0 0 240 190" fill="none" stroke="#80b5ef" stroke-width="2.3"/><text x="268.86174461645174" y="178.92791105346873" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="RP">31°</text><path data-right="PQ" d="M240 258 L257 258 L257 275" fill="none" stroke="#23394b" stroke-width="1.6"/></g></svg>