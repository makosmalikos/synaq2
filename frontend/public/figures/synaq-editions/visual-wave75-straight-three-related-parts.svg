<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: S; R; Q; P. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="52" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="27" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="93.89655924608951" y2="156.6877664826305" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="74.46791020966523" y="148.95475670638456" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="154.6497860489652" y2="107.49077345258684" stroke="#23394b" stroke-width="2.1" data-ray="R"/><text x="143.30002355547654" y="93.21561034787763" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="S"/><text x="453" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="S">S</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text></g></svg>