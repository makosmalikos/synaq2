<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: P; Q; R. Суреттегі доға жазулары: ∠PVR: 120°; ∠PVQ: 45°. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="453" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="372.936074863071" y2="142.06392513692907" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="390.61374439273465" y="132.38625560726538" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="146.00000000000006" y2="112.18722408852551" stroke="#23394b" stroke-width="2.1" data-ray="R"/><text x="133.50000000000006" y="98.53658899391456" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="PR" d="M365 275 A125 125 0 0 0 177.50000000000003 166.74682452694515" fill="none" stroke="#80b5ef" stroke-width="2.5"/><text x="313.5" y="155.69426564368752" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="PR">120°</text><path data-arc="PQ" d="M310 275 A70 70 0 0 0 289.49747468305833 225.50252531694167" fill="none" stroke="#80b5ef" stroke-width="2.5"/><text x="324.99691699103835" y="247.79312422241173" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="PQ">45°</text></g></svg>