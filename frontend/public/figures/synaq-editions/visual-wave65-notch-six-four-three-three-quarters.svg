<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай және ондық бөлшектері бар суретті есеп</title><desc id="desc">Жоғарғы оң бұрышында ойығы бар фигура. Сыртқы төменгі ұзындық 6,4, сол толық биіктік 3 бүтін 3/4. Ойық ені 2,4, ішкі тік тереңдік 1 бүтін 1/2.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="30" text-anchor="middle" fill="#203549" font-size="24">Өлшемдер — дм</text><path data-composite="true" d="M 101 80 L 297 80 L 297 153.5 L 414.6 153.5 L 414.6 263.75 L 101 263.75 Z" fill="#a8d3fa" stroke="#203549" stroke-width="2"/><text x="257.8" y="308.75" text-anchor="middle" fill="#203549" font-size="27">6,4</text><text x="28" y="178.875" text-anchor="middle" fill="#203549" font-size="27">3</text><text x="54" y="162.875" text-anchor="middle" fill="#203549" font-size="24">3</text><line x1="40" y1="170.875" x2="68" y2="170.875" stroke="#203549" stroke-width="2" /><text x="54" y="195.875" text-anchor="middle" fill="#203549" font-size="24">4</text><text x="355.8" y="136.5" text-anchor="middle" fill="#203549" font-size="26">2,4</text><text x="225" y="117.75" text-anchor="middle" fill="#203549" font-size="26">1</text><text x="251" y="101.75" text-anchor="middle" fill="#203549" font-size="23">1</text><line x1="237" y1="109.75" x2="265" y2="109.75" stroke="#203549" stroke-width="2" /><text x="251" y="134.75" text-anchor="middle" fill="#203549" font-size="23">2</text></g></svg>