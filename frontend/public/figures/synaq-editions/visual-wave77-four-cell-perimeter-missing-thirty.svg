<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Төрт ұяшық: жоғарғы солда 14 см, жоғарғы оңда 20 см, төменгі солда 24 см периметр жазулары бар. Төменгі оң ұяшықта сұрақ белгісі. Жеке ен мен биіктік жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="110,300 370,300 370,40 110,40" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><line x1="204.54545454545456" y1="300" x2="204.54545454545456" y2="40" stroke="#243a51" stroke-width="2" data-divider="v"/><line x1="110" y1="110.9090909090909" x2="370" y2="110.9090909090909" stroke="#243a51" stroke-width="2" data-divider="h"/><text x="157.27272727272725" y="83.45454545454545" text-anchor="middle" fill="#243a51" font-size="27" data-cell-perimeter="0">14 см</text><text x="287.27272727272725" y="83.45454545454545" text-anchor="middle" fill="#243a51" font-size="27" data-cell-perimeter="1">20 см</text><text x="157.27272727272725" y="213.45454545454544" text-anchor="middle" fill="#243a51" font-size="27" data-cell-perimeter="2">24 см</text><text x="287.27272727272725" y="213.45454545454544" text-anchor="middle" fill="#243a51" font-size="27" data-cell-perimeter="3">?</text></g></svg>