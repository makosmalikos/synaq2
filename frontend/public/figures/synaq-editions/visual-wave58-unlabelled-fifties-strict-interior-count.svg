<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық координаталарды сәуледен оқу</title><desc id="desc">Бірдей аралықты сәуле. Жазылған белгілер: 6,2 саны 0-белгіде; 6,6 саны 8-белгіде. A сол жақ алғашқы белгіден 3 қадам оңда; B сол жақ алғашқы белгіден 10 қадам оңда. Нұсқар оңға бағытталған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="66" text-anchor="middle" fill="#203549" font-size="24">Координаталық сәуле</text><line x1="28" y1="193" x2="449" y2="193" stroke="#203549" stroke-width="1.7" data-axis="main"/><path d="M 449 193 L 439 188 L 439 198 Z" fill="#203549"/><line x1="36" y1="183" x2="36" y2="203" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="0"/><line x1="68.5" y1="187" x2="68.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="1"/><line x1="101" y1="187" x2="101" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="2"/><line x1="133.5" y1="187" x2="133.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="3"/><line x1="166" y1="187" x2="166" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="4"/><line x1="198.5" y1="187" x2="198.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="5"/><line x1="231" y1="187" x2="231" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="6"/><line x1="263.5" y1="187" x2="263.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="7"/><line x1="296" y1="183" x2="296" y2="203" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="8"/><line x1="328.5" y1="187" x2="328.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="9"/><line x1="361" y1="187" x2="361" y2="199"