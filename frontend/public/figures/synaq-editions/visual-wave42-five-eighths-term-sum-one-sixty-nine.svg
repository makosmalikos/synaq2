<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Тең бөлшектер</title><desc id="desc">Екі жолақ a және b деп аталған. Оң жақтағы ортақ жақша 169 қосындысын білдіреді. Жолақтар масштабсыз, ұзындықтарын өлшеуге болмайды.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="91" y="103" width="190" height="46" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect x="91" y="220" width="270" height="46" fill="#bfa4d7" stroke="#203549" stroke-width="1.6"/><text x="62" y="135" text-anchor="middle" fill="#203549" font-size="28" >a</text><text x="62" y="252" text-anchor="middle" fill="#203549" font-size="28" >b</text><line x1="399" y1="103" x2="413" y2="103" stroke="#203549" stroke-width="1.5" /><line x1="413" y1="103" x2="413" y2="266" stroke="#203549" stroke-width="1.5" /><line x1="399" y1="266" x2="413" y2="266" stroke="#203549" stroke-width="1.5" /><text x="447" y="194" text-anchor="middle" fill="#203549" font-size="26" >169</text><text x="240" y="324" text-anchor="middle" fill="#203549" font-size="23" >Сызба масштабсыз</text></g></svg>