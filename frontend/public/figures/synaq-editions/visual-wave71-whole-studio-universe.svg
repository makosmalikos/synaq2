<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">A, B жиындарының тіктөртбұрыш ішіндегі диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек A = 6; тек A және B = 4; тек B = 5; екі дөңгелектен де тыс = 7.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-universe="true" x="18" y="58" width="444" height="280" rx="4" fill="none" stroke="#203549" stroke-width="1.7"/><circle cx="170" cy="190" r="110" fill="#80b6ec" fill-opacity=".24"/><circle cx="310" cy="190" r="110" fill="#ebc561" fill-opacity=".24"/><circle data-set="A" cx="170" cy="190" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="B" cx="310" cy="190" r="110" fill="none" stroke="#203549" stroke-width="2"/><text x="110" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="A" data-count="6">6</text><text x="240" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="4">4</text><text x="370" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="B" data-count="5">5</text><text x="435" y="315" text-anchor="middle" fill="#203549" font-size="30" data-region="OUT" data-count="7">7</text><text x="80" y="90" text-anchor="middle" fill="#203549" font-size="29" >A</text><text x="400" y="90" text-anchor="middle" fill="#203549" font-size="29" >B</text></g></svg>