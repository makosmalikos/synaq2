<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі аралас сандар</title><desc id="desc">Тіктөртбұрыш: ұзындығы (9 + (1/6)) сантиметр, ені «?». Сызба масштабсыз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="22">Ұзындықтар — сантиметрмен</text><g data-mixed="9,1,6"><text x="218" y="92" text-anchor="middle" fill="#203549" font-size="27">9</text><text x="252" y="75" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="236" y1="84" x2="268" y2="84" stroke="#203549" stroke-width="2" /><text x="252" y="110" text-anchor="middle" fill="#203549" font-size="22">6</text></g><rect data-rectangle="true" x="90" y="129" width="300" height="177.27272727272725" fill="#e8effd" stroke="#203549" stroke-width="3"/><text x="428" y="226.63636363636363" text-anchor="middle" fill="#203549" font-size="31">?</text><text x="240" y="346" text-anchor="middle" fill="#203549" font-size="19">Сызба масштабсыз</text></g></svg>