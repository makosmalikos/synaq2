<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Рет пен аралықтар зертханасы</title><desc id="desc">Сызбадағы екі дұрыс теңсіздік мүшелеп қосылды. Сызықтың астындағы сұрақ белгісінің орнына қандай сан жазылады? Жауапқа тек санды жазыңыз. Берілген жолдар 6,5 &gt; 3 және 4,5 &gt; 2. Қосындының сол жағы белгісіз, оң жағы 5. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a7"/></marker></defs><rect width="480" height="260" fill="white"/><text x="155" y="65" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">6,5</text><text x="245" y="65" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">&gt;</text><text x="335" y="65" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">3</text><text x="155" y="129" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">4,5</text><text x="245" y="129" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">&gt;</text><text x="335" y="129" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">2</text><text x="80" y="129" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">+</text><line x1="106" y1="169" x2="384" y2="169" stroke="#8da1bf" stroke-width="2"/><text x="155" y="214" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#b56571" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">?</text><text x="245" y="214" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">&gt;</text><text x="335" y="214" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">5</text></svg>
