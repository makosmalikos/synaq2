<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Координаталар және симметрия</title><desc id="desc">k түзуі — ABC бұрышының симметрия осі, D нүктесі осы түзуде жатыр. Берілген жарты бұрышты пайдаланып, ABC бұрышының градустық өлшемін табыңыз. Жауапқа тек санды жазыңыз. BA және BC сәулелері k түзуінің екі жағында; D осы осьте. ABD = 42°. Төменгі жарты бұрыштың өлшемі берілмеген. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a8"/></marker></defs><rect width="480" height="360" fill="white"/><line x1="100" y1="180" x2="263.4919" y2="32.7913" stroke="#7b64bc" stroke-width="2.6" data-ray-degrees="42"/><line x1="100" y1="180" x2="263.4919" y2="327.2087" stroke="#7b64bc" stroke-width="2.6" data-ray-degrees="-42"/><line x1="100" y1="180" x2="405" y2="180" stroke="#bd9b66" stroke-width="2" stroke-dasharray="7 5"/><path d="M165,180 A65,65 0 0,0 148.3044,136.5065" fill="none" stroke="#a58bc8" stroke-width="1.8"/><text x="184.9558" y="147.3885" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">42°</text><text x="84" y="186" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">B</text><text x="277.4919" y="24.7913" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">A</text><text x="277.4919" y="335.2087" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">C</text><text x="368" y="164" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">D</text><text x="417" y="182" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#a38355" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">k</text></svg>
