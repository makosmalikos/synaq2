<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Қосу және азайту</title><desc id="desc">1-күн 1480; 2-күн сол мөлшерден 460 артық; 3-күн алғашқы екі күннің қосындысынан 1950 кем, ол үзік бөлікпен көрсетілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="99" font-size="23" fill="#203549" text-anchor="middle">1</text><text x="30" y="184" font-size="23" fill="#203549" text-anchor="middle">2</text><text x="30" y="269" font-size="23" fill="#203549" text-anchor="middle">3</text><rect x="65" y="72" width="151.46198830409355" height="40" fill="#cddcff" stroke="#203549" stroke-width="1.8" data-first="1480"/><text x="140.73099415204678" y="99" font-size="22" fill="#203549" text-anchor="middle">1480</text><rect x="65" y="157" width="151.46198830409355" height="40" fill="#cddcff" stroke="#203549" stroke-width="1.8" /><text x="140.73099415204678" y="184" font-size="22" fill="#203549" text-anchor="middle">1480</text><rect x="216.46198830409355" y="157" width="47.07602339181286" height="40" fill="#f7dda0" stroke="#203549" stroke-width="1.8" data-more="460"/><text x="239.99999999999997" y="184" font-size="22" fill="#203549" text-anchor="middle">460</text><rect x="65" y="242" width="150.43859649122805" height="40" fill="#cddcff" stroke="#203549" stroke-width="1.8" /><text x="140.21929824561403" y="269" font-size="22" fill="#203549" text-anchor="middle">?</text><rect x="215.43859649122805" y="242" width="199.56140350877192" height="40" fill="#fff" stroke="#203549" stroke-width="1.8" stroke-dasharray="6 4" data-deficit="1950"/><text x="315.219298245614" y="269" font-size="22" fill="#203549" text-anchor="middle">1950</text><text x="240" y="327" font-size="19" fill="#203549" text-anchor="middle">3-жолақтың толық ені = 1-күн + 2-күн</text></g></svg>