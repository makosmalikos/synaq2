<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Құрама фигуралар шеберханасы</title><desc id="desc">Шеберхананың 8 × 4 м қабырғасында 3 × 1 м терезе және 2 × 3 м есік бар. Олардың орындарына тұсқағаз жапсырылмайды. Қалған қабырғаға неше м² тұсқағаз қажет? Көк бөліктер есепке алынады; ашық түсті ойықтар мен бос орындар алынбайды.</desc><rect width="480" height="360" fill="white"/><rect x="107.5" y="88.75" width="265" height="132.5" fill="#a8bfff" fill-opacity="1" /><rect x="140.625" y="121.875" width="99.375" height="33.125" fill="#fff7e9" stroke="#d49648" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="273.125" y="121.875" width="66.25" height="99.375" fill="#fff7e9" stroke="#d49648" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M107.5,88.75L140.625,88.75 M107.5,121.875L107.5,88.75 M140.625,88.75L173.75,88.75 M173.75,121.875L140.625,121.875 M173.75,88.75L206.875,88.75 M206.875,121.875L173.75,121.875 M206.875,88.75L240,88.75 M240,121.875L206.875,121.875 M240,88.75L273.125,88.75 M273.125,88.75L306.25,88.75 M306.25,121.875L273.125,121.875 M306.25,88.75L339.375,88.75 M339.375,121.875L306.25,121.875 M339.375,88.75L372.5,88.75 M372.5,88.75L372.5,121.875 M140.625,121.875L140.625,155 M107.5,155L107.5,121.875 M273.125,121.875L273.125,155 M240,155L240,121.875 M372.5,121.875L372.5,155 M339.375,155L339.375,121.875 M107.5,188.125L107.5,155 M140.625,155L173.75,155 M173.75,155L206.875,155 M206.875,155L240,155 M273.125,155L273.125,188.125 M372.5,155L372.5,188.125 M339.375,188.125L339.375,155 M140.625,221.25L107.5,221.25 M107.5,221.25L107.5,188.125 M173.75,221.25L140.625,221.25 M206.875,221.25L173.75,221.25 M240,221.25L206.875,221.25 M273.125,188.125L273.125,221.25 M273.125,221.25L240,221.25 M372.5,188.125L372.5,221.25 M372.5,221.25L339.375,221.25 M339.375,221.25L339.375,188.125" fill="none" stroke="#496fa7" stroke-width="2.3" stroke-linecap="square"/><path d="M107.5,64.75L372.