<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">AB диаметріндегі рет A,O,M,B. O — центр; OC шеңбер бойындағы C нүктесіне дейін. OC жазуы 13 см, OM жазуы 5 см. AM мен MB дайын ұзындықтары жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="main" cx="240" cy="160" r="115" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="125" y1="160" x2="355" y2="160" stroke="#213a53" stroke-width="2" data-segment="AB"/><line x1="240" y1="160" x2="182.50000000000003" y2="60.40707856478954" stroke="#213a53" stroke-width="2" data-segment="OC"/><circle data-point="A" cx="125" cy="160" r="3.8" fill="#213a53"/><text x="125" y="188" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text><circle data-point="O" cx="240" cy="160" r="3.8" fill="#213a53"/><text x="240" y="188" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text><circle data-point="M" cx="284.2307692307692" cy="160" r="3.8" fill="#213a53"/><text x="284.2307692307692" y="188" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="M">M</text><circle data-point="B" cx="355" cy="160" r="3.8" fill="#213a53"/><text x="355" y="188" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="B">B</text><circle data-point="C" cx="182.50000000000003" cy="60.40707856478954" r="3.8" fill="#213a53"/><text x="172.50000000000003" y="50.08657048910077" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="C">C</text><text x="195.6615427318801" y="127.20353928239477" text-anchor="middle" fill="#213a53" font-size="27" data-given="radius">13 см</text><text x="262.11538461538464" y="150" text-anchor="middle" fill="#213a53" font-size="27" data-given="inner">5 см</text></g></svg>