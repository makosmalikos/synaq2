<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">PVQ бұрышының V төбесі төменгі сол жақта. VP сәулесі оңға, VQ жоғары қарай сәл солға бағытталған. K қызыл нүктесі V-ден жоғары оңда; L жоғары жақта, Q белгісіне қарағанда V-ге жақынырақ; M сол жақта; N төменгі оң жақта. Нүктелердің сәулелерге дәл қатынасын сызбадан анықтау керек.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="140" y1="270" x2="330" y2="270" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="355" y="278" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="140" y1="270" x2="107.00684624328323" y2="82.88652692768048" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="102.66564180160998" y="66.26633310237528" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><circle cx="140" cy="270" r="4" fill="#23394b"/><text x="124" y="300" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><circle data-candidate="K" cx="239.58577760546714" cy="186.4376107407499" r="5" fill="#b94f69"/><text x="256.5857776054671" y="176.4376107407499" text-anchor="middle" fill="#23394b" font-size="28" >K</text><circle data-candidate="L" cx="118.29397779163371" cy="146.899030873474" r="5" fill="#b94f69"/><text x="135.29397779163372" y="136.899030873474" text-anchor="middle" fill="#23394b" font-size="28" >L</text><circle data-candidate="M" cx="53.98903534965588" cy="209.77447418314011" r="5" fill="#b94f69"/><text x="37.98903534965588" y="199.77447418314011" text-anchor="middle" fill="#23394b" font-size="28" >M</text><circle data-candidate="N" cx="252.763114494309" cy="311.04241719908026" r="5" fill="#b94f69"/><text x="269.763114494309" y="321.04241719908026" text-anchor="middle" fill="#23394b" font-size="28" >N</text></g></svg>