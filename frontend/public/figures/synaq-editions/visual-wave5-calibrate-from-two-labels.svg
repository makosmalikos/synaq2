<svg xmlns="http://www.w3.org/2000/svg" width="480" height="165" viewBox="0 0 480 165" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Түзудегі көрші сызықшалар бірдей аралықта орналасқан. Тек A және B координаталары берілген. C нүктесінің координатасын анықтаңыз. Жауапқа тек санды жазыңыз. Нүктелер: A(-4), B(4), C — белгісіз координата. A мен B арасында 4 тең аралық; C нүктесі B нүктесінен оңға 3 сондай аралықта. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="165" fill="white"/><line x1="35" y1="95" x2="447" y2="95" stroke="#456487" stroke-width="2" marker-end="url(#tip)"/><line x1="48" y1="89" x2="48" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="-8"/><line x1="82.909" y1="89" x2="82.909" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="-6"/><line x1="117.818" y1="89" x2="117.818" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="-4"/><line x1="152.727" y1="89" x2="152.727" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="-2"/><line x1="187.636" y1="89" x2="187.636" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="0"/><line x1="222.545" y1="89" x2="222.545" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="2"/><line x1="257.455" y1="89" x2="257.455" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="4"/><line x1="292.364" y1="89" x2="292.364" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="6"/><line x1="327.273" y1="89" x2="327.273" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="8"/><line x1="362.182" y1="89" x2="362.182" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="10"/><line x1="397.091" y1="89" x2="397.091" y2="101" stroke="#6a88ac" stroke-width="1.5" data-scale-tick="12"/><line x1="432" y1="89" x2="432" 