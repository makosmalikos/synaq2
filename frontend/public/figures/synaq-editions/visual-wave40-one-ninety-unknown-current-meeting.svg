7" x2="143" y2="192" stroke="#203549" stroke-width="2.3" /><g data-boat="0" data-direction="1" transform="translate(120 233) scale(1 1)"><path d="M -36 0 H 45 L 28 19 H -24 Z" fill="#95c6aa" stroke="#203549" stroke-width="1.7"/><rect x="-18" y="-22" width="34" height="22" rx="3" fill="#f4f8fc" stroke="#203549" stroke-width="1.5"/><rect x="-10" y="-16" width="16" height="9" fill="#aacbdf"/></g><text x="360" y="168" text-anchor="middle" fill="#203549" font-size="24" >14 км/сағ</text><line x1="391" y1="187" x2="329" y2="187" stroke="#203549" stroke-width="2.3" data-own-speed="14" data-direction="-1"/><line x1="329" y1="187" x2="337" y2="182" stroke="#203549" stroke-width="2.3" /><line x1="329" y1="187" x2="337" y2="192" stroke="#203549" stroke-width="2.3" /><g data-boat="1" data-direction="-1" transform="translate(360 233) scale(-1 1)"><path d="M -36 0 H 45 L 28 19 H -24 Z" fill="#c2a9d9" stroke="#203549" stroke-width="1.7"/><rect x="-18" y="-22" width="34" height="22" rx="3" fill="#f4f8fc" stroke="#203549" stroke-width="1.5"/><rect x="-10" y="-16" width="16" height="9" fill="#aacbdf"/></g></g></svg>