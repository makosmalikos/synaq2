<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Таңбалы шамалар зертханасы</title><desc id="desc">Тік шахтадағы лифт M деңгейінен N деңгейіне түседі. Үзік сызық теңіз деңгейін білдіреді. Лифт жүрген қашықтық пен төменгі деңгейдің таңбалы биіктігін дұрыс көрсететін жұпты таңдаңдар. Көрсетілген нүктелер: M(180), N(-300). </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6574b1"/></marker></defs><rect width="480" height="360" fill="white"/><rect x="25" y="38" width="430" height="104" fill="#f3f7ff"/><rect x="25" y="142" width="430" height="150" fill="#e3efff"/><line x1="28" y1="142" x2="450" y2="142" stroke="#57a0c8" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="191" y1="282" x2="191" y2="42" stroke="#536f94" stroke-width="1.5" marker-end="url(#tip)"/><line x1="185" y1="274" x2="197" y2="274" stroke="#6583a7" stroke-width="1.5" data-height-tick="0"/><text x="151" y="274" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#375b82" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >-360</text><line x1="185" y1="252" x2="197" y2="252" stroke="#6583a7" stroke-width="1" data-height-tick="1"/><line x1="185" y1="230" x2="197" y2="230" stroke="#6583a7" stroke-width="1.5" data-height-tick="2"/><text x="151" y="230" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#375b82" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >-240</text><line x1="185" y1="208" x2="197" y2="208" stroke="#6583a7" stroke-width="1" data-height-tick="3"/><line x1="185" y1="186" x2="197" y2="186" stroke="#6583a7" stroke-width="1.5" data-height-tick="4"/><text x="151" y="186" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#375b82" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >-120</text><line x1="185" y1="164" x2="197" y2="164" stroke="#6583a7" stroke-width="1" data-height-tick="5"/><line x1="185" y1="142" x2="197" y2="142" stroke="#6583a7" stroke-width="1.5" data-height-tick="6"/><text x="151" y="142" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#375b82" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >0</text><line x1="185" y1="120" x2="197" y2="120" stroke="#6583a7" stroke-width="1" data-height-tick="7"/><line x1="185" y1="98" x2="197" y2="98" stroke="#6583a7" stroke-width="1.5" data-height-tick="8"/><text x="151" y="98" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#375b82" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >+120</text><line x1="185" y1="76" x2="197" y2="76" stroke="#6583a7" stroke-width="1" data-height-tick="9"/><line x1="185" y1="54" x2="197" y2="54" stroke="#6583a7" stroke-width="1.5" data-height-tick="10"/><text x="151" y="54" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#375b82" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >+240</text><line x1="200" y1="76" x2="309" y2="76" stroke="#9bafd0" stroke-dasharray="4 4"/><circle cx="309" cy="76" r="4.5" fill="#6853ca"/><text x="330" y="76" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#5540a9" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" data-point="M" data-tick-index="9">M</text><line x1="200" y1="252" x2="309" y2="252" stroke="#9bafd0" stroke-dasharray="4 4"/><circle cx="309" cy="252" r="4.5" fill="#6853ca"/><text x="330" y="252" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle