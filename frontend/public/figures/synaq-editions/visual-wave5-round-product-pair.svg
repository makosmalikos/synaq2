<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Карточкалардағы барлық сан көбейтіледі. Есептеуді ыңғайлау үшін алдымен көбейтіндісі 1000 болатын екі көбейткішті таңдаңыз. Карточкалардағы сандар: -125, 3, 6, -8. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="220" fill="white"/><rect x="41" y="64" width="90.5" height="92" rx="14" fill="#fff0e9" stroke="#dba88c" stroke-width="1.5"/><text x="86.25" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#a9543d" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">-125</text><rect x="143.5" y="64" width="90.5" height="92" rx="14" fill="#e7edff" stroke="#8ba1d9" stroke-width="1.5"/><text x="188.75" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#4a59af" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">3</text><rect x="246" y="64" width="90.5" height="92" rx="14" fill="#e7edff" stroke="#8ba1d9" stroke-width="1.5"/><text x="291.25" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#4a59af" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">6</text><rect x="348.5" y="64" width="90.5" height="92" rx="14" fill="#fff0e9" stroke="#dba88c" stroke-width="1.5"/><text x="393.75" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#a9543d" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">-8</text></svg>
