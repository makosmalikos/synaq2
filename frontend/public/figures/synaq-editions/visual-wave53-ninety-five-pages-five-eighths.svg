<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сурет бойынша бөлшектерді бөлу</title><desc id="desc">Кітап жолағы 8 тең ұяшық, сол жақтағы 5 ұяшық көк. Көк бөлікті қамтитын нұсқарда 95 бет деп жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="22">Кітаптағы оқылған беттер</text><line x1="42" y1="130" x2="289.5" y2="130" stroke="#203549" stroke-width="2" data-bracket="known-read"/><line x1="42" y1="130" x2="48" y2="126" stroke="#203549" stroke-width="2" /><line x1="42" y1="130" x2="48" y2="134" stroke="#203549" stroke-width="2" /><line x1="289.5" y1="130" x2="283.5" y2="126" stroke="#203549" stroke-width="2" /><line x1="289.5" y1="130" x2="283.5" y2="134" stroke="#203549" stroke-width="2" /><text x="165.75" y="108" text-anchor="middle" fill="#203549" font-size="24">95 бет</text><rect data-strip="pages" data-part="0" data-painted="true" x="42" y="183" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="pages" data-part="1" data-painted="true" x="91.5" y="183" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="pages" data-part="2" data-painted="true" x="141" y="183" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="pages" data-part="3" data-painted="true" x="190.5" y="183" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="pages" data-part="4" data-painted="true" x="240" y="183" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="pages" data-part="5" data-painted="false" x="289.5" y="183" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.5"/><rect data-strip="pages" data-part