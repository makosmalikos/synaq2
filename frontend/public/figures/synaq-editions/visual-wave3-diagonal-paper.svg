<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Құрама фигуралар шеберханасы</title><desc id="desc">Қабырғалары 12 см және 7 см тіктөртбұрыш диагональмен екі бірдей бөлікке бөлінді. Көк үшбұрыштың ауданы неше см²? Көк бөліктер есепке алынады; ашық түсті ойықтар мен бос орындар алынбайды.</desc><rect width="480" height="360" fill="white"/><rect x="107.5" y="77.708" width="265" height="154.583" fill="white" stroke="#899ab6" stroke-width="1.5" stroke-dasharray="6 5"/><polygon points="107.5,77.708 372.5,77.708 107.5,232.292" fill="#a8bfff" stroke="#496fa7" stroke-width="2.3"/><path d="" fill="none" stroke="#496fa7" stroke-width="2.3" stroke-linecap="square"/><path d="M107.5,53.708L372.5,53.708 M107.5,49.708v8 M372.5,49.708v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="240" y="40.708" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">12 см</text><path d="M83.5,77.708L83.5,232.292 M79.5,77.708h8 M79.5,232.292h8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="58.5" y="155" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">7 см</text><text x="240" y="350" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#4164a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Көк бөлік есепке алынады</text></svg>
