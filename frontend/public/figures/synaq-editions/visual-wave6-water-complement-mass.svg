<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Қозғалыс пен өзгерістер сызбасы</title><desc id="desc">Ыдыстағы ерітінді тек тұз бен судан тұрады. Сызбада ерітіндінің толық массасы және тұздың массалық үлесі берілген. Ыдыста неше грамм су бар? Жауапқа тек санды жазыңыз. Ерітінді массасы 450 г; тұздың массалық үлесі 14%. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6b80ae"/></marker></defs><rect width="480" height="360" fill="white"/><path d="M130,61 L130,276 Q130,297 151,297 L329,297 Q350,297 350,276 L350,61" fill="#f4f9ff" stroke="#7799bb" stroke-width="2.2"/><path d="M132,150 L348,150 L348,275 Q348,295 328,295 L152,295 Q132,295 132,275 Z" fill="#b9d9ee"/><path d="M132,150 Q185,141 240,150 T348,150" fill="none" stroke="#75a9cc" stroke-width="2"/><text x="240" y="105" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="27" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Ерітінді: 450 г</text><text x="240" y="209" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="28" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Тұз: 14%</text><text x="240" y="333" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Тек тұз бен су</text></svg>
