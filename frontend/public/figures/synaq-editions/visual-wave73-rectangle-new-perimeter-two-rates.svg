<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Санның бөлігін пайызбен табу</title><desc id="desc">Бастапқы тіктөртбұрыш. Үстіңгі ұзындық 48 см, сол жақ ені 30 см. Жаңа ұзындықтар суретте жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-dimension-shape="true" x="80" y="90" width="320" height="200" fill="#f2f7ff" stroke="#23394b" stroke-width="2.2"/><text x="240" y="70" text-anchor="middle" fill="#23394b" font-size="29" data-length="true">48 см</text><text x="38" y="198" text-anchor="middle" fill="#23394b" font-size="27" data-width="true">30 см</text></g></svg>