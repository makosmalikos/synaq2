<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Бірден төртке дейін нөмірленген төрт бөлек тұйық сынық сызық. Көкпен ішкі аймақтары берілген, қабырғалардың қиылысуы болса көрінеді. Жауап болатын нөмірге қосымша белгі қойылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g data-panel="1"><polygon data-polygon="panel1" points="62.5,132 187.5,32 62.5,32 187.5,132" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="125" y="155" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="1">1</text></g><g data-panel="2"><polygon data-polygon="panel2" points="282.5,125.5 427.5,125.5 398.5,38.5 282.5,38.5" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="355" y="155" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="2">2</text></g><g data-panel="3"><polygon data-polygon="panel3" points="62.5,302 187.5,302 112.5,202" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="125" y="325" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="3">3</text></g><g data-panel="4"><polygon data-polygon="panel4" points="355,202 302.4268887880866,240.19660112501052 322.50803037670937,302 387.49196962329063,302 407.5731112119134,240.19660112501052" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="355" y="325" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="4">4</text></g></g></svg>