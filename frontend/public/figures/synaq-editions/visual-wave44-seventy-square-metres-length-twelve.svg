<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Аралас сандар</title><desc id="desc">Тік төртбұрыштың ішінде аудан S = 70 м², астында 12 м ұзындық жазылған. Оң жақта ені сұрақ белгісімен белгіленген. Сызба масштабсыз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="70" y="100" width="300" height="144" rx="2" fill="#dbe8df" stroke="#203549" stroke-width="2"/><text x="220" y="184" text-anchor="middle" fill="#203549" font-size="30" >S = 70 м²</text><text x="220" y="283" text-anchor="middle" fill="#203549" font-size="27" >12 м</text><text x="410" y="182" text-anchor="middle" fill="#203549" font-size="32" >?</text><text x="240" y="329" text-anchor="middle" fill="#203549" font-size="23" >Сызба масштабсыз</text></g></svg>