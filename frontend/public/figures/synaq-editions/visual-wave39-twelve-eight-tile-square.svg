<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ еселік</title><desc id="desc">Бір тікбұрышты тақтаның көлденең өлшемі 12 см, тік өлшемі 8 см. Құрастырылатын шаршы әзірге көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="96" y="63" width="288" height="192" fill="#e9dcb2" stroke="#203549" stroke-width="1.8"/><text x="240" y="298" text-anchor="middle" fill="#203549" font-size="28" >12 см</text><text x="54" y="159" text-anchor="middle" fill="#203549" font-size="28" transform="rotate(-90 54 159)">8 см</text></g></svg>