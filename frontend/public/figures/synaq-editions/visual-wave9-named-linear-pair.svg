<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Түзулер мен бұрыштар</title><desc id="desc">O нүктесінен сәулелер: B — оңға бағыттан сағат тіліне қарсы 0° бағытында; D — оңға бағыттан сағат тіліне қарсы 112° бағытында; A — оңға бағыттан сағат тіліне қарсы 180° бағытында; C — оңға бағыттан сағат тіліне қарсы 292° бағытында. Берілген BOD бұрышы 112°. Ізделген бұрыш DOA.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="180" x2="400" y2="180" stroke="#315ce8" stroke-width="3" data-ray="B" data-degrees="0"/><text x="416" y="180" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">B</text><line x1="240" y1="180" x2="180.0629450534541" y2="31.650583269314012" stroke="#315ce8" stroke-width="3" data-ray="D" data-degrees="112"/><text x="174.0692395587995" y="16.815641596245428" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">D</text><line x1="240" y1="180" x2="80" y2="179.99999999999997" stroke="#315ce8" stroke-width="3" data-ray="A" data-degrees="180"/><text x="64" y="179.99999999999997" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">A</text><line x1="240" y1="180" x2="299.9370549465459" y2="328.349416730686" stroke="#315ce8" stroke-width="3" data-ray="C" data-degrees="292"/><text x="305.9307604412005" y="343.1843584037546" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">C</text><circle cx="240" cy="180" r="4" fill="#203549"/><text x="226" y="200" font-size="21" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">O</text><path d="M 298 180 A 58 58 0 0 0 218.2728175818771 126.22333643512633" fill="none" stroke="#8459ce" stro