<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Құрама фигуралар шеберханасы</title><desc id="desc">Бірдей 5 шаршыдан Г тәрізді белгі құрастырылды: 4 шаршы тік бағана түзеді, соңғысы төменгі шаршының оң жағына толық қабырғасымен жалғасады. Әр шаршының қабырғасы 4 см. Белгінің сыртқы периметрі неше см? Көк бөліктер есепке алынады; ашық түсті ойықтар мен бос орындар алынбайды.</desc><rect width="480" height="360" fill="white"/><rect x="188.75" y="52.5" width="51.25" height="51.25" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="188.75" y="103.75" width="51.25" height="51.25" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="188.75" y="155" width="51.25" height="51.25" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="188.75" y="206.25" width="51.25" height="51.25" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><rect x="240" y="206.25" width="51.25" height="51.25" fill="#a8bfff" fill-opacity="1" stroke="white" stroke-width="1"/><path d="M188.75,52.5L240,52.5 M240,52.5L240,103.75 M188.75,103.75L188.75,52.5 M240,103.75L240,155 M188.75,155L188.75,103.75 M240,155L240,206.25 M188.75,206.25L188.75,155 M240,257.5L188.75,257.5 M188.75,257.5L188.75,206.25 M240,206.25L291.25,206.25 M291.25,206.25L291.25,257.5 M291.25,257.5L240,257.5" fill="none" stroke="#496fa7" stroke-width="2.3" stroke-linecap="square"/><path d="M188.75,281.5L240,281.5 M188.75,277.5v8 M240,277.5v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="214.375" y="268.5" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">4 см</text><text x="240" y="350" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#4164a7" stroke="white" stroke-width="