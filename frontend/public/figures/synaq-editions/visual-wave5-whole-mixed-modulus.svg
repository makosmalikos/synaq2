<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Тақтада модуль белгісінің ішінде теріс аралас сан жазылған. Осы өрнектің мәнін таңдаңыз. Модуль ішіндегі берілген сан -(2 + (3/5)). </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="220" fill="white"/><line x1="125" y1="55" x2="125" y2="163" stroke="#4e62a0" stroke-width="3"/><line x1="355" y1="55" x2="355" y2="163" stroke="#4e62a0" stroke-width="3"/><text x="164" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="44" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">−</text><text x="210" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="47" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">2</text><text x="280" y="84" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">3</text><line x1="251" y1="109" x2="309" y2="109" stroke="#345076" stroke-width="2.5"/><text x="280" y="136" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="31" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">5</text></svg>
