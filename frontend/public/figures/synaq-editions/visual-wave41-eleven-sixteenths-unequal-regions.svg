<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бүтіннің бөліктері</title><desc id="desc">Шаршының 4 тең ширегі бар. Сол жоғарғы ширек толық күлгін; оң жоғарғы ширекте тең 2 үшбұрыш бар, біреуі күлгін. Сол төменгі ширекте 4 тең шаршы бар, оның 3-еуі күлгін. Оң төменгі ширекте 2 тең тікбұрыш бар, солы күлгін.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-piece="whole-quarter" data-painted="true" points="100,35 240,35 240,175 100,175" fill="#ba9dd8" stroke="#203549" stroke-width="1.6"/><polygon data-piece="half-quarter-one" data-painted="true" points="240,35 380,35 240,175" fill="#ba9dd8" stroke="#203549" stroke-width="1.6"/><polygon data-piece="half-quarter-two" data-painted="false" points="380,35 380,175 240,175" fill="#fff" stroke="#203549" stroke-width="1.6"/><polygon data-piece="tiny-0" data-painted="true" points="100,175 170,175 170,245 100,245" fill="#ba9dd8" stroke="#203549" stroke-width="1.6"/><polygon data-piece="tiny-1" data-painted="true" points="170,175 240,175 240,245 170,245" fill="#ba9dd8" stroke="#203549" stroke-width="1.6"/><polygon data-piece="tiny-2" data-painted="true" points="100,245 170,245 170,315 100,315" fill="#ba9dd8" stroke="#203549" stroke-width="1.6"/><polygon data-piece="tiny-3" data-painted="false" points="170,245 240,245 240,315 170,315" fill="#fff" stroke="#203549" stroke-width="1.6"/><polygon data-piece="lower-half-one" data-painted="true" points="240,175 310,175 310,315 240,315" fill="#ba9dd8" stroke="#203549" stroke-width="1.6"/><polygon data-piece="lower-half-two" data-painted="false" points="310,175 380,175 380,315 310,315" fill="#fff" stroke="#203549" stroke-width="1.6"/><line x1="100" y1="175" x2="380" y2="175" stroke="#203549" stroke-width="2.5" /><line x1="240" y1="35" x2="240" y2="315" stroke="#203549" stroke-width="2.5" /></g></svg>