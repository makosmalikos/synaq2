<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Тең бөлшектер</title><desc id="desc">Тік шкалада әр белгі 5 қарындаш. Қызыл бағана 20, көк бағана 30 деңгейіне жетеді. Жасыл орында сұрақ белгісі бар, бағана биіктігі көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="72" y1="290" x2="430" y2="290" stroke="#203549" stroke-width="1.5" /><line x1="72" y1="290" x2="72" y2="65" stroke="#203549" stroke-width="1.5" /><line x1="72" y1="290" x2="430" y2="290" stroke="#cad7e4" stroke-width="1" /><text x="48" y="298" text-anchor="middle" fill="#203549" font-size="23" >0</text><line x1="72" y1="260" x2="430" y2="260" stroke="#cad7e4" stroke-width="1" /><text x="48" y="268" text-anchor="middle" fill="#203549" font-size="23" >5</text><line x1="72" y1="230" x2="430" y2="230" stroke="#cad7e4" stroke-width="1" /><text x="48" y="238" text-anchor="middle" fill="#203549" font-size="23" >10</text><line x1="72" y1="200" x2="430" y2="200" stroke="#cad7e4" stroke-width="1" /><text x="48" y="208" text-anchor="middle" fill="#203549" font-size="23" >15</text><line x1="72" y1="170" x2="430" y2="170" stroke="#cad7e4" stroke-width="1" /><text x="48" y="178" text-anchor="middle" fill="#203549" font-size="23" >20</text><line x1="72" y1="140" x2="430" y2="140" stroke="#cad7e4" stroke-width="1" /><text x="48" y="148" text-anchor="middle" fill="#203549" font-size="23" >25</text><line x1="72" y1="110" x2="430" y2="110" stroke="#cad7e4" stroke-width="1" /><text x="48" y="118" text-anchor="middle" fill="#203549" font-size="23" >30</text><line x1="72" y1="80" x2="430" y2="80" stroke="#cad7e4" stroke-width="1" /><text x="48" y="88" text-anchor="middle" fill="#203549" font-size="23" >35</text><rect data-bar="0" x="104" y="170" width="64" height="120" fill="#df9eaa" stroke="#203549" stroke-width="1.5"/>