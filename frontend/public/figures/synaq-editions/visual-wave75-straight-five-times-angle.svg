<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: Q; R; P. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="52" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="27" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="453" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="402.8127759114745" y2="181" stroke="#23394b" stroke-width="2.1" data-ray="R"/><text x="424.46341100608544" y="176.5" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text></g></svg>