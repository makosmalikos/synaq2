<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі бөлшектерді көбейту</title><desc id="desc">Масштабсыз тіктөртбұрыш: ұзындығы (3 + (2/5)) метр, ені «?».</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="22">Қабырғалар — метрмен</text><rect data-rectangle="true" x="115" y="100" width="250" height="183.82352941176472" fill="#e8effd" stroke="#203549" stroke-width="3"/><text x="410" y="200.91176470588238" text-anchor="middle" fill="#203549" font-size="31">?</text><g data-mixed="3,2,5"><text x="208" y="335" text-anchor="middle" fill="#203549" font-size="27">3</text><text x="242" y="318" text-anchor="middle" fill="#203549" font-size="22">2</text><line x1="226" y1="327" x2="258" y2="327" stroke="#203549" stroke-width="2" /><text x="242" y="353" text-anchor="middle" fill="#203549" font-size="22">5</text><text x="283" y="335" text-anchor="middle" fill="#203549" font-size="21">м</text></g></g></svg>