<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Бірден төртке дейін нөмірленген төрт бөлек тұйық сынық сызық. Көкпен ішкі аймақтары берілген, қабырғалардың қиылысуы болса көрінеді. Жауап болатын нөмірге қосымша белгі қойылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g data-panel="1"><polygon data-polygon="panel1" points="125.00000000000001,32 81.69872981077808,56.999999999999986 81.69872981077806,106.99999999999999 125,132 168.30127018922192,107.00000000000003 168.30127018922195,57" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="125" y="155" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="1">1</text></g><g data-panel="2"><polygon data-polygon="panel2" points="292.5,132 417.5,132 342.5,32" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="355" y="155" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="2">2</text></g><g data-panel="3"><polygon data-polygon="panel3" points="62.5,302 187.5,302 187.5,202 125,252 62.5,202" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="125" y="325" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="3">3</text></g><g data-panel="4"><polygon data-polygon="panel4" points="282.5,295.5 427.5,295.5 398.5,208.5 282.5,208.5" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="355" y="325" text-anchor="middle" fill="#243a51" font-size="28" data-panel-number="4">4</text></g></g></svg>