<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кеңістіктегі фигура</title><desc id="desc">P, Q, R — табан төбелері; T — жоғарғы төбе. Әр табан төбесі жоғарғы төбемен жалғасқан. Үзік қырлар PR.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="120" y1="215" x2="360" y2="215" stroke="#315ce8" stroke-width="2.4" data-edge="P:R" data-hidden="true" stroke-dasharray="7 5"/><line x1="360" y1="215" x2="144" y2="319" stroke="#315ce8" stroke-width="2.4" data-edge="Q:R" data-hidden="false"/><line x1="144" y1="319" x2="120" y2="215" stroke="#315ce8" stroke-width="2.4" data-edge="P:Q" data-hidden="false"/><line x1="144" y1="319" x2="216" y2="41" stroke="#315ce8" stroke-width="2.4" data-edge="Q:T" data-hidden="false"/><line x1="216" y1="41" x2="120" y2="215" stroke="#315ce8" stroke-width="2.4" data-edge="P:T" data-hidden="false"/><line x1="360" y1="215" x2="216" y2="41" stroke="#315ce8" stroke-width="2.4" data-edge="R:T" data-hidden="false"/><text x="106" y="224" font-size="23" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">P</text><text x="134" y="340" font-size="23" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">Q</text><text x="376" y="224" font-size="23" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">R</text><text x="216" y="24" font-size="23" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">T</text></g></svg>