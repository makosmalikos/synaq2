<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-labelledby="title desc"><title id="title">Рет пен аралықтар зертханасы</title><desc id="desc">Бір түзуде боялған екі сәуле көрсетілген. Бұл жиынды модулі бар қай теңсіздік сипаттайды? Қатар 1: сол жақ солға шексіз созылады, оң жақ -3 шекарасы бос; Қатар 2: сол жақ 5 шекарасы бос, оң жақ оңға шексіз созылады. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a7"/></marker></defs><rect width="480" height="215" fill="white"/><line x1="34" y1="100" x2="448" y2="100" stroke="#708aa9" stroke-width="1.6" marker-end="url(#tip)"/><line x1="48" y1="96" x2="48" y2="104" stroke="#849bb6"/><line x1="72" y1="96" x2="72" y2="104" stroke="#849bb6"/><line x1="96" y1="96" x2="96" y2="104" stroke="#849bb6"/><line x1="120" y1="96" x2="120" y2="104" stroke="#849bb6"/><line x1="144" y1="96" x2="144" y2="104" stroke="#849bb6"/><line x1="168" y1="96" x2="168" y2="104" stroke="#849bb6"/><line x1="192" y1="96" x2="192" y2="104" stroke="#849bb6"/><line x1="216" y1="96" x2="216" y2="104" stroke="#849bb6"/><line x1="240" y1="96" x2="240" y2="104" stroke="#849bb6"/><line x1="264" y1="96" x2="264" y2="104" stroke="#849bb6"/><line x1="288" y1="96" x2="288" y2="104" stroke="#849bb6"/><line x1="312" y1="96" x2="312" y2="104" stroke="#849bb6"/><line x1="336" y1="96" x2="336" y2="104" stroke="#849bb6"/><line x1="360" y1="96" x2="360" y2="104" stroke="#849bb6"/><line x1="384" y1="96" x2="384" y2="104" stroke="#849bb6"/><line x1="408" y1="96" x2="408" y2="104" stroke="#849bb6"/><line x1="432" y1="96" x2="432" y2="104" stroke="#849bb6"/><text x="144" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">-3</text><line x1="40" y1="100" x2="144" y2="100" stroke="#697bd3" stroke-width="6" data-interval="0" data-lo="-inf" data-hi="-3"/><path d="M33,100 L45,93 L45,107 Z" fill="#697bd3"/><circle cx="144" cy="100" r="7" fill="white" stroke="#697bd3" stroke-width="2.3" data-endpoint="-3" data-closed="false"/><line x1="336" y1="100" x2="440" y2="100" stroke="#c77b67" stroke-width="6" data-interval="1" data-lo="5" data-hi="+inf"/><circle cx="336" cy="100" r="7" fill="white" stroke="#c77b67" stroke-width="2.3" data-endpoint="5" data-closed="false"/><path d="M447,100 L435,93 L435,107 Z" fill="#c77b67"/><text x="336" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">5</text></svg>
