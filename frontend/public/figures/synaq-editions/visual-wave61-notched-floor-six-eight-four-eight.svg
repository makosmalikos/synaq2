<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Екі ондық санға суретті есеп</title><desc id="desc">Сыртқы өлшемдер 6,8×4,8 м. Жоғарғы оң жақтағы ақ ойық 2,4×1,6 м; қалған еден көк.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="28" text-anchor="middle" fill="#203549" font-size="24">Өлшемдер — м</text><polygon data-notched="true" points="95,90 293,90 293,162 401,162 401,306 95,306" fill="#a9d1f6" stroke="#203549" stroke-width="2"/><line x1="95" y1="323" x2="401" y2="323" stroke="#203549" stroke-width="2" /><line x1="91" y1="319" x2="99" y2="327" stroke="#203549" stroke-width="2" /><line x1="397" y1="319" x2="405" y2="327" stroke="#203549" stroke-width="2" /><text x="248" y="353" text-anchor="middle" fill="#203549" font-size="25">6,8</text><line x1="75" y1="90" x2="75" y2="306" stroke="#203549" stroke-width="2" /><line x1="71" y1="86" x2="79" y2="94" stroke="#203549" stroke-width="2" /><line x1="71" y1="302" x2="79" y2="310" stroke="#203549" stroke-width="2" /><text x="40" y="206" text-anchor="middle" fill="#203549" font-size="25">4,8</text><line x1="293" y1="54" x2="401" y2="54" stroke="#203549" stroke-width="2" /><line x1="289" y1="50" x2="297" y2="58" stroke="#203549" stroke-width="2" /><line x1="397" y1="50" x2="405" y2="58" stroke="#203549" stroke-width="2" /><text x="347" y="75" text-anchor="middle" fill="#203549" font-size="25">2,4</text><line x1="420" y1="90" x2="420" y2="162" stroke="#203549" stroke-width="2" /><line x1="416" y1="86" x2="424" y2="94" stroke="#203549" stroke-width="2" /><line x1="416" y1="158" x2="424" y2="166" stroke="#203549" stroke-width="2" /><text x="452" y="134" text-anchor="middle" fill="#203549" font-size="25">1,6</text></g></svg>