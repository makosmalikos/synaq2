<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Теңдеу және график</title><desc id="desc">Екі жолды кесте. Жолдар x және y. Бағандар: x=-1, y=-3; x=2, y=9; x=5, y=сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="112" width="100" height="65" fill="#eaf0ff" stroke="#203549" stroke-width="2"/><text x="90" y="154" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">x</text><rect x="140" y="112" width="100" height="65" fill="#fff" stroke="#203549" stroke-width="2"/><text x="190" y="154" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">-1</text><rect x="240" y="112" width="100" height="65" fill="#fff" stroke="#203549" stroke-width="2"/><text x="290" y="154" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">2</text><rect x="340" y="112" width="100" height="65" fill="#fff" stroke="#203549" stroke-width="2"/><text x="390" y="154" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">5</text><rect x="40" y="177" width="100" height="65" fill="#eaf0ff" stroke="#203549" stroke-width="2"/><text x="90" y="219" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">y</text><rect x="140" y="177" width="100" height="65" fill="#fff" stroke="#203549" stroke-width="2"/><text x="190" y="219" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">-3</text><rect x="240" y="177" width="100" height="65" fill="#fff" stroke="#203549" stroke-width="2"/><text x="290" y="219" font-size="30" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">9</text>