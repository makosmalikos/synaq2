<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Санның бөлігін пайызбен табу</title><desc id="desc">Бүкіл жолақ — 1200 г. Алма үлесі 37%, алмұрт үлесі 28%, қалған өрік үлесінің орнына сұрақ белгісі қойылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="104" x2="444" y2="104" stroke="#23394b" stroke-width="1.3" data-brace="whole"/><line x1="30" y1="97" x2="30" y2="111" stroke="#23394b" stroke-width="1.3" /><line x1="444" y1="97" x2="444" y2="111" stroke="#23394b" stroke-width="1.3" /><text x="237" y="90" text-anchor="middle" fill="#23394b" font-size="27" data-whole="whole">1200 г</text><rect data-share="0" x="30" y="155" width="153.18" height="72" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="106.59" y="182" text-anchor="middle" fill="#23394b" font-size="24" >Алма</text><text x="106.59" y="213" text-anchor="middle" fill="#23394b" font-size="26" data-percent="0">37%</text><rect data-share="1" x="183.18" y="155" width="115.92" height="72" fill="#80c7b0" stroke="#23394b" stroke-width="1.5"/><text x="241.14" y="182" text-anchor="middle" fill="#23394b" font-size="24" >Алмұрт</text><text x="241.14" y="213" text-anchor="middle" fill="#23394b" font-size="26" data-percent="1">28%</text><rect data-share="2" x="299.1" y="155" width="144.9" height="72" fill="#ecc95c" stroke="#23394b" stroke-width="1.5"/><text x="371.55" y="182" text-anchor="middle" fill="#23394b" font-size="24" >Өрік</text><text x="371.55" y="213" text-anchor="middle" fill="#23394b" font-size="26" data-percent="2">?</text></g></svg>