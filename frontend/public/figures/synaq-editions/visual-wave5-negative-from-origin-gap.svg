<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Сызбада M нүктесінің санақ басынан қашықтығы көрсетілген. Нүктенің қай жақта жатқанын ескеріп, оның координатасын табыңыз. Нүктелер: M — белгісіз координата. 0-ден M-ге дейінгі қашықтық 4. M санақ басының сол жағында. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="190" fill="white"/><line x1="35" y1="95" x2="447" y2="95" stroke="#456487" stroke-width="2" marker-end="url(#tip)"/><text x="336" y="121" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">0</text><circle cx="144" cy="95" r="4.3" fill="#6651c7" data-point="M" data-numerator="-4" data-denominator="1"/><text x="144" y="70" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#4e42b8" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">M</text><line x1="144" y1="151" x2="336" y2="151" stroke="#5d83b0" stroke-width="1.5"/><line x1="144" y1="145" x2="144" y2="157" stroke="#5d83b0"/><line x1="336" y1="145" x2="336" y2="157" stroke="#5d83b0"/><text x="240" y="137" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#345076" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">4 бірлік</text></svg>
