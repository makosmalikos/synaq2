<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: Q; R; P. Доға жазулары: ∠RVP: 58°. Белгісіз өлшемдер санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="52" y2="275" stroke="#23394b" stroke-width="1.8" data-ray="P"/><text x="28" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="1.8" data-ray="Q"/><text x="452" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="140.3751783241575" y2="115.56695792259191" stroke="#23394b" stroke-width="1.8" data-ray="R"/><text x="127.65711598256058" y="103.21380361483767" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="RP" d="M194.9568625401776 202.9159118267038 A85 85 0 0 0 155 275" fill="none" stroke="#80b5ef" stroke-width="2.3"/><text x="145.54107162894525" y="230.6405610133956" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="RP">58°</text></g></svg>