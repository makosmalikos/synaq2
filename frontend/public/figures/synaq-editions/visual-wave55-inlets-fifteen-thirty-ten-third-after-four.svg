<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сурет бойынша бірлескен жұмыс</title><desc id="desc">A 15 сағат, B 30 сағат, C 10 сағат деп жазылған жеке толық уақыттар. Үш нұсқар да бакқа төмен қарай бағытталған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="29" text-anchor="middle" fill="#203549" font-size="22">Жеке толық уақыт — сағатпен</text><path data-tank="true" d="M 70 148 L 70 313 L 410 313 L 410 148" fill="none" stroke="#203549" stroke-width="2.2"/><text x="110" y="70" text-anchor="middle" fill="#203549" font-size="23">A: 15 сағ</text><line x1="110" y1="91" x2="110" y2="180" stroke="#203549" stroke-width="2" data-flow="in" data-pipe="A" style="stroke:#5d9cdf"/><line x1="110" y1="180" x2="104" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><line x1="110" y1="180" x2="116" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><text x="240" y="70" text-anchor="middle" fill="#203549" font-size="23">B: 30 сағ</text><line x1="240" y1="91" x2="240" y2="180" stroke="#203549" stroke-width="2" data-flow="in" data-pipe="B" style="stroke:#5d9cdf"/><line x1="240" y1="180" x2="234" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><line x1="240" y1="180" x2="246" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><text x="370" y="70" text-anchor="middle" fill="#203549" font-size="23">C: 10 сағ</text><line x1="370" y1="91" x2="370" y2="180" stroke="#203549" stroke-width="2" data-flow="in" data-pipe="C" style="stroke:#5d9cdf"/><line x1="370" y1="180" x2="364" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><line x1="370" y1="180" x2="376" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/></g></svg>