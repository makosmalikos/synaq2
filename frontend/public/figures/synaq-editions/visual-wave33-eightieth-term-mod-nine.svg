<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай сандар мен бөлінгіштік</title><desc id="desc">Координаталық сәуледе 0 нүктесі және 6, 15, 24, 33 тізбек мүшелері бар; көрші мүшелердің үстінде +9 қадамдары жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="194" x2="455" y2="194" stroke="#203549" stroke-width="1.6" /><line x1="455" y1="194" x2="444" y2="187" stroke="#203549" stroke-width="1.6" /><line x1="455" y1="194" x2="444" y2="201" stroke="#203549" stroke-width="1.6" /><line x1="45" y1="185" x2="45" y2="203" stroke="#203549" stroke-width="1.6" /><text x="45" y="237" text-anchor="middle" fill="#203549" font-size="25" >0</text><circle data-term="1" data-value="6" cx="111" cy="194" r="5" fill="#315ce8"/><text x="111" y="237" text-anchor="middle" fill="#203549" font-size="27" >6</text><path data-step="0" d="M 111 158 Q 160.5 126 210 158" fill="none" stroke="#5682df" stroke-width="1.8"/><line x1="210" y1="158" x2="199" y2="158" stroke="#5682df" stroke-width="1.8" /><line x1="210" y1="158" x2="205" y2="148" stroke="#5682df" stroke-width="1.8" /><text x="160.5" y="133" text-anchor="middle" fill="#203549" font-size="23" >+9</text><circle data-term="2" data-value="15" cx="210" cy="194" r="5" fill="#315ce8"/><text x="210" y="237" text-anchor="middle" fill="#203549" font-size="27" >15</text><path data-step="1" d="M 210 158 Q 259.5 126 309 158" fill="none" stroke="#5682df" stroke-width="1.8"/><line x1="309" y1="158" x2="298" y2="158" stroke="#5682df" stroke-width="1.8" /><line x1="309" y1="158" x2="304" y2="148" stroke="#5682df" stroke-width="1.8" /><text x="259.5" y="133" text-anchor="middle" fill="#203549" font-size="23" >+9</text><circle data-term="3" data-value="24" cx="309" cy="194" r="5" fill="#315ce8"/><text x="309" y="237" text-anchor="middle" fill="#203549" font-size="27" >24</text><path data-step="2" d="M 309 158 Q 358.5 126 408 158" fill="none" stroke="#5682df" stroke-width="1.8"/><line x1="408" y1="158" x2="397" y2="158" stroke="#5682df" stroke-width="1.8" /><line x1="408" y1="158" x2="403" y2="148" stroke="#5682df" stroke-width="1.8" /><text x="358.5" y="133" text-anchor="middle" fill="#203549" font-size="23" >+9</text><circle data-term="4" data-value="33" cx="408" cy="194" r="5" fill="#315ce8"/><text x="408" y="237" text-anchor="middle" fill="#203549" font-size="27" >33</text></g></svg>