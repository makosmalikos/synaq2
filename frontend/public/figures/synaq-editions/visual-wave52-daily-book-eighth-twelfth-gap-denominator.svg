<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кері сандар мен жұмыс үлестері</title><desc id="desc">A және M жолақтарының ұзындықтары бірдей, әрқайсысы бір кітап. A жолағында 8, M жолағында 12 тең ұяшық бар; әрқайсысының алғашқы 1 ұяшығы көк.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="23">Бір күнде оқылатын бөлік</text><text x="20" y="151" text-anchor="middle" fill="#203549" font-size="24">A</text><rect data-strip="A" data-part="0" data-painted="true" x="42" y="112" width="49.5" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="1" data-painted="false" x="91.5" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="2" data-painted="false" x="141" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="3" data-painted="false" x="190.5" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="4" data-painted="false" x="240" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="5" data-painted="false" x="289.5" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="6" data-painted="false" x="339" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-strip="A" data-part="7" data-painted="false" x="388.5" y="112" width="49.5" height="64" fill="#fff" stroke="#203549" stroke-width="1.6"/><text x="20" y="274" text-anchor="middle" fill="#203549" font-size="24">M</text><rect data-strip="M" data-part="0" data-painted="true" x="42" y="235" width="33"