<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай сандар мен бөлінгіштік</title><desc id="desc">Бірінші көк бөлікте 56, екінші сары бөлікте 42 алма жазылған. Ортақ толық саны берілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="93" y="146" width="168" height="68" fill="#8eb3ef" stroke="#203549" stroke-width="1.5" data-part="0"/><text x="177" y="189" text-anchor="middle" fill="#203549" font-size="27" >56</text><rect x="261" y="146" width="126" height="68" fill="#f9d57a" stroke="#203549" stroke-width="1.5" data-part="1"/><text x="324" y="189" text-anchor="middle" fill="#203549" font-size="27" >42</text></g></svg>