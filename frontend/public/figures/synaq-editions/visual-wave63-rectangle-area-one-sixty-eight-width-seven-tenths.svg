<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлгішпен суретті есеп</title><desc id="desc">Тіктөртбұрыш ішіндегі S = 1,68 см². Белгілі қабырға 0,7 см, екінші қабырға сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="87" y="95" width="300" height="87.5" fill="#f7fbff" stroke="#203549" stroke-width="1.6" data-area-rectangle="true"/><text x="237" y="146.75" text-anchor="middle" fill="#203549" font-size="28">S = 1,68</text><text x="41" y="146.75" text-anchor="middle" fill="#203549" font-size="25">0,7</text><text x="237" y="224.5" text-anchor="middle" fill="#203549" font-size="29">?</text><text x="240" y="36" text-anchor="middle" fill="#203549" font-size="22">Өлшемдер — см, аудан — см²</text></g></svg>