<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлгішпен суретті есеп</title><desc id="desc">Тіктөртбұрыш ішіндегі S = 12,48 м². Белгілі қабырға 4,8 м, екінші қабырға сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="87" y="95" width="300" height="162.5" fill="#f7fbff" stroke="#203549" stroke-width="1.6" data-area-rectangle="true"/><text x="237" y="184.25" text-anchor="middle" fill="#203549" font-size="28">S = 12,48</text><text x="237" y="299.5" text-anchor="middle" fill="#203549" font-size="26">4,8</text><text x="44" y="184.25" text-anchor="middle" fill="#203549" font-size="29">?</text><text x="240" y="36" text-anchor="middle" fill="#203549" font-size="22">Өлшемдер — м, аудан — м²</text></g></svg>