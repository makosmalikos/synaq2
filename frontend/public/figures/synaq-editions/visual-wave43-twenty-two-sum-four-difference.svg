<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бүтін және бөлшек</title><desc id="desc">Екі жолақ a және b. a жолағындағы артық бөлік 8 деп белгіленген. Оң жақтағы ортақ жақша 44 қосындысын білдіреді. a және b мәндері жазылмаған. Сызба масштабсыз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="84" y="104" width="190" height="48" fill="#a6caed" stroke="#203549" stroke-width="1.7"/><rect x="274" y="104" width="80" height="48" fill="#bfa4d7" stroke="#203549" stroke-width="1.7"/><rect x="84" y="222" width="190" height="48" fill="#a6caed" stroke="#203549" stroke-width="1.7"/><text x="50" y="138" text-anchor="middle" fill="#203549" font-size="29" >a</text><text x="50" y="256" text-anchor="middle" fill="#203549" font-size="29" >b</text><text x="314" y="138" text-anchor="middle" fill="#203549" font-size="28" >8</text><line x1="274" y1="158" x2="274" y2="216" stroke="#8596a8" stroke-width="1.4" stroke-dasharray="4 5"/><line x1="396" y1="104" x2="408" y2="104" stroke="#203549" stroke-width="1.6" /><line x1="408" y1="104" x2="408" y2="270" stroke="#203549" stroke-width="1.6" /><line x1="396" y1="270" x2="408" y2="270" stroke="#203549" stroke-width="1.6" /><text x="449" y="197" text-anchor="middle" fill="#203549" font-size="28" >44</text><text x="240" y="326" text-anchor="middle" fill="#203549" font-size="23" >Сызба масштабсыз</text></g></svg>