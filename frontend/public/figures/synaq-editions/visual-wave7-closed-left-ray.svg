<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-labelledby="title desc"><title id="title">Рет пен аралықтар зертханасы</title><desc id="desc">Боялған сәулеге сәйкес теңсіздікті таңдаңыз. Толтырылған шекара осы жиынға кіреді. Қатар 1: сол жақ солға шексіз созылады, оң жақ -4 шекарасы толтырылған. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a7"/></marker></defs><rect width="480" height="215" fill="white"/><line x1="34" y1="100" x2="448" y2="100" stroke="#708aa9" stroke-width="1.6" marker-end="url(#tip)"/><line x1="48" y1="96" x2="48" y2="104" stroke="#849bb6"/><line x1="86.4" y1="96" x2="86.4" y2="104" stroke="#849bb6"/><line x1="124.8" y1="96" x2="124.8" y2="104" stroke="#849bb6"/><line x1="163.2" y1="96" x2="163.2" y2="104" stroke="#849bb6"/><line x1="201.6" y1="96" x2="201.6" y2="104" stroke="#849bb6"/><line x1="240" y1="96" x2="240" y2="104" stroke="#849bb6"/><line x1="278.4" y1="96" x2="278.4" y2="104" stroke="#849bb6"/><line x1="316.8" y1="96" x2="316.8" y2="104" stroke="#849bb6"/><line x1="355.2" y1="96" x2="355.2" y2="104" stroke="#849bb6"/><line x1="393.6" y1="96" x2="393.6" y2="104" stroke="#849bb6"/><line x1="432" y1="96" x2="432" y2="104" stroke="#849bb6"/><text x="201.6" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">-4</text><line x1="40" y1="100" x2="201.6" y2="100" stroke="#697bd3" stroke-width="6" data-interval="0" data-lo="-inf" data-hi="-4"/><path d="M33,100 L45,93 L45,107 Z" fill="#697bd3"/><circle cx="201.6" cy="100" r="7" fill="#697bd3" stroke="#697bd3" stroke-width="2.3" data-endpoint="-4" data-closed="true"/></svg>
