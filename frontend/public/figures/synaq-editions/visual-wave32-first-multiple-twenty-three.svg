<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлгіштер мен еселіктер</title><desc id="desc">Координаталық сәуледе бірдей аралықпен 0, x, 46, 69, 92 белгілері орналасқан. x — бірінші оң еселік.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="188" x2="449" y2="188" stroke="#203549" stroke-width="1.7" /><line x1="449" y1="188" x2="438" y2="181" stroke="#203549" stroke-width="1.7" /><line x1="449" y1="188" x2="438" y2="195" stroke="#203549" stroke-width="1.7" /><line x1="45" y1="178" x2="45" y2="198" stroke="#203549" stroke-width="1.7" data-index="0"/><text x="45" y="234" text-anchor="middle" fill="#203549" font-size="27" >0</text><line x1="125" y1="178" x2="125" y2="198" stroke="#203549" stroke-width="1.7" data-index="1"/><text x="125" y="234" text-anchor="middle" fill="#203549" font-size="27" >x</text><line x1="205" y1="178" x2="205" y2="198" stroke="#203549" stroke-width="1.7" data-index="2"/><text x="205" y="234" text-anchor="middle" fill="#203549" font-size="27" >46</text><line x1="285" y1="178" x2="285" y2="198" stroke="#203549" stroke-width="1.7" data-index="3"/><text x="285" y="234" text-anchor="middle" fill="#203549" font-size="27" >69</text><line x1="365" y1="178" x2="365" y2="198" stroke="#203549" stroke-width="1.7" data-index="4"/><text x="365" y="234" text-anchor="middle" fill="#203549" font-size="27" >92</text></g></svg>