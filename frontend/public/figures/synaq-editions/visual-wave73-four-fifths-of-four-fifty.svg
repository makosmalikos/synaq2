<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Санның бөлігін пайызбен табу</title><desc id="desc">Бүкіл жолақ 450 санына сәйкес. Ол 5 тең бөлікке бөлінген. Әр бөліктің ішінде 20% жазылған. Солдан санағанда алғашқы 4 бөлігі көк.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="116" x2="444" y2="116" stroke="#23394b" stroke-width="1.3" data-brace="whole"/><line x1="30" y1="109" x2="30" y2="123" stroke="#23394b" stroke-width="1.3" /><line x1="444" y1="109" x2="444" y2="123" stroke="#23394b" stroke-width="1.3" /><text x="237" y="102" text-anchor="middle" fill="#23394b" font-size="27" data-whole="whole">450</text><rect data-part="0" data-paint="blue" x="30" y="155" width="82.8" height="62" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="71.4" y="195" text-anchor="middle" fill="#23394b" font-size="26" data-unit-percent="0">20%</text><rect data-part="1" data-paint="blue" x="112.8" y="155" width="82.8" height="62" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="154.2" y="195" text-anchor="middle" fill="#23394b" font-size="26" data-unit-percent="1">20%</text><rect data-part="2" data-paint="blue" x="195.6" y="155" width="82.8" height="62" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="237" y="195" text-anchor="middle" fill="#23394b" font-size="26" data-unit-percent="2">20%</text><rect data-part="3" data-paint="blue" x="278.4" y="155" width="82.8" height="62" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="319.8" y="195" text-anchor="middle" fill="#23394b" font-size="26" data-unit-percent="3">20%</text><rect data-part="4" data-paint="none" x="361.2" y="155" width="82.8" height="62" fill="#fff" stroke="#23394b" stroke-width="1.5"/><text x="402.59999999999997" y="195" text-anchor="middle" fill="#23394b" font-size="26" data-