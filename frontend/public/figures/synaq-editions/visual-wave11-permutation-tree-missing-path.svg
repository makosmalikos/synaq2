<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Деректер мен нұсқалар</title><desc id="desc">Ағаштың солдан оңға оқылатын көрсетілген толық жолдары: PQR, PRQ, QPR, RPQ, RQP.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="160" width="74" height="40" rx="9" fill="#eaf0ff" stroke="#315ce8"/><text x="45" y="186" font-size="18" fill="#203549" text-anchor="middle">Бастау</text><line x1="82" y1="180" x2="137" y2="65" stroke="#dbe5f1" stroke-width="2" /><circle cx="150" cy="65" r="15" fill="#315ce8" /><text x="150" y="72" font-size="22" fill="#fff" text-anchor="middle">P</text><line x1="82" y1="180" x2="137" y2="180" stroke="#dbe5f1" stroke-width="2" /><circle cx="150" cy="180" r="15" fill="#315ce8" /><text x="150" y="187" font-size="22" fill="#fff" text-anchor="middle">Q</text><line x1="82" y1="180" x2="137" y2="295" stroke="#dbe5f1" stroke-width="2" /><circle cx="150" cy="295" r="15" fill="#315ce8" /><text x="150" y="302" font-size="22" fill="#fff" text-anchor="middle">R</text><line x1="166" y1="65" x2="271" y2="40" stroke="#8459ce" stroke-width="2" data-tree-prefix="PQ"/><circle cx="286" cy="40" r="15" fill="#8459ce" /><text x="286" y="47" font-size="22" fill="#fff" text-anchor="middle">Q</text><line x1="302" y1="40" x2="404" y2="40" stroke="#315ce8" stroke-width="2" /><circle cx="420" cy="40" r="15" fill="#315ce8" data-path="PQR"/><text x="420" y="47" font-size="22" fill="#fff" text-anchor="middle">R</text><line x1="166" y1="65" x2="271" y2="95" stroke="#8459ce" stroke-width="2" data-tree-prefix="PR"/><circle cx="286" cy="95" r="15" fill="#8459ce" /><text x="286" y="102" font-size="22" fill="#fff" text-anchor="middle">R</text><line x1="302" y1="95" x2="404" y2="95" stroke="#315ce8" stroke-width="2" /><circle cx="420" cy="95" r="15" fill="#315ce8" data-path="PRQ"/><text