<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлгішпен суретті есеп</title><desc id="desc">Жоғарыда 3,60 ÷ 0,45, бөлінгіштегі соңғы толықтыру нөлі ерекшеленген. Әр санға бірдей ×100 нұсқары түседі. Төменде 360 ÷ 45.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="37" text-anchor="middle" fill="#203549" font-size="22">Бөлінгіш пен бөлгіш бірге өзгереді</text><text x="82" y="122" text-anchor="middle" fill="#203549" font-size="31">3</text><text x="116" y="122" text-anchor="middle" fill="#203549" font-size="31">,</text><text x="150" y="122" text-anchor="middle" fill="#203549" font-size="31">6</text><rect x="167" y="88" width="34" height="49" rx="5" fill="#fff0b8"/><text x="184" y="122" text-anchor="middle" fill="#203549" font-size="31">0</text><text x="249" y="122" text-anchor="middle" fill="#203549" font-size="32">÷</text><text x="346" y="122" text-anchor="middle" fill="#203549" font-size="31">0,45</text><line x1="132" y1="149" x2="132" y2="233" stroke="#203549" stroke-width="2" /><path d="M 132 233 l -5 -9 l 10 0 Z" fill="#203549"/><text x="177" y="196" text-anchor="middle" fill="#203549" font-size="23">×100</text><line x1="346" y1="149" x2="346" y2="233" stroke="#203549" stroke-width="2" /><path d="M 346 233 l -5 -9 l 10 0 Z" fill="#203549"/><text x="391" y="196" text-anchor="middle" fill="#203549" font-size="23">×100</text><text x="132" y="279" text-anchor="middle" fill="#203549" font-size="32">360</text><text x="249" y="279" text-anchor="middle" fill="#203549" font-size="32">÷</text><text x="346" y="279" text-anchor="middle" fill="#203549" font-size="32">45</text></g></svg>