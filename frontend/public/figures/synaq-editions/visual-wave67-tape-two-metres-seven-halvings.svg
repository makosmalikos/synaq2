<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттердегі сандар тізбегі</title><desc id="desc">Толық 2 м жолақ: алғашқы үш түрлі түсті бөлік толықтың жартысы, ширегі, сегізден бірі; соңғы сегізден бірі ақ.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#203549"/></marker></defs><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="35" text-anchor="middle" fill="#203549" font-size="25">Алғашқы үш қию</text><line x1="30" y1="110" x2="450" y2="110" stroke="#203549" stroke-width="1.8" /><line x1="30" y1="103" x2="30" y2="117" stroke="#203549" stroke-width="1.8" /><line x1="450" y1="103" x2="450" y2="117" stroke="#203549" stroke-width="1.8" /><text x="240" y="91" text-anchor="middle" fill="#203549" font-size="28">2 м</text><rect x="30" y="164" width="210" height="62" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-tape-part="0"/><text x="135" y="271" text-anchor="middle" fill="#203549" font-size="24">1</text><rect x="240" y="164" width="105" height="62" fill="#fff0b8" stroke="#203549" stroke-width="1.8" data-tape-part="1"/><text x="292.5" y="271" text-anchor="middle" fill="#203549" font-size="24">2</text><rect x="345" y="164" width="52.5" height="62" fill="#b5e9ce" stroke="#203549" stroke-width="1.8" data-tape-part="2"/><text x="371.25" y="271" text-anchor="middle" fill="#203549" font-size="24">3</text><rect x="397.5" y="164" width="52.5" height="62" fill="#fff" stroke="#203549" stroke-width="1.8" data-tape-part="3"/></g></svg>