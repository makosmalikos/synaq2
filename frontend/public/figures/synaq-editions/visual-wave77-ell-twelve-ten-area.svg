<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Көк көпбұрыштың тұйық шекарасы көрсетілген. Белгілі ұзындықтар: төменгі толық қабырға: 12 м; оң қысқа қабырға: 4 м; сол толық қабырға: 10 м; жоғарғы қысқа қабырға: 5 м.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="102,285 378,285 378,193 217,193 217,55 102,55" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="241.63868214972192" y="315.9415500961069" text-anchor="middle" fill="#243a51" font-size="27" data-given="0">12 м</text><text x="399.19761362817553" y="255.92531100133706" text-anchor="middle" fill="#243a51" font-size="27" data-given="1">4 м</text><text x="79.0396894169751" y="176.6493934951162" text-anchor="middle" fill="#243a51" font-size="27" data-given="5">10 м</text><text x="147.75760865442496" y="43.223340891663106" text-anchor="middle" fill="#243a51" font-size="27" data-given="4">5 м</text></g></svg>