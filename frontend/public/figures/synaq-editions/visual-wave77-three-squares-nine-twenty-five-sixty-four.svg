<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Төменгі қабырғалары бір түзуде жатқан үш шаршы солдан оңға өседі. Іштеріндегі аудандар 9 см²; 25 см²; 64 см². Ортақ шекаралар үзік сызық.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="65,257.5 415,257.5 415,82.5 240,82.5 240,148.125 130.625,148.125 130.625,191.875 65,191.875" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="97.8125" y="221.6875" text-anchor="middle" fill="#243a51" font-size="27" data-area="0">9</text><text x="97.8125" y="244.6875" text-anchor="middle" fill="#243a51" font-size="22" data-area-unit="0">см²</text><line x1="130.625" y1="257.5" x2="130.625" y2="191.875" stroke="#243a51" stroke-width="2" stroke-dasharray="5 5" data-shared="true"/><text x="185.3125" y="199.8125" text-anchor="middle" fill="#243a51" font-size="27" data-area="1">25</text><text x="185.3125" y="222.8125" text-anchor="middle" fill="#243a51" font-size="22" data-area-unit="1">см²</text><line x1="240" y1="257.5" x2="240" y2="148.125" stroke="#243a51" stroke-width="2" stroke-dasharray="5 5" data-shared="true"/><text x="327.5" y="167" text-anchor="middle" fill="#243a51" font-size="27" data-area="2">64</text><text x="327.5" y="190" text-anchor="middle" fill="#243a51" font-size="22" data-area-unit="2">см²</text></g></svg>