<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc" data-edition="geometry-park-coordinate-walk" data-model="coordinate-walk-distance"><title id="title">Саябақтағы екі аялдама</title><desc id="desc">Координаталық түзуде A нүктесі −5-те, B нүктесі 7-де. Бір бірлік 200 м-ге тең.</desc><rect width="720" height="330" fill="white"/><g stroke="#233b5d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" text-anchor="middle"><style>text{fill:#18304e;stroke:none}</style><line x1="65" y1="175" x2="655" y2="175" /><path d="M 645 166 L 655 175 L 645 184" fill="none"/><line x1="132" y1="165" x2="132" y2="185" data-coordinate="-5"/><text x="132" y="228" >-5</text><line x1="170" y1="165" x2="170" y2="185" data-coordinate="-4"/><line x1="208" y1="165" x2="208" y2="185" data-coordinate="-3"/><line x1="246" y1="165" x2="246" y2="185" data-coordinate="-2"/><line x1="284" y1="165" x2="284" y2="185" data-coordinate="-1"/><line x1="322" y1="165" x2="322" y2="185" data-coordinate="0"/><text x="322" y="228" >0</text><line x1="360" y1="165" x2="360" y2="185" data-coordinate="1"/><line x1="398" y1="165" x2="398" y2="185" data-coordinate="2"/><line x1="436" y1="165" x2="436" y2="185" data-coordinate="3"/><line x1="474" y1="165" x2="474" y2="185" data-coordinate="4"/><line x1="512" y1="165" x2="512" y2="185" data-coordinate="5"/><line x1="550" y1="165" x2="550" y2="185" data-coordinate="6"/><line x1="588" y1="165" x2="588" y2="185" data-coordinate="7"/><text x="588" y="228" >7</text><circle cx="132" cy="175" r="8" fill="#2257dc" stroke="none" /><circle cx="588" cy="175" r="8" fill="#2257dc" stroke="none" /><text x="132" y="125" data-given="start" data-value="-5">A (-5)</text><text x="588" y="125" data-given="end" data-value="7">B (7)</text><text x="360" y="290" data-given="metresPerUnit" data-value="200">1 бірлік = 200 м</text></g></svg>
