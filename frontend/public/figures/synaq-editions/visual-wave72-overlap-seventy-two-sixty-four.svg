<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөліктерді пайызбен салыстыру</title><desc id="desc">AB — 100%; A, C, D, B осы ретпен орналасқан. Жоғарғы доға A-дан D-ға дейін: 72%. Төменгі доға C-ден B-ға дейін: 64%.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="345" text-anchor="middle" fill="#23394b" font-size="26" >AB — 100%</text><line x1="30" y1="182" x2="444" y2="182" stroke="#23394b" stroke-width="1.3" /><line x1="30" y1="174" x2="30" y2="190" stroke="#23394b" stroke-width="1.3" data-point="A"/><text x="30" y="222" text-anchor="middle" fill="#23394b" font-size="27" >A</text><line x1="179.04" y1="174" x2="179.04" y2="190" stroke="#23394b" stroke-width="1.3" data-point="C"/><text x="179.04" y="222" text-anchor="middle" fill="#23394b" font-size="27" >C</text><line x1="328.08" y1="174" x2="328.08" y2="190" stroke="#23394b" stroke-width="1.3" data-point="D"/><text x="328.08" y="222" text-anchor="middle" fill="#23394b" font-size="27" >D</text><line x1="444" y1="174" x2="444" y2="190" stroke="#23394b" stroke-width="1.3" data-point="B"/><text x="444" y="222" text-anchor="middle" fill="#23394b" font-size="27" >B</text><path data-arc="AD" d="M 30 178 Q 179.04 21 328.08 178" fill="none" stroke="#5599d8" stroke-width="2.5"/><text x="179.04" y="79" text-anchor="middle" fill="#23394b" font-size="27" data-percent="AD">72%</text><path data-arc="CB" d="M 179.04 189 Q 311.52 350 444 189" fill="none" stroke="#a587ca" stroke-width="2.5"/><text x="311.52" y="310" text-anchor="middle" fill="#23394b" font-size="27" data-percent="CB">64%</text></g></svg>