<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: P; Q; R; S. Сызба V айналасындағы толық айналымды көрсетеді. Шаршы тік бұрыш белгілері: ∠PVQ. Доға жазулары: ∠SVP: 118°. Бірдей доға белгісі бар бөліктер тең. Белгісіз өлшемдер санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="180" x2="372" y2="180" stroke="#23394b" stroke-width="1.8" data-ray="P"/><text x="396" y="188" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="180" x2="240" y2="48" stroke="#23394b" stroke-width="1.8" data-ray="Q"/><text x="240" y="32" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="180" x2="111.92096413156847" y2="148.06630978084385" stroke="#23394b" stroke-width="1.8" data-ray="R"/><text x="88.63386670094454" y="150.26018428645182" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><line x1="240" y1="180" x2="178.02975371226242" y2="296.54908225737836" stroke="#23394b" stroke-width="1.8" data-ray="S"/><text x="166.76243620540106" y="325.7398244859926" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="S">S</text><circle cx="240" cy="180" r="4" fill="#23394b"/><text x="257.5112945469418" y="217.14368822387183" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="QR" d="M240 117 A63 63 0 0 0 178.87136924461223 164.75892057722092" fill="none" stroke="#80b5ef" stroke-width="2.3"/><line x1="204.90729590643747" y1="135.08338704441684" x2="197.5193582025296" y2="125.62725800113618" stroke="#23394b" stroke-width="1.8" data-equal="middle"/><path data-arc="RS" d="M178.87136924461223 164.7589205772