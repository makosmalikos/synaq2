<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: P; Q; R. Суреттегі доға жазулары: ∠PVR: 128°. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="453" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="285.4813163727376" y2="92.58440346011267" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="291.52936376272925" y="76.32701030321275" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="124.25564263877624" y2="126.85397832193627" stroke="#23394b" stroke-width="2.1" data-ray="R"/><text x="108.8641057556348" y="115.1537094817682" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="PR" d="M355 275 A115 115 0 0 0 169.1989303375493 184.37876333522695" fill="none" stroke="#80b5ef" stroke-width="2.5"/><text x="300.0568471101036" y="159.86521565701412" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="PR">128°</text></g></svg>