<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиын элементтерін суреттен оқу</title><desc id="desc">T дөңгелегінің ішінде 4; 9; 13; 18. Сыртында 6; 11; 3.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="32" text-anchor="middle" fill="#203549" font-size="22">Жиынның ішіндегі және сыртындағы белгілер</text><circle data-set="T" cx="220" cy="190" r="132" fill="#b7d5fa" fill-opacity=".44" stroke="#203549" stroke-width="2"/><text x="95" y="77" text-anchor="middle" fill="#203549" font-size="29">T</text><g data-entry="0"><circle cx="149" cy="130" r="2.8" fill="#203549"/><text x="175" y="139" text-anchor="middle" fill="#203549" font-size="27">4</text></g><g data-entry="1"><circle cx="254" cy="130" r="2.8" fill="#203549"/><text x="280" y="139" text-anchor="middle" fill="#203549" font-size="27">9</text></g><g data-entry="2"><circle cx="149" cy="240" r="2.8" fill="#203549"/><text x="175" y="249" text-anchor="middle" fill="#203549" font-size="27">13</text></g><g data-entry="3"><circle cx="254" cy="240" r="2.8" fill="#203549"/><text x="280" y="249" text-anchor="middle" fill="#203549" font-size="27">18</text></g><g data-entry="4"><circle cx="399" cy="105" r="2.8" fill="#203549"/><text x="425" y="114" text-anchor="middle" fill="#203549" font-size="27">6</text></g><g data-entry="5"><circle cx="399" cy="235" r="2.8" fill="#203549"/><text x="425" y="244" text-anchor="middle" fill="#203549" font-size="27">11</text></g><g data-entry="6"><circle cx="59" cy="332" r="2.8" fill="#203549"/><text x="85" y="341" text-anchor="middle" fill="#203549" font-size="27">3</text></g></g></svg>