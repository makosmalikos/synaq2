<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">K, L жиындарының диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек K = 11; тек K және L = белгісіз; тек L = 13. K толық саны 19; L толық саны белгісіз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="170" cy="190" r="122" fill="#80b6ec" fill-opacity=".24"/><circle cx="310" cy="190" r="122" fill="#ebc561" fill-opacity=".24"/><circle data-set="K" cx="170" cy="190" r="122" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="L" cx="310" cy="190" r="122" fill="none" stroke="#203549" stroke-width="2"/><text x="110" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="A" data-count="11">11</text><text x="240" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="unknown">?</text><text x="370" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="B" data-count="13">13</text><text x="80" y="70" text-anchor="middle" fill="#203549" font-size="29" >K</text><text x="400" y="70" text-anchor="middle" fill="#203549" font-size="29" >L</text><text x="130" y="30" text-anchor="middle" fill="#203549" font-size="25" data-total="A" data-value="19">n(K) = 19</text><text x="350" y="30" text-anchor="middle" fill="#203549" font-size="25" data-total="B" data-value="unknown">n(L) = ?</text></g></svg>