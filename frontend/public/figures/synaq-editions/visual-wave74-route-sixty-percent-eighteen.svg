<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Пайызы бойынша бүтінді табу</title><desc id="desc">Толық жолақ 5 тең бөлікке бөлінген. Сол жақтағы 3 бөлік көк. Көк бөліктердің бәрін қамтитын жақшаның үстінде 18 км жазылған. Шкаланың екі шеті 0% және 100%, аралықтағы белгілер 20%, 40%, 60%, 80%.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="125" x2="278.4" y2="125" stroke="#23394b" stroke-width="1.4" data-brace="blue"/><line x1="30" y1="118" x2="30" y2="132" stroke="#23394b" stroke-width="1.4" /><line x1="278.4" y1="118" x2="278.4" y2="132" stroke="#23394b" stroke-width="1.4" /><text x="154.2" y="111" text-anchor="middle" fill="#23394b" font-size="27" data-known="blue">18 км</text><rect data-part="0" data-paint="blue" x="30" y="165" width="82.8" height="64" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><rect data-part="1" data-paint="blue" x="112.8" y="165" width="82.8" height="64" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><rect data-part="2" data-paint="blue" x="195.6" y="165" width="82.8" height="64" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><rect data-part="3" data-paint="none" x="278.4" y="165" width="82.8" height="64" fill="#fff" stroke="#23394b" stroke-width="1.5"/><rect data-part="4" data-paint="none" x="361.2" y="165" width="82.8" height="64" fill="#fff" stroke="#23394b" stroke-width="1.5"/><line x1="30" y1="229" x2="30" y2="237" stroke="#23394b" stroke-width="1.4" data-tick="0"/><text x="30" y="271" text-anchor="middle" fill="#23394b" font-size="25" data-scale="0">0%</text><line x1="112.8" y1="229" x2="112.8" y2="237" stroke="#23394b" stroke-width="1.4" data-tick="1"/><text x="112.8" y="271" text-anchor="middle" fill="#23394b" font-size="25" data-scale="1">20%</text><line x1="195.6" y1="229" x2="195.6" y2="237" stroke="#23394b" 