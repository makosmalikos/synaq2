<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі бөлшектерді көбейту</title><desc id="desc">Бастапқы ақша 84000 теңге. Көк — кітапқа бастапқының (1/4) үлесі; сары — ҚАЛҒАН ақшаның (2/3) үлесі; ақ бөлікте «?».</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="23">Бастапқы ақша</text><line x1="42" y1="121" x2="438" y2="121" stroke="#203549" stroke-width="2" data-bracket="original"/><line x1="42" y1="121" x2="50" y2="116" stroke="#203549" stroke-width="2" /><line x1="42" y1="121" x2="50" y2="126" stroke="#203549" stroke-width="2" /><line x1="438" y1="121" x2="430" y2="116" stroke="#203549" stroke-width="2" /><line x1="438" y1="121" x2="430" y2="126" stroke="#203549" stroke-width="2" /><text x="240" y="100" text-anchor="middle" fill="#203549" font-size="26">84000 теңге</text><rect data-money-part="0" x="42" y="169" width="99" height="94" fill="#9ec8ed" stroke="#203549" stroke-width="1.7"/><g data-fraction="1/4"><text x="91.5" y="198" text-anchor="middle" fill="#203549" font-size="23">1</text><line x1="74.5" y1="205" x2="108.5" y2="205" stroke="#203549" stroke-width="2" /><text x="91.5" y="230" text-anchor="middle" fill="#203549" font-size="23">4</text></g><rect data-money-part="1" x="141" y="169" width="198" height="94" fill="#f6d16e" stroke="#203549" stroke-width="1.7"/><text x="240" y="191" text-anchor="middle" fill="#203549" font-size="21">Қалғанның</text><g data-fraction="2/3"><text x="240" y="219" text-anchor="middle" fill="#203549" font-size="23">2</text><line x1="223" y1="226" x2="257" y2="226" stroke="#203549" stroke-width="2" /><text x="240" y="251" text-anchor="middle" fill="#203549" font-size="23">3</text></g><rect data-money-part="2" x="339" y="169" width="99" height="94" fill="#fff" stroke="#203549"