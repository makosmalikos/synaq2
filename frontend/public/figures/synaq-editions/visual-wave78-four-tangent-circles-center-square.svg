<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">Бірдей төрт шеңбер екі қатарда жұп-жұптан жанасады. Көк шаршы олардың төрт центрін қосады. Бір шеңбердің радиусында 4 см. Шаршының қабырғасы дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="corner0" cx="177.5" cy="97.5" r="62.5" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="corner1" cx="302.5" cy="97.5" r="62.5" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="corner2" cx="302.5" cy="222.5" r="62.5" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="corner3" cx="177.5" cy="222.5" r="62.5" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><polygon data-center-square="true" points="177.5,97.5 302.5,97.5 302.5,222.5 177.5,222.5" fill="none" stroke="#75aae9" stroke-width="3"/><circle data-center="0" cx="177.5" cy="97.5" r="3.5" fill="#213a53"/><circle data-center="1" cx="302.5" cy="97.5" r="3.5" fill="#213a53"/><circle data-center="2" cx="302.5" cy="222.5" r="3.5" fill="#213a53"/><circle data-center="3" cx="177.5" cy="222.5" r="3.5" fill="#213a53"/><line x1="177.5" y1="97.5" x2="177.5" y2="35" stroke="#213a53" stroke-width="2" data-radius="given"/><text x="203.5" y="74.25" text-anchor="middle" fill="#213a53" font-size="27" data-given="radius">4 см</text></g></svg>