<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">A және O центрлі екі шеңбер B,C нүктелерінде қиылысып, ABOC төртбұрышы салынған. O центрлі шеңбердің радиусында 7 см; төртбұрыштың периметрі 44 см. Бірінші радиус пен диаметр белгісіз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="first" cx="194.28571428571428" cy="160" r="114.28571428571428" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="second" cx="346.66666666666663" cy="160" r="53.33333333333333" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="194.28571428571428" y1="160" x2="304" y2="128" stroke="#213a53" stroke-width="2" data-kite-edge="first-upper"/><line x1="346.66666666666663" y1="160" x2="304" y2="128" stroke="#213a53" stroke-width="2" data-kite-edge="second-upper"/><line x1="346.66666666666663" y1="160" x2="304" y2="192" stroke="#213a53" stroke-width="2" data-kite-edge="second-lower"/><line x1="194.28571428571428" y1="160" x2="304" y2="192" stroke="#213a53" stroke-width="2" data-kite-edge="first-lower"/><circle data-point="A" cx="194.28571428571428" cy="160" r="3.8" fill="#213a53"/><text x="178.28571428571428" y="183" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text><circle data-point="O" cx="346.66666666666663" cy="160" r="3.8" fill="#213a53"/><text x="334.66666666666663" y="185" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text><circle data-point="B" cx="304" cy="128" r="3.8" fill="#213a53"/><text x="316" y="117" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="B">B</text><circle data-point="C" cx="304" cy="192" r="3.8" fill="#213a53"/><text x="316" y="217" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="C">C</text><line x1="346.66666666666663" y1="160" x2="400" y2="160" stroke="#213a53" stroke-width="2" data-radius="second"/><text x="373.3333333333333" y="150" text-anchor="middle" fill="#213a53" font-size="27" data-given="radius">7 см</text><text x="240" y="337" text-anchor="middle" fill="#213a53" font-size="27" data-given="kiteP">Pтөртбұрыш = 44 см</text></g></svg>