<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ бөлгіш</title><desc id="desc">Тікбұрышты параллелепипедтің ұзындығы 90 см, биіктігі 36 см, тереңдігі 54 см. Кесу торы салынбаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon points="90,178 339,178 421,113 172,113" fill="#e8ddc6" stroke="#203549" stroke-width="1.8"/><polygon points="339,278 421,213 421,113 339,178" fill="#c9b394" stroke="#203549" stroke-width="1.8"/><polygon points="90,278 339,278 339,178 90,178" fill="#dfcbb0" stroke="#203549" stroke-width="1.8"/><text x="214" y="322" text-anchor="middle" fill="#203549" font-size="27" >90 см</text><text x="55" y="235" text-anchor="middle" fill="#203549" font-size="25" transform="rotate(-90 55 235)">36 см</text><text x="393" y="289" text-anchor="middle" fill="#203549" font-size="25" >54 см</text></g></svg>