<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі аралас сандар</title><desc id="desc">Масштабсыз үшбұрыштың үш қабырғасы (6 + (1/3)), (5 + (3/4)), (7 + (11/12)) сантиметр деп белгіленген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="22">Үш қабырға — сантиметрмен</text><polygon data-triangle="true" points="110,252 240,112 370,252" fill="#e8effd" stroke="#203549" stroke-width="3"/><g data-mixed="6,1,3"><text x="86" y="173" text-anchor="middle" fill="#203549" font-size="27">6</text><text x="120" y="156" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="104" y1="165" x2="136" y2="165" stroke="#203549" stroke-width="2" /><text x="120" y="191" text-anchor="middle" fill="#203549" font-size="22">3</text></g><g data-mixed="5,3,4"><text x="349" y="173" text-anchor="middle" fill="#203549" font-size="27">5</text><text x="383" y="156" text-anchor="middle" fill="#203549" font-size="22">3</text><line x1="367" y1="165" x2="399" y2="165" stroke="#203549" stroke-width="2" /><text x="383" y="191" text-anchor="middle" fill="#203549" font-size="22">4</text></g><g data-mixed="7,11,12"><text x="218" y="307" text-anchor="middle" fill="#203549" font-size="27">7</text><text x="252" y="290" text-anchor="middle" fill="#203549" font-size="22">11</text><line x1="236" y1="299" x2="268" y2="299" stroke="#203549" stroke-width="2" /><text x="252" y="325" text-anchor="middle" fill="#203549" font-size="22">12</text></g><text x="240" y="350" text-anchor="middle" fill="#203549" font-size="19">Сызба масштабсыз</text></g></svg>