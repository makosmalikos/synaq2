<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Пайызы бойынша бүтінді табу</title><desc id="desc">Бірдей сол шеттен басталған B және A жолақтары бір масштабта: B толық шкаладағы 100% белгісіне, A 70% белгісіне дейін жетеді. A соңынан B соңына дейінгі қызыл қос нұсқардың үстінде 2400 ₸ жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-person="B" x="65" y="85" width="360" height="45" fill="#ecc95c" stroke="#23394b" stroke-width="1.6"/><text x="37" y="117" text-anchor="middle" fill="#23394b" font-size="27" >B</text><rect data-person="A" x="65" y="175" width="252" height="45" fill="#81b8ed" stroke="#23394b" stroke-width="1.6"/><text x="37" y="207" text-anchor="middle" fill="#23394b" font-size="27" >A</text><line data-gap="true" x1="317" x2="425" y1="241" y2="241" stroke="#b94f69" stroke-width="2"/><path d="M317 241l9 -5v10Z M425 241l-9 -5v10Z" fill="#b94f69"/><text x="371" y="228" text-anchor="middle" fill="#23394b" font-size="26" data-gap-value="true">2400 ₸</text><line x1="65" y1="295" x2="65" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="0"/><text x="65" y="342" text-anchor="middle" fill="#23394b" font-size="25" data-money-percent="0">0%</text><line x1="101" y1="295" x2="101" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="1"/><line x1="137" y1="295" x2="137" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="2"/><line x1="173" y1="295" x2="173" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="3"/><line x1="209" y1="295" x2="209" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="4"/><line x1="245" y1="295" x2="245" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="5"/><line x1="281" y1="295" x2="281" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="6"/><line x1="317" y1="295" x2="317" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="7"/><text x="317" y="342" text-anchor="middle" fill="#23394b" font-size="25" data-money-percent="7">70%</text><line x1="353" y1="295" x2="353" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="8"/><line x1="389" y1="295" x2="389" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="9"/><line x1="425" y1="295" x2="425" y2="308" stroke="#23394b" stroke-width="1.4" data-money-tick="10"/><text x="425" y="342" text-anchor="middle" fill="#23394b" font-size="25" data-money-percent="10">100%</text><line x1="65" y1="302" x2="425" y2="302" stroke="#23394b" stroke-width="1.4" /></g></svg>