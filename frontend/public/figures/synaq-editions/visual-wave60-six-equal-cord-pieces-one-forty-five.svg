<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық көбейтуге суретті тапсырма</title><desc id="desc">6 бірдей тік төртбұрыш бір жолақ құрайды. Біріншісінде 1,45 метр, бүкіл ұзындық сұрақ белгісімен берілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="47" text-anchor="middle" fill="#203549" font-size="24">Ұзындықтар — м</text><rect x="48" y="177" width="64" height="64" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-part="0"/><rect x="112" y="177" width="64" height="64" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-part="1"/><rect x="176" y="177" width="64" height="64" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-part="2"/><rect x="240" y="177" width="64" height="64" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-part="3"/><rect x="304" y="177" width="64" height="64" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-part="4"/><rect x="368" y="177" width="64" height="64" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-part="5"/><text x="80" y="219" text-anchor="middle" fill="#203549" font-size="23">1,45</text><line x1="48" y1="127" x2="432" y2="127" stroke="#203549" stroke-width="2" /><line x1="48" y1="119" x2="48" y2="135" stroke="#203549" stroke-width="2" /><line x1="432" y1="119" x2="432" y2="135" stroke="#203549" stroke-width="2" /><text x="240" y="108" text-anchor="middle" fill="#203549" font-size="28">?</text></g></svg>