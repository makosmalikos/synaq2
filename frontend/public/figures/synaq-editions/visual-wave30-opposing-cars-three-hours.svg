<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Формуланы қолдану</title><desc id="desc">A-дан оңға 75 км/сағ, B-дан солға 55 км/сағ нұсқар; A мен B арасы 390 км.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="50" y1="205" x2="430" y2="205" stroke="#203549" stroke-width="1.6" /><line x1="66" y1="155" x2="199" y2="155" stroke="#203549" stroke-width="1.6" /><line x1="414" y1="155" x2="281" y2="155" stroke="#203549" stroke-width="1.6" /><polygon data-travel="right" points="208,155 196,149 196,161" fill="#315ce8"/><polygon data-travel="left" points="272,155 284,149 284,161" fill="#8958c7"/><text x="134" y="134" text-anchor="middle" fill="#203549" font-size="23">75 км/сағ</text><text x="346" y="134" text-anchor="middle" fill="#203549" font-size="23">55 км/сағ</text><text x="50" y="239" text-anchor="middle" fill="#203549" font-size="23">A</text><text x="430" y="239" text-anchor="middle" fill="#203549" font-size="23">B</text><text x="240" y="287" text-anchor="middle" fill="#203549" font-size="26">390 км</text><circle cx="50" cy="205" r="4" fill="#203549"/><circle cx="430" cy="205" r="4" fill="#203549"/></g></svg>