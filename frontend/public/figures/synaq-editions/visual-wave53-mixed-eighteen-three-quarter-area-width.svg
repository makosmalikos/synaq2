<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сурет бойынша бөлшектерді бөлу</title><desc id="desc">Тіктөртбұрыштың ауданы (18 + (3/4)) м², ені (2 + (1/12)) м. Төменгі ұзындық нұсқарының үстінде «?».</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="37" text-anchor="middle" fill="#203549" font-size="22">Аудан мен ен берілген</text><text x="161" y="88" text-anchor="middle" fill="#203549" font-size="24">S =</text><g data-mixed="18,3,4"><text x="216" y="88" text-anchor="middle" fill="#203549" font-size="27">18</text><text x="250" y="71" text-anchor="middle" fill="#203549" font-size="22">3</text><line x1="234" y1="80" x2="266" y2="80" stroke="#203549" stroke-width="2" /><text x="250" y="106" text-anchor="middle" fill="#203549" font-size="22">4</text><text x="291" y="88" text-anchor="middle" fill="#203549" font-size="21">м²</text></g><rect data-rectangle="true" x="50" y="170" width="300" height="69.44444444444444" fill="#9ec8ed" stroke="#203549" stroke-width="2.2"/><g data-mixed="2,1,12"><text x="381" y="204" text-anchor="middle" fill="#203549" font-size="27">2</text><text x="415" y="187" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="399" y1="196" x2="431" y2="196" stroke="#203549" stroke-width="2" /><text x="415" y="222" text-anchor="middle" fill="#203549" font-size="22">12</text><text x="456" y="204" text-anchor="middle" fill="#203549" font-size="21">м</text></g><line x1="50" y1="277" x2="350" y2="277" stroke="#203549" stroke-width="2" data-bracket="unknown-length"/><line x1="50" y1="277" x2="56" y2="273" stroke="#203549" stroke-width="2" /><line x1="50" y1="277" x2="56" y2="281" stroke="#203549" stroke-width="2" /><line x1="350" y1="277" x2="344" y2="273" stroke="#203549" stroke-width="2" /><line x1="350" y1="277" x2="344" y2="281" stroke="#203549" stroke-width="2" /><text x="200" y="317" text-anchor="middle" fill="#203549" font-size="29">?</text></g></svg>