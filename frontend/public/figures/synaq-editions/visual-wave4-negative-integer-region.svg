<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">Таңбалы шамалар зертханасы</title><desc id="desc">Сызбада N = {1, 2, 3, ...}, Z — бүтін сандар, Q — рационал сандар жиындары көрсетілген. -14 саны әріппен белгіленген қай бөлікке тиісті? Ең кіші сәйкес аймақтың әрпін таңдаңдар. Ең ішкі N аймағы C, Z ішінде N-нен тыс A, Q ішінде Z-тен тыс B. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6574b1"/></marker></defs><rect width="480" height="340" fill="white"/><ellipse cx="240" cy="169" rx="174" ry="112" fill="#edf4ff" stroke="#8ea7c5" stroke-width="2"/><ellipse cx="210" cy="169" rx="116" ry="79" fill="#dce8ff" stroke="#7a94bc" stroke-width="2"/><ellipse cx="175" cy="169" rx="64" ry="44" fill="#bfd2ff" stroke="#6888bd" stroke-width="2"/><text x="338" y="86" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" dominant-baseline="middle" fill="#476591" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >Q</text><text x="260" y="114" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" dominant-baseline="middle" fill="#476591" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >Z</text><text x="175" y="140" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" dominant-baseline="middle" fill="#476591" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >N</text><text x="175" y="181" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" dominant-baseline="middle" fill="#5c45b5" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >C</text><text x="283" y="176" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" dominant-baseline="middle" fill="#5c45b5" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >A</text><text x="377" y="174" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" dominant-baseline="middle" fill="#5c45b5" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >B</text><text x="240" y="316" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#476591" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >N ⊂ Z ⊂ Q</text></svg>
