<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық координаталарды сәуледен оқу</title><desc id="desc">Бірдей аралықты сәуле. Жазылған белгілер: 0 саны 0-белгіде; 1 саны 10-белгіде; 2 саны 20-белгіде. P сол жақ алғашқы белгіден 6 қадам оңда; Q сол жақ алғашқы белгіден 12 қадам оңда; R сол жақ алғашқы белгіден 15 қадам оңда; S сол жақ алғашқы белгіден 19 қадам оңда. Нұсқар оңға бағытталған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="66" text-anchor="middle" fill="#203549" font-size="24">Координаталық сәуле</text><line x1="28" y1="193" x2="449" y2="193" stroke="#203549" stroke-width="1.7" data-axis="main"/><path d="M 449 193 L 439 188 L 439 198 Z" fill="#203549"/><line x1="36" y1="183" x2="36" y2="203" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="0"/><line x1="55.5" y1="187" x2="55.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="1"/><line x1="75" y1="187" x2="75" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="2"/><line x1="94.5" y1="187" x2="94.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="3"/><line x1="114" y1="187" x2="114" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="4"/><line x1="133.5" y1="187" x2="133.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="5"/><line x1="153" y1="187" x2="153" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="6"/><line x1="172.5" y1="187" x2="172.5" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="7"/><line x1="192" y1="187" x2="192" y2="199" stroke="#203549" stroke-width="1.7" data-tick-axis="main" data-index="8"/><line x1="211.5" y1="187" x2="211.5" y2="199" stroke="#203549" st