<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">O центрлі шеңберде P,Q,R нүктелері белгіленген. P мен Q арасындағы R арқылы өтпейтін доға қалың көк, қалған шекара жұқа.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="main" cx="240" cy="160" r="112.5" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><path data-highlight="PQ" d="M345.71541983841473 121.52273387586227 A112.5 112.5 0 0 0 142.57214207425065 103.75" fill="none" stroke="#75aae9" stroke-width="7"/><circle data-point="P" cx="345.71541983841473" cy="121.52273387586227" r="3.8" fill="#213a53"/><text x="364.5092722541329" y="121.6823310093489" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="P">P</text><circle data-point="Q" cx="142.57214207425065" cy="103.75" r="3.8" fill="#213a53"/><text x="125.25163399856187" y="100.75" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="Q">Q</text><circle data-point="R" cx="220.46458001247035" cy="270.7908722138734" r="3.8" fill="#213a53"/><text x="216.99161645913173" y="297.48702727411757" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="R">R</text><circle data-point="O" cx="240" cy="160" r="3.8" fill="#213a53"/><text x="224" y="183" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text></g></svg>