<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай сандар мен бөлінгіштік</title><desc id="desc">Бүтін кесінді 1200 л; 3 көк бөліктің әрқайсысында 180 л жазылған. Қалған бөлікте сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="60" y1="116" x2="420" y2="116" stroke="#203549" stroke-width="1.6" /><line x1="60" y1="111" x2="60" y2="121" stroke="#203549" stroke-width="1.6" /><line x1="420" y1="111" x2="420" y2="121" stroke="#203549" stroke-width="1.6" /><text x="240" y="101" text-anchor="middle" fill="#203549" font-size="25" >1200 л</text><rect x="60" y="152" width="54" height="70" fill="#8eb3ef" stroke="#203549" stroke-width="1.5" data-withdrawal="0"/><text x="87" y="197" text-anchor="middle" fill="#203549" font-size="22" >180</text><rect x="114" y="152" width="54" height="70" fill="#8eb3ef" stroke="#203549" stroke-width="1.5" data-withdrawal="1"/><text x="141" y="197" text-anchor="middle" fill="#203549" font-size="22" >180</text><rect x="168" y="152" width="54" height="70" fill="#8eb3ef" stroke="#203549" stroke-width="1.5" data-withdrawal="2"/><text x="195" y="197" text-anchor="middle" fill="#203549" font-size="22" >180</text><rect x="222" y="152" width="198" height="70" fill="#f7f9fd" stroke="#203549" stroke-width="1.5" data-remaining="unknown"/><text x="321" y="197" text-anchor="middle" fill="#203549" font-size="29" >?</text></g></svg>