<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі бөлшектерді көбейту</title><desc id="desc">Шаршының бір қабырғасы (2 + (1/4)) дм деп берілген, барлық қабырғалары тең.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="22">Қабырға — дециметрмен</text><rect data-square="true" x="135" y="79" width="210" height="210" fill="#e8effd" stroke="#203549" stroke-width="3"/><g data-mixed="2,1,4"><text x="208" y="335" text-anchor="middle" fill="#203549" font-size="27">2</text><text x="242" y="318" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="226" y1="327" x2="258" y2="327" stroke="#203549" stroke-width="2" /><text x="242" y="353" text-anchor="middle" fill="#203549" font-size="22">4</text><text x="283" y="335" text-anchor="middle" fill="#203549" font-size="21">дм</text></g></g></svg>