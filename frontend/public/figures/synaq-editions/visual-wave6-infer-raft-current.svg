<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Қозғалыс пен өзгерістер сызбасы</title><desc id="desc">A-дан жіберілген сал сызбадағы қашықтықты 7 сағатта өтті. Өзеннің ағыс жылдамдығын км/сағ бірлігімен табыңыз. Жауапқа тек санды жазыңыз. A солда, B оңда; AB = 42 км. Ағыс оңға бағытталған, жылдамдығы белгісіз. Сал ағыспен қозғалады. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6b80ae"/></marker></defs><rect width="480" height="360" fill="white"/><rect x="25" y="91" width="430" height="179" rx="20" fill="#e4f1ff"/><path d="M40,110 Q60,102 80,110 T120,110 T160,110 T200,110 T240,110 T280,110 T320,110 T360,110 T400,110 T440,110" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,144 Q60,136 80,144 T120,144 T160,144 T200,144 T240,144 T280,144 T320,144 T360,144 T400,144 T440,144" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,178 Q60,170 80,178 T120,178 T160,178 T200,178 T240,178 T280,178 T320,178 T360,178 T400,178 T440,178" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,212 Q60,204 80,212 T120,212 T160,212 T200,212 T240,212 T280,212 T320,212 T360,212 T400,212 T440,212" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><path d="M40,246 Q60,238 80,246 T120,246 T160,246 T200,246 T240,246 T280,246 T320,246 T360,246 T400,246 T440,246" fill="none" stroke="#c2ddf3" stroke-width="1.4"/><text x="63" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">A</text><text x="417" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">B</text><line x1="92" y1="58" x2="388" y2="58" stroke="#7b95b7" stroke-width="1.4"/><text x="240" y="32" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">42 км</text><rect x="195" y="169" width="17" height="48" rx="7" fill="#e0b07d" stroke="#ac8059" stroke-width="1.4"/><rect x="213" y="169" width="17" height="48" rx="7" fill="#e0b07d" stroke="#ac8059" stroke-width="1.4"/><rect x="231" y="169" width="17" height="48" rx="7" fill="#e0b07d" stroke="#ac8059" stroke-width="1.4"/><rect x="249" y="169" width="17" height="48" rx="7" fill="#e0b07d" stroke="#ac8059" stroke-width="1.4"/><rect x="267" y="169" width="17" height="48" rx="7" fill="#e0b07d" stroke="#ac8059" stroke-width="1.4"/><line x1="195" y1="179" x2="284" y2="179" stroke="#895d3e" stroke-width="2"/><line x1="195" y1="207" x2="284" y2="207" stroke="#895d3e" stroke-width="2"/><text x="240" y="141" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Сал</text><line x1="150" y1="294" x2="330" y2="294" stroke="#558fb6" stroke-width="2.8" marker-end="url(#tip)" data-current-direction="1"/><text x="240" y="326" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Ағыс: ? км/сағ</text></svg>
