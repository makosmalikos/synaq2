<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Өлшемдер мен координаталарды дөңгелектеу</title><desc id="desc">Тіктөртбұрыштың төменгі қабырғасы 2,76, сол қабырғасы 1,57. Бірлік дм.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="30" text-anchor="middle" fill="#203549" font-size="24">Өлшемдер — дм</text><rect x="115" y="95" width="300" height="170.65217391304347" fill="#c0dfff" stroke="#203549" stroke-width="1.7" data-rectangle="true"/><text x="265" y="307.6521739130435" text-anchor="middle" fill="#203549" font-size="27">2,76</text><text x="59" y="188.32608695652175" text-anchor="middle" fill="#203549" font-size="26">1,57</text></g></svg>