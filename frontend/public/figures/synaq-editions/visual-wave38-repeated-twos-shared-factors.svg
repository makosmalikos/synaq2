<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ бөлгіш</title><desc id="desc">Сол дөңгелек a, оң дөңгелек b. Тек сол аймақта 5, ортақ аймақта 2, 2, 3, тек оң аймақта 7. Әр белгі жеке көбейткіш.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="177" cy="189" r="116" fill="#b8d9fb" fill-opacity="0.65" stroke="#203549" stroke-width="1.8"/><circle cx="305" cy="189" r="116" fill="#d4c3eb" fill-opacity="0.62" stroke="#203549" stroke-width="1.8"/><text x="114" y="51" text-anchor="middle" fill="#203549" font-size="28" >a</text><text x="370" y="51" text-anchor="middle" fill="#203549" font-size="28" >b</text><text x="111" y="199" text-anchor="middle" fill="#203549" font-size="31" data-factor-region="left">5</text><text x="370" y="199" text-anchor="middle" fill="#203549" font-size="31" data-factor-region="right">7</text><text x="241" y="143" text-anchor="middle" fill="#203549" font-size="31" data-factor-region="common">2</text><text x="241" y="190" text-anchor="middle" fill="#203549" font-size="31" data-factor-region="common">2</text><text x="241" y="237" text-anchor="middle" fill="#203549" font-size="31" data-factor-region="common">3</text></g></svg>