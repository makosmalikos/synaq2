<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-edition="geometry-robot-box-height" data-model="cuboid-missing-height"><title id="title">Робот қорабының белгісіз биіктігі</title><desc id="desc">Табан қабырғалары 12 см және 7 см, ішкі көлемі 504 см³ болатын тікбұрышты қорап. Биіктігі h белгісімен көрсетілген.</desc><rect width="720" height="480" fill="white"/><g stroke="#233b5d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" text-anchor="middle"><style>text{fill:#18304e;stroke:none}</style><polygon points="140,180 470,180 470,350 140,350" fill="#e4edff"/><polygon points="140,180 260,90 590,90 470,180" fill="#c8dafd"/><polygon points="470,180 590,90 590,260 470,350" fill="#a5c3fc"/><line x1="140" y1="385" x2="470" y2="385" /><line x1="140" y1="375" x2="140" y2="395" /><line x1="470" y1="375" x2="470" y2="395" /><text x="305" y="433" data-given="lengthCm" data-value="12">12 см</text><text x="570" y="369" data-given="widthCm" data-value="7">7 см</text><text x="85" y="276" >h = ?</text><text x="360" y="48" data-given="volumeCm3" data-value="504">V = 504 см³</text></g></svg>
