<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиын элементтерін суреттен оқу</title><desc id="desc">L дөңгелегінің ішінде b; f; h; p; t. Сыртында a; g; r.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="32" text-anchor="middle" fill="#203549" font-size="22">Жиынның ішіндегі және сыртындағы белгілер</text><circle data-set="L" cx="220" cy="190" r="132" fill="#b7d5fa" fill-opacity=".44" stroke="#203549" stroke-width="2"/><text x="95" y="77" text-anchor="middle" fill="#203549" font-size="29">L</text><g data-entry="0"><circle cx="194" cy="105" r="2.8" fill="#203549"/><text x="220" y="114" text-anchor="middle" fill="#203549" font-size="27">b</text></g><g data-entry="1"><circle cx="124" cy="170" r="2.8" fill="#203549"/><text x="150" y="179" text-anchor="middle" fill="#203549" font-size="27">f</text></g><g data-entry="2"><circle cx="264" cy="170" r="2.8" fill="#203549"/><text x="290" y="179" text-anchor="middle" fill="#203549" font-size="27">h</text></g><g data-entry="3"><circle cx="149" cy="250" r="2.8" fill="#203549"/><text x="175" y="259" text-anchor="middle" fill="#203549" font-size="27">p</text></g><g data-entry="4"><circle cx="249" cy="250" r="2.8" fill="#203549"/><text x="275" y="259" text-anchor="middle" fill="#203549" font-size="27">t</text></g><g data-entry="5"><circle cx="399" cy="105" r="2.8" fill="#203549"/><text x="425" y="114" text-anchor="middle" fill="#203549" font-size="27">a</text></g><g data-entry="6"><circle cx="399" cy="235" r="2.8" fill="#203549"/><text x="425" y="244" text-anchor="middle" fill="#203549" font-size="27">g</text></g><g data-entry="7"><circle cx="59" cy="332" r="2.8" fill="#203549"/><text x="85" y="341" text-anchor="middle" fill="#203549" font-size="27">r</text></g></g></svg>