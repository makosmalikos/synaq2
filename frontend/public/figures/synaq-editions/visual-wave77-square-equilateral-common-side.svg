<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Шаршының оң қабырғасына сыртқа қарай теңқабырғалы үшбұрыш жалғасқан. Ортақ қабырға үзік сызық, қалған шекара тұтас. Шаршы периметрі 52 см деп жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="80,240.74374157795927 251.48748315591854,240.74374157795927 400,155 251.48748315591854,69.25625842204073 80,69.25625842204073" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><line x1="251.48748315591854" y1="240.74374157795927" x2="251.48748315591854" y2="69.25625842204073" stroke="#243a51" stroke-width="2" stroke-dasharray="6 6" data-shared="true"/><text x="240" y="320" text-anchor="middle" fill="#243a51" font-size="27" data-given="squareP">Pшаршы = 52 см</text></g></svg>