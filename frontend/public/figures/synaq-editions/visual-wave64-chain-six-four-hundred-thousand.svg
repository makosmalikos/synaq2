<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық үтір мен он дәрежелерін оқу</title><desc id="desc">Бастапқы ұяшықта 6,4, бірінші нұсқарда × 100, аралық ұяшық бос. Екінші нұсқарда ÷ 1000, соңғы сары ұяшықта сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="24">Амалдарды ретімен орындаңыз</text><rect x="20" y="153" width="88" height="62" rx="5" fill="#dceeff" stroke="#203549" stroke-width="1.8" data-node="0"/><text x="64" y="193" text-anchor="middle" fill="#203549" font-size="29">6,4</text><rect x="196" y="153" width="88" height="62" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" data-node="1"/><text x="240" y="193" text-anchor="middle" fill="#203549" font-size="29"></text><rect x="372" y="153" width="88" height="62" rx="5" fill="#fff0b8" stroke="#203549" stroke-width="1.8" data-node="2"/><text x="416" y="193" text-anchor="middle" fill="#203549" font-size="29">?</text><line x1="115" y1="184" x2="189" y2="184" stroke="#203549" stroke-width="2" /><path d="M 189 184 l -8 -5 l 0 10 Z" fill="#203549"/><text x="152" y="159" text-anchor="middle" fill="#203549" font-size="24">× 100</text><line x1="291" y1="184" x2="365" y2="184" stroke="#203549" stroke-width="2" /><path d="M 365 184 l -8 -5 l 0 10 Z" fill="#203549"/><text x="328" y="159" text-anchor="middle" fill="#203549" font-size="24">÷ 1000</text></g></svg>