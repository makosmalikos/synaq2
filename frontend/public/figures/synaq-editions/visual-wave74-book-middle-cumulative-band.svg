<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Пайызы бойынша бүтінді табу</title><desc id="desc">Бүкіл кітап жолағының шкаласы 0%, 20%, 65%, 100%. Көк бірінші бөлік 0–20%, сары екінші бөлік 20–65%, ақ үшінші бөлік 65–100% аралығында. Ақ бөліктің үстінде 84 бет жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-band="0" x="30" y="165" width="82.8" height="64" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><rect data-band="1" x="112.8" y="165" width="186.3" height="64" fill="#ecc95c" stroke="#23394b" stroke-width="1.5"/><rect data-band="2" x="299.1" y="165" width="144.9" height="64" fill="#fff" stroke="#23394b" stroke-width="1.5"/><line x1="299.1" y1="125" x2="444" y2="125" stroke="#23394b" stroke-width="1.4" data-brace="last"/><line x1="299.1" y1="118" x2="299.1" y2="132" stroke="#23394b" stroke-width="1.4" /><line x1="444" y1="118" x2="444" y2="132" stroke="#23394b" stroke-width="1.4" /><text x="371.55" y="111" text-anchor="middle" fill="#23394b" font-size="27" data-known="last">84 бет</text><line x1="30" y1="229" x2="30" y2="237" stroke="#23394b" stroke-width="1.4" data-boundary="0"/><text x="30" y="271" text-anchor="middle" fill="#23394b" font-size="25" data-cumulative="0">0%</text><line x1="112.8" y1="229" x2="112.8" y2="237" stroke="#23394b" stroke-width="1.4" data-boundary="20"/><text x="112.8" y="271" text-anchor="middle" fill="#23394b" font-size="25" data-cumulative="20">20%</text><line x1="299.1" y1="229" x2="299.1" y2="237" stroke="#23394b" stroke-width="1.4" data-boundary="65"/><text x="299.1" y="271" text-anchor="middle" fill="#23394b" font-size="25" data-cumulative="65">65%</text><line x1="444" y1="229" x2="444" y2="237" stroke="#23394b" stroke-width="1.4" data-boundary="100"/><text x="444" y="271" text-anchor="middle" fill="#23394b" font-size="25" data-cumulative="100">100%</text></g></svg>