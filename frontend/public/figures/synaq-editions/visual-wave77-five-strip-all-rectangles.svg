<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Үлкен тіктөртбұрышты толық биіктігі бойымен бөлетін төрт ішкі тік кесінді бар. Көлденең ішкі кесінді жоқ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="75,90 405,90 405,240 75,240" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><line x1="141" y1="90" x2="141" y2="240" stroke="#243a51" stroke-width="2" data-divider="1"/><line x1="207" y1="90" x2="207" y2="240" stroke="#243a51" stroke-width="2" data-divider="2"/><line x1="273" y1="90" x2="273" y2="240" stroke="#243a51" stroke-width="2" data-divider="3"/><line x1="339" y1="90" x2="339" y2="240" stroke="#243a51" stroke-width="2" data-divider="4"/></g></svg>