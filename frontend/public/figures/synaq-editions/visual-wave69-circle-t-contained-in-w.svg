<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ішкі жиындардың орналасуы</title><desc id="desc">W ішінде бөлек K және T шеңберлері. Z сыртында, бәрінен бөлек.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Ішкі жиындар</text><circle data-set="W" cx="175" cy="190" r="134" fill="#e0edff" stroke="#203549" stroke-width="2"/><circle data-set="K" cx="121" cy="190" r="50" fill="#fff1bc" stroke="#203549" stroke-width="2"/><circle data-set="T" cx="237" cy="224" r="44" fill="#fff1bc" stroke="#203549" stroke-width="2"/><circle data-set="Z" cx="403" cy="157" r="47" fill="#e0edff" stroke="#203549" stroke-width="2"/><text x="167" y="94" text-anchor="middle" fill="#203549" font-size="28">W</text><text x="121" y="199" text-anchor="middle" fill="#203549" font-size="29">K</text><text x="237" y="233" text-anchor="middle" fill="#203549" font-size="29">T</text><text x="403" y="166" text-anchor="middle" fill="#203549" font-size="29">Z</text></g></svg>