<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">O центрлі толық дөңгелек, 5 радиус. Сектор ішіндегі жазулар ретімен: 74°; өлшем жазылмаған; 112°; ?; өлшем жазылмаған. Шаршы тік бұрыш белгісі бар. Бірдей доға сызықшалары тиісті секторлардың теңдігін білдіреді. Сұралған сектор немесе құрамдас бөліктер көкпен боялған. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><path data-shaded-sector="3" d="M240 172 L252.0207732757801 286.37001796735143 A115 115 0 0 0 325.4616549299003 248.9500197312687 Z" fill="#7baeea" fill-opacity=".7"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="0"/><line x1="240" y1="172" x2="271.6982959189549" y2="61.45490496709333" stroke="#233c56" stroke-width="1.8" data-radius="1"/><line x1="240" y1="172" x2="129.45490496709334" y2="140.30170408104505" stroke="#233c56" stroke-width="1.8" data-radius="2"/><line x1="240" y1="172" x2="252.0207732757801" y2="286.37001796735143" stroke="#233c56" stroke-width="1.8" data-radius="3"/><line x1="240" y1="172" x2="325.4616549299003" y2="248.9500197312687" stroke="#233c56" stroke-width="1.8" data-radius="4"/><text x="294.30721468321593" y="139.07657842566073" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="0">74°</text><path data-right="1" d="M244.13456033725498 157.58107456092523 L229.7156348981802 153.44651422367025 L225.58107456092523 167.86543966274502" fill="none" stroke="#233c56" stroke-width="1.7"/><text x="187.90897786790947" y="223.70955745868469" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="2">112°</text><text x="276.77323047890326" y="252.1715284592