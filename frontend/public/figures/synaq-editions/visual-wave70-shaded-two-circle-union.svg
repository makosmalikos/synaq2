<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиындардың бірігуі мен қиылысуы</title><desc id="desc">Екі қиылысқан M/N шеңбері, екеуінің де бүкіл ішкі бөлігі көк.</desc><defs></defs><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Бірігу және қиылысу</text><circle data-union-fill="true" cx="170" cy="190" r="122" fill="#a8d3fa"/><circle data-union-fill="true" cx="310" cy="190" r="122" fill="#a8d3fa"/><circle data-set="M" cx="170" cy="190" r="122" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="N" cx="310" cy="190" r="122" fill="none" stroke="#203549" stroke-width="2" /><text x="93" y="65" text-anchor="middle" fill="#203549" font-size="28">M</text><text x="387" y="65" text-anchor="middle" fill="#203549" font-size="28">N</text></g></svg>