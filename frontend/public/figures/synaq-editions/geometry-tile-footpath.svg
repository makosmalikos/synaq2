<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-edition="geometry-tile-footpath" data-model="tile-boundary"><title id="title">Жеті шаршы плиткадан құралған соқпақ</title><desc id="desc">Жоғарғы және төменгі қатарларда үш-үш плитка, оларды ортадағы бір плитка жалғайды. Әр плитканың қабырғасы 3 см.</desc><rect width="720" height="480" fill="white"/><g stroke="#233b5d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" text-anchor="middle"><style>text{fill:#18304e;stroke:none}</style><text x="360" y="60" data-given="sideCm" data-value="3">Плитканың қабырғасы: 3 см</text><rect data-role="tile" data-cell="0,0" x="228" y="120" width="88" height="88" fill="#c8dafd"/><rect data-role="tile" data-cell="1,0" x="316" y="120" width="88" height="88" fill="#c8dafd"/><rect data-role="tile" data-cell="2,0" x="404" y="120" width="88" height="88" fill="#c8dafd"/><rect data-role="tile" data-cell="1,1" x="316" y="208" width="88" height="88" fill="#c8dafd"/><rect data-role="tile" data-cell="0,2" x="228" y="296" width="88" height="88" fill="#c8dafd"/><rect data-role="tile" data-cell="1,2" x="316" y="296" width="88" height="88" fill="#c8dafd"/><rect data-role="tile" data-cell="2,2" x="404" y="296" width="88" height="88" fill="#c8dafd"/><text x="360" y="445" >Тек сыртқы жиек</text></g></svg>
