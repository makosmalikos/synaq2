<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық сандармен суретті есеп</title><desc id="desc">Тең иінді көлденең таразы: сол табақта x және 3,78 кг, оң табақта 9,78 кг. Иіндер көлденең, табақтар бір деңгейде.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="45" text-anchor="middle" fill="#203549" font-size="24">Жазулар — килограмм</text><line x1="100" y1="187" x2="380" y2="187" stroke="#203549" stroke-width="2" data-balanced-beam="true"/><path d="M 240 187 L 206 264 L 274 264 Z" fill="#e9eff7" stroke="#203549" stroke-width="2"/><line x1="24" y1="162" x2="204" y2="162" stroke="#203549" stroke-width="2" /><line x1="284" y1="162" x2="448" y2="162" stroke="#203549" stroke-width="2" /><line x1="100" y1="162" x2="100" y2="187" stroke="#203549" stroke-width="2" /><line x1="380" y1="162" x2="380" y2="187" stroke="#203549" stroke-width="2" /><rect data-weight="x" x="33" y="108" width="66" height="54" fill="#fff" stroke="#203549" stroke-width="2"/><rect data-weight="left" x="106" y="108" width="92" height="54" fill="#fff0c2" stroke="#203549" stroke-width="2"/><rect data-weight="right" x="294" y="108" width="142" height="54" fill="#fff0c2" stroke="#203549" stroke-width="2"/><text x="66" y="144" text-anchor="middle" fill="#203549" font-size="30">x</text><text x="152" y="144" text-anchor="middle" fill="#203549" font-size="27">3,78</text><text x="365" y="144" text-anchor="middle" fill="#203549" font-size="27">9,78</text></g></svg>