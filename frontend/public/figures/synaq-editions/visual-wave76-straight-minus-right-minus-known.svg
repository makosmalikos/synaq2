<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: Q; S; R; P. Шаршы тік бұрыш белгілері: ∠PVR. Доға жазулары: ∠QVS: 33°. Белгісіз өлшемдер санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="52" y2="275" stroke="#23394b" stroke-width="1.8" data-ray="P"/><text x="28" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="1.8" data-ray="Q"/><text x="452" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="240" y2="87" stroke="#23394b" stroke-width="1.8" data-ray="R"/><text x="240" y="71" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><line x1="240" y1="275" x2="397.67006677373973" y2="172.6078614171749" stroke="#23394b" stroke-width="1.8" data-ray="S"/><text x="417.7981604044299" y="167.53652457681426" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="S">S</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="QS" d="M320 275 A80 80 0 0 0 307.0936454356339 231.42887719879784" fill="none" stroke="#80b5ef" stroke-width="2.3"/><text x="338.7584326914239" y="253.74641949549596" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="QS">33°</text><path data-right="PR" d="M223 275 L223 258 L240 258" fill="none" stroke="#23394b" stroke-width="1.6"/></g></svg>