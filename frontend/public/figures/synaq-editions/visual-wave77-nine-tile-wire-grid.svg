<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Шаршы үш баған және үш қатарға бөлінген. Сыртқы шекара мен барлық ішкі сызық сым болып есептеледі. Сыртқы периметр 60 см.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="120" y1="45" x2="120" y2="285" stroke="#243a51" stroke-width="2" data-wire="v"/><line x1="120" y1="45" x2="360" y2="45" stroke="#243a51" stroke-width="2" data-wire="h"/><line x1="200" y1="45" x2="200" y2="285" stroke="#243a51" stroke-width="2" data-wire="v"/><line x1="120" y1="125" x2="360" y2="125" stroke="#243a51" stroke-width="2" data-wire="h"/><line x1="280" y1="45" x2="280" y2="285" stroke="#243a51" stroke-width="2" data-wire="v"/><line x1="120" y1="205" x2="360" y2="205" stroke="#243a51" stroke-width="2" data-wire="h"/><line x1="360" y1="45" x2="360" y2="285" stroke="#243a51" stroke-width="2" data-wire="v"/><line x1="120" y1="285" x2="360" y2="285" stroke="#243a51" stroke-width="2" data-wire="h"/><text x="240" y="335" text-anchor="middle" fill="#243a51" font-size="27" data-given="outerP">Сыртқы P = 60 см</text></g></svg>