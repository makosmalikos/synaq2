<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">O центрлі толық дөңгелек, 5 радиус. Шеңберді сағат тіліне қарсы айналғандағы әріп реті A, M, B, N, C. Бірдей доға сызықшалары тиісті секторлардың теңдігін білдіреді. Сұралған сектор немесе құрамдас бөліктер көкпен боялған. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><path data-shaded-sector="1" d="M240 172 L304.3071838991359 76.6606791561702 A115 115 0 0 0 196.92024175717012 65.37385672481945 Z" fill="#7baeea" fill-opacity=".7"/><path data-shaded-sector="2" d="M240 172 L196.92024175717012 65.37385672481945 A115 115 0 0 0 125 172 Z" fill="#7baeea" fill-opacity=".7"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="A"/><text x="379" y="180" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="A">A</text><line x1="240" y1="172" x2="304.3071838991359" y2="76.6606791561702" stroke="#233c56" stroke-width="1.8" data-radius="M"/><text x="317.7278135824338" y="64.7637774148492" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="M">M</text><line x1="240" y1="172" x2="196.92024175717012" y2="65.37385672481945" stroke="#233c56" stroke-width="1.8" data-radius="B"/><text x="187.92968351518823" y="51.12144421521654" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="B">B</text><line x1="240" y1="172" x2="125" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="N"/><text x="101" y="179.99999999999997" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="N">N</text><line x1="240" y1="172" x2="196.9202417571701" y2="278.62614327518054" stroke="#233c56" stroke-width