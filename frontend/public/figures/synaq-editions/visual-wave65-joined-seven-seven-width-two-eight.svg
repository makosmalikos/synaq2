<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай және ондық бөлшектері бар суретті есеп</title><desc id="desc">Бірдей биіктікті көк және сары екі тіктөртбұрыш. Көк ен 2,8, сары ен 1 бүтін 2/5, көктің ішіндегі S = 7,7 см².</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="32" text-anchor="middle" fill="#203549" font-size="23">Қабырғалар — см, S — см²</text><rect x="110" y="85" width="200" height="196.42857142857144" fill="#a8d3fa" stroke="#203549" stroke-width="1.8" data-joined-part="blue"/><rect x="310" y="85" width="100" height="196.42857142857144" fill="#fff0b8" stroke="#203549" stroke-width="1.8" data-joined-part="yellow"/><text x="210" y="192.21428571428572" text-anchor="middle" fill="#203549" font-size="27">S = 7,7</text><text x="210" y="330.42857142857144" text-anchor="middle" fill="#203549" font-size="27">2,8</text><text x="336" y="328.42857142857144" text-anchor="middle" fill="#203549" font-size="27">1</text><text x="362" y="312.42857142857144" text-anchor="middle" fill="#203549" font-size="24">2</text><line x1="348" y1="320.42857142857144" x2="376" y2="320.42857142857144" stroke="#203549" stroke-width="2" /><text x="362" y="345.42857142857144" text-anchor="middle" fill="#203549" font-size="24">5</text></g></svg>