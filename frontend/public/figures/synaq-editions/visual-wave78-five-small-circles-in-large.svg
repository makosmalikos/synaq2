<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">O центрлі үлкен шеңбердің көлденең диаметрі бойында бес бірдей кіші шеңбер орналасқан. Көршілері жанасады, екі шеткісі үлкен шеңберге іштен тиеді. O-дан сыртқы шекараға дейінгі радиуста 25 см жазылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="outer" cx="240" cy="160" r="114.99999999999999" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="inner0" cx="148" cy="160" r="23" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="inner1" cx="194" cy="160" r="23" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="inner2" cx="240" cy="160" r="23" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="inner3" cx="286" cy="160" r="23" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="inner4" cx="332" cy="160" r="23" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="240" y1="160" x2="240" y2="45.000000000000014" stroke="#213a53" stroke-width="2" data-radius="outer"/><text x="200" y="110.5" text-anchor="middle" fill="#213a53" font-size="27" data-given="outerRadius">25 см</text><circle data-point="O" cx="240" cy="160" r="3.8" fill="#213a53"/><text x="225" y="184" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text></g></svg>