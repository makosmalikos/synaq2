<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ бөлгіш</title><desc id="desc">Тіктөртбұрыштың төменгі қабырғасы 324 м, сол қабырғасы 216 м. Тек төрт міндетті бұрыш бағанасы қызыл нүктемен берілген; кейін қойылатын бағаналар көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="112" y="62" width="310" height="206.66666666666666" fill="#c5e6d4" stroke="#203549" stroke-width="1.8"/><text x="267" y="310.66666666666663" text-anchor="middle" fill="#203549" font-size="28" >324 м</text><text x="65" y="165.33333333333331" text-anchor="middle" fill="#203549" font-size="28" transform="rotate(-90 65 165.33333333333331)">216 м</text><circle data-mandatory-corner="true" cx="112" cy="62" r="7" fill="#cc7b88" stroke="#985a66" stroke-width="1"/><circle data-mandatory-corner="true" cx="422" cy="62" r="7" fill="#cc7b88" stroke="#985a66" stroke-width="1"/><circle data-mandatory-corner="true" cx="112" cy="268.66666666666663" r="7" fill="#cc7b88" stroke="#985a66" stroke-width="1"/><circle data-mandatory-corner="true" cx="422" cy="268.66666666666663" r="7" fill="#cc7b88" stroke="#985a66" stroke-width="1"/></g></svg>