<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Екі түрлі түсті тікбұрышты үшбұрышты сызғыш VQ қабырғасының екі жағында жанасады. V төбесіндегі сары бөлік 45°, көк бөлік 60°. P — төменгі қабырғада, Q — ортақ қабырғаның ұшында, R — жоғарғы қабырғада.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-ruler="first" points="160,290 336.7766952966369,290 336.7766952966369,113.22330470336314" fill="#f4d66c" fill-opacity=".75" stroke="#23394b" stroke-width="2"/><polygon data-ruler="second" points="160,290 336.7766952966369,113.22330470336314 127.64761936218488,169.25927171386644" fill="#8ec7db" fill-opacity=".75" stroke="#23394b" stroke-width="2"/><path data-right="first" d="M323.7766952966369 290 L323.7766952966369 277 L336.7766952966369 277" fill="none" stroke="#23394b" stroke-width="1.6"/><path data-right="second" d="M131.01226694851766 181.81630745562433 L143.56930269027555 178.45165986929155 L140.20465510394277 165.89462412753366" fill="none" stroke="#23394b" stroke-width="1.6"/><text x="143" y="319" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="V">V</text><text x="354.7766952966369" y="304" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="P">P</text><text x="351.7766952966369" y="99.22330470336314" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="Q">Q</text><text x="110.64761936218488" y="157.25927171386644" text-anchor="middle" fill="#23394b" font-size="29" data-ruler-point="R">R</text><path data-arc="PQ" d="M230 290 A70 70 0 0 0 209.49747468305833 240.50252531694167" fill="none" stroke="#80b5ef" stroke-width="2.3"/><text x="245.92079652354965" y="262.41044079004666" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="PQ">45°</text><pa