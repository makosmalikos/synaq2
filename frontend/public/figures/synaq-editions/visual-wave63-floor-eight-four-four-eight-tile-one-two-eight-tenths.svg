<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлгішпен суретті есеп</title><desc id="desc">Еден 8,4×4,8 м. Жоғарғы сол жақ бір тақта 1,2×0,8 м, ұзын жағы еденнің 8,4 м жағына параллель.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="32" text-anchor="middle" fill="#203549" font-size="24">Өлшемдер — м</text><rect x="92" y="96" width="315" height="180" fill="#fff" stroke="#203549" stroke-width="1.6" data-floor="true"/><rect x="92" y="96" width="45" height="30" fill="#8fc2f0" stroke="#203549" stroke-width="1.6" data-tile="true"/><text x="114.5" y="80" text-anchor="middle" fill="#203549" font-size="25">1,2</text><text x="171" y="118" text-anchor="middle" fill="#203549" font-size="24">0,8</text><line x1="92" y1="295" x2="407" y2="295" stroke="#203549" stroke-width="2" /><line x1="92" y1="290" x2="92" y2="300" stroke="#203549" stroke-width="2" /><line x1="407" y1="290" x2="407" y2="300" stroke="#203549" stroke-width="2" /><text x="249.5" y="326" text-anchor="middle" fill="#203549" font-size="26">8,4</text><text x="48" y="194" text-anchor="middle" fill="#203549" font-size="25">4,8</text></g></svg>