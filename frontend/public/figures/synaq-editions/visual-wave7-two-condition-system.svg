<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-labelledby="title desc"><title id="title">Рет пен аралықтар зертханасы</title><desc id="desc">Сызбадағы боялған жиынды бір мезгілде орындалатын екі шартпен сипаттаңыз. Дұрыс жүйені таңдаңыз. Қатар 1: сол жақ -2 шекарасы толтырылған, оң жақ 4 шекарасы бос. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a7"/></marker></defs><rect width="480" height="215" fill="white"/><line x1="34" y1="100" x2="448" y2="100" stroke="#708aa9" stroke-width="1.6" marker-end="url(#tip)"/><line x1="48" y1="96" x2="48" y2="104" stroke="#849bb6"/><line x1="80" y1="96" x2="80" y2="104" stroke="#849bb6"/><line x1="112" y1="96" x2="112" y2="104" stroke="#849bb6"/><line x1="144" y1="96" x2="144" y2="104" stroke="#849bb6"/><line x1="176" y1="96" x2="176" y2="104" stroke="#849bb6"/><line x1="208" y1="96" x2="208" y2="104" stroke="#849bb6"/><line x1="240" y1="96" x2="240" y2="104" stroke="#849bb6"/><line x1="272" y1="96" x2="272" y2="104" stroke="#849bb6"/><line x1="304" y1="96" x2="304" y2="104" stroke="#849bb6"/><line x1="336" y1="96" x2="336" y2="104" stroke="#849bb6"/><line x1="368" y1="96" x2="368" y2="104" stroke="#849bb6"/><line x1="400" y1="96" x2="400" y2="104" stroke="#849bb6"/><line x1="432" y1="96" x2="432" y2="104" stroke="#849bb6"/><text x="144" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">-2</text><text x="336" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">4</text><line x1="144" y1="100" x2="336" y2="100" stroke="#697bd3" stroke-width="6" data-interval="0" data-lo="-2" dat