<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Көк көпбұрыштың тұйық шекарасы көрсетілген. Белгілі ұзындықтар: төменгі толық қабырға: 12 см; сол толық қабырға: 9 см.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="90,282.5 390,282.5 390,182.5 315,182.5 315,132.5 190,132.5 190,57.5 90,57.5" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><text x="238.79114683817645" y="313.46821007464774" text-anchor="middle" fill="#243a51" font-size="27" data-given="0">12 см</text><text x="67.01837794939884" y="178.91926488202404" text-anchor="middle" fill="#243a51" font-size="27" data-given="7">9 см</text></g></svg>