<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Бөлек бұрыш сызбалары. 1-сызбаның жазуы «31°»; 2-сызбаның жазуы «90°», шаршы тік бұрыш белгісі бар; 3-сызбаның жазуы «108°»; 4-сызбаның жазуы «132°»; 5-сызбаның жазуы «67°». Өлшемі жазылмаған бұрыштарға сан қосылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g data-panel="0"><line x1="95" y1="80" x2="160" y2="80" stroke="#23394b" stroke-width="1.8" data-panel-ray="base"/><line x1="95" y1="80" x2="150.7158745456373" y2="46.52252513084648" stroke="#23394b" stroke-width="1.8" data-panel-ray="other"/><text x="119" y="115" text-anchor="middle" fill="#23394b" font-size="26" data-panel-label="0">31°</text><path data-arc="panel0" d="M118 80 A23 23 0 0 0 114.71484791614859 68.15412427706876" fill="none" stroke="#80b5ef" stroke-width="2.3"/></g><g data-panel="1"><line x1="325" y1="80" x2="390" y2="80" stroke="#23394b" stroke-width="1.8" data-panel-ray="base"/><line x1="325" y1="80" x2="325" y2="15" stroke="#23394b" stroke-width="1.8" data-panel-ray="other"/><text x="349" y="115" text-anchor="middle" fill="#23394b" font-size="26" data-panel-label="1">90°</text><path data-arc="panel1" d="M348 80 A23 23 0 0 0 325 57" fill="none" stroke="#80b5ef" stroke-width="2.3"/><path data-right="panel1" d="M336 80 L336 69 L325 69" fill="none" stroke="#23394b" stroke-width="1.6"/></g><g data-panel="2"><line x1="95" y1="190" x2="160" y2="190" stroke="#23394b" stroke-width="1.8" data-panel-ray="base"/><line x1="95" y1="190" x2="74.91389536562842" y2="128.181326440815" stroke="#23394b" stroke-width="1.8" data-panel-ray="other"/><text x="119" y="225" text-anchor="middle" fill="#23394b" font-size="26" data-panel-label="2">108°</text><path data-arc="panel2" d="M118 190 A23 23 0 0 0 87.89260912937621 16