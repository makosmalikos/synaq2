<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық көбейтуге суретті тапсырма</title><desc id="desc">Тіктөртбұрыштың ұзын қабырғасы 3,6 дм, қысқа қабырғасы 2,15 дм.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="24">Ұзындықтар — дм</text><rect x="87" y="85" width="306" height="182.75" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-rectangle="true"/><text x="240" y="305.75" text-anchor="middle" fill="#203549" font-size="28">3,6</text><text x="43" y="184.375" text-anchor="middle" fill="#203549" font-size="26">2,15</text></g></svg>