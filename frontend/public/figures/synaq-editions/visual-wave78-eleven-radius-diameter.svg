<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">O центрінен шеңбер бойындағы A нүктесіне OA кесіндісі салынған. Оның жазуы 11 см. Толық диаметр салынбаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="main" cx="240" cy="160" r="112.5" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="240" y1="160" x2="328.65120978075623" y2="90.73808402586346" stroke="#213a53" stroke-width="2" data-segment="OA"/><text x="273.2436983345163" y="119.18484844801074" text-anchor="middle" fill="#213a53" font-size="27" data-given="radius">11 см</text><circle data-point="O" cx="240" cy="160" r="3.8" fill="#213a53"/><text x="224" y="182" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text><circle data-point="A" cx="328.65120978075623" cy="90.73808402586346" r="3.8" fill="#213a53"/><text x="344.41142485289066" y="85.42485451935029" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text></g></svg>