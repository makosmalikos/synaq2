<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">Ұзын қабырғасы бойында екі бірдей шеңбері бар тіктөртбұрыш. Шеңберлер бір-біріне, жоғарғы/төменгі қабырғаларға, екі шеткі қабырғаға тиеді. Тіктөртбұрыш периметрі 84 см.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-frame="rectangle" points="80,245 400,245 400,85 80,85" fill="none" stroke="#213a53" stroke-width="2.5"/><circle data-circle="inside0" cx="160" cy="165" r="80" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="inside1" cx="320" cy="165" r="80" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><text x="240" y="335" text-anchor="middle" fill="#213a53" font-size="27" data-given="rectangleP">Pтіктөртбұрыш = 84 см</text></g></svg>