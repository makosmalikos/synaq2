<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Теңдеулер жүйесі</title><desc id="desc">Қосу белгісімен бірінің астына бірі жазылған теңдеулер: 4x + 3y = 22; 5x - 3y = 14. Қосу сызығының астында сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="48" y="125" font-size="36" fill="#8459ce" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">+</text><text x="94" y="123" font-size="32" fill="#203549" data-added-equation="4x + 3y = 22">4x + 3y = 22</text><text x="94" y="191" font-size="32" fill="#203549" data-added-equation="5x - 3y = 14">5x - 3y = 14</text><line x1="70" y1="217" x2="411" y2="217" stroke="#203549" stroke-width="2.5" /><rect x="190" y="241" width="100" height="53" rx="8" fill="#f3edff" stroke="#8459ce" stroke-width="2" stroke-dasharray="6 4"/><text x="240" y="277" font-size="32" fill="#8459ce" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">?</text></g></svg>