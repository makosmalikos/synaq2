<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Аралас сандар</title><desc id="desc">O-дан бастап 2 толық 1 км бөлік көк. Келесі 1 км 8 тең ұяшыққа бөлінген, алғашқы 7 ұяшығы көк, соңғысы ақ үзік жиекті. S көк жолдың дәл соңында.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-route-whole="0" x="42" y="148" width="132" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.7"/><text x="108" y="184" text-anchor="middle" fill="#203549" font-size="25" >1 км</text><rect data-route-whole="1" x="174" y="148" width="132" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.7"/><text x="240" y="184" text-anchor="middle" fill="#203549" font-size="25" >1 км</text><rect data-route-part="0" data-blue="true" x="306" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="1" data-blue="true" x="322.5" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="2" data-blue="true" x="339" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="3" data-blue="true" x="355.5" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="4" data-blue="true" x="372" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="5" data-blue="true" x="388.5" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="6" data-blue="true" x="405" y="148" width="16.5" height="58" fill="#a6caed" stroke="#203549" stroke-width="1.5" /><rect data-route-part="7" data-blue="false" x="421.5" y="148" width="16.5" height="58" fill="#fff" stroke="#203549" stroke-width="1.5" stroke-dasharray="4 4"/><li