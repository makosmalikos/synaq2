<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">M, N жиындарының диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек M = 13; тек M және N = 5; тек N = 9.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="170" cy="190" r="122" fill="#80b6ec" fill-opacity=".24"/><circle cx="310" cy="190" r="122" fill="#ebc561" fill-opacity=".24"/><circle data-set="M" cx="170" cy="190" r="122" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="N" cx="310" cy="190" r="122" fill="none" stroke="#203549" stroke-width="2"/><text x="110" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="A" data-count="13">13</text><text x="240" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="5">5</text><text x="370" y="190" text-anchor="middle" fill="#203549" font-size="30" data-region="B" data-count="9">9</text><text x="80" y="70" text-anchor="middle" fill="#203549" font-size="29" >M</text><text x="400" y="70" text-anchor="middle" fill="#203549" font-size="29" >N</text></g></svg>