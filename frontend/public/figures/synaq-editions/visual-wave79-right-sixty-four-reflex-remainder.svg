<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">O центрлі толық дөңгелек, 3 радиус. Сектор ішіндегі жазулар ретімен: өлшем жазылмаған; 64°; ?. Шаршы тік бұрыш белгісі бар. Сұралған сектор немесе құрамдас бөліктер көкпен боялған. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><path data-shaded-sector="2" d="M240 172 L136.6386846755958 121.58731811925611 A115 115 0 1 0 355 172.00000000000003 Z" fill="#7baeea" fill-opacity=".7"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="0"/><line x1="240" y1="172" x2="240" y2="57" stroke="#233c56" stroke-width="1.8" data-radius="1"/><line x1="240" y1="172" x2="136.6386846755958" y2="121.58731811925611" stroke="#233c56" stroke-width="1.8" data-radius="2"/><path data-right="0" d="M255 172 L255 157 L240 157" fill="none" stroke="#233c56" stroke-width="1.7"/><text x="203.96549003214207" y="122.33272946136303" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="1">64°</text><text x="224.70332830461717" y="246.257164405396" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="2">?</text><circle cx="240" cy="172" r="3.6" fill="#233c56"/><text x="234.60117469574723" y="203.38488155484563" text-anchor="middle" fill="#233c56" font-size="26" data-center="true">O</text></g></svg>