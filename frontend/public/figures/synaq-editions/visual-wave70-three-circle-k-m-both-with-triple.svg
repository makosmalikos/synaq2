<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиындардың бірігуі мен қиылысуы</title><desc id="desc">K/L/M үш шеңбері, орындары: A аймағында 4; 9. B аймағында 15. C аймағында 33. AB аймағында 12. AC аймағында 18. BC аймағында 27. ABC аймағында 24. A/B/C орындары тиісінше K, L, M.</desc><defs></defs><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Бірігу және қиылысу</text><circle data-set="K" cx="180" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="L" cx="300" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="M" cx="240" cy="240" r="110" fill="none" stroke="#203549" stroke-width="2" /><text x="65" y="70" text-anchor="middle" fill="#203549" font-size="28">K</text><text x="415" y="70" text-anchor="middle" fill="#203549" font-size="28">L</text><text x="365" y="330" text-anchor="middle" fill="#203549" font-size="28">M</text><g data-entry="0"><circle cx="103" cy="125" r="2.8" fill="#203549"/><text x="125" y="134" text-anchor="middle" fill="#203549" font-size="26">4</text></g><g data-entry="1"><circle cx="103" cy="175" r="2.8" fill="#203549"/><text x="125" y="184" text-anchor="middle" fill="#203549" font-size="26">9</text></g><g data-entry="2"><circle cx="333" cy="145" r="2.8" fill="#203549"/><text x="355" y="154" text-anchor="middle" fill="#203549" font-size="26">15</text></g><g data-entry="3"><circle cx="218" cy="302" r="2.8" fill="#203549"/><text x="240" y="311" text-anchor="middle" fill="#203549" font-size="26">33</text></g><g data-entry="4"><circle cx="218" cy="88" r="2.8" fill="#203549"/><text x="240" y="97" text-anchor="middle" fill="#203549" font-size="26">12</text></g><g data-entry="5"><circle cx="140" cy="235" r="2.8" fill="#203549"/><text x="162" y="244" text-anchor="middle" fill="#203549" font-size="26">18</text></g><g data-entry="6"><circle cx="294" cy="235" r="2.8" fill="#203549"/><text x="316" y="244" text-anchor="middle" fill="#203549" font-size="26">27</text></g><g data-entry="7"><circle cx="218" cy="178" r="2.8" fill="#203549"/><text x="240" y="187" text-anchor="middle" fill="#203549" font-size="26">24</text></g></g></svg>