<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі бөлшектерді көбейту</title><desc id="desc">Үш жағы көрінетін куб, алдыңғы төменгі қыры (5/6) дм. Көрінбейтін үш қыр үзік сызықпен белгіленген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="22">Қыры — дециметрмен</text><polygon data-face="ABFE" points="125,110 285,110 355,55 195,55" fill="#dbeaf9"/><polygon data-face="BCGF" points="285,110 285,270 355,215 355,55" fill="#b9afe3"/><polygon data-face="ABCD" points="125,110 285,110 285,270 125,270" fill="#9ec8ed"/><line x1="195" y1="215" x2="195" y2="55" stroke="#203549" stroke-width="2" stroke-dasharray="6 5" data-hidden-edge="HE"/><line x1="195" y1="215" x2="125" y2="270" stroke="#203549" stroke-width="2" stroke-dasharray="6 5" data-hidden-edge="HD"/><line x1="195" y1="215" x2="355" y2="215" stroke="#203549" stroke-width="2" stroke-dasharray="6 5" data-hidden-edge="HG"/><line x1="125" y1="110" x2="285" y2="110" stroke="#203549" stroke-width="2" data-edge="AB"/><line x1="285" y1="110" x2="285" y2="270" stroke="#203549" stroke-width="2" data-edge="BC"/><line x1="285" y1="270" x2="125" y2="270" stroke="#203549" stroke-width="2" data-edge="CD"/><line x1="125" y1="270" x2="125" y2="110" stroke="#203549" stroke-width="2" data-edge="DA"/><line x1="125" y1="110" x2="195" y2="55" stroke="#203549" stroke-width="2" data-edge="AE"/><line x1="195" y1="55" x2="355" y2="55" stroke="#203549" stroke-width="2" data-edge="EF"/><line x1="355" y1="55" x2="285" y2="110" stroke="#203549" stroke-width="2" data-edge="FB"/><line x1="355" y1="55" x2="355" y2="215" stroke="#203549" stroke-width="2" data-edge="FG"/><line x1="355" y1="215" x2="285" y2="270" stroke="#203549" stroke-width="2" data-edge="GC"/><line x1="125" y1="289" x2="285" y2="289" stroke="#203549" stroke-width="2" data-bracket="cube-edge"/><line x1="125" y1="289" x2="133" y2="284" stroke="#203549" stroke-width="2" /><line x1="125" y1="289" x2="133" y2="294" stroke="#203549" stroke-width="2" /><line x1="285" y1="289" x2="277" y2="284" stroke="#203549" stroke-width="2" /><line x1="285" y1="289" x2="277" y2="294" stroke="#203549" stroke-width="2" /><g data-fraction="5/6"><text x="204" y="316" text-anchor="middle" fill="#203549" font-size="23">5</text><line x1="187" y1="323" x2="221" y2="323" stroke="#203549" stroke-width="2" /><text x="204" y="348" text-anchor="middle" fill="#203549" font-size="23">6</text></g><text x="250" y="327" text-anchor="middle" fill="#203549" font-size="22">дм</text></g></svg>