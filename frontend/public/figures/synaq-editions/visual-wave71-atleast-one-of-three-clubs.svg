<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Диаграммадағы элементтер саны</title><desc id="desc">D, S, R жиындарының диаграммасы. Әр аймақтағы сан сол бөліктің элементтер САНЫ. Аймақтар: тек D = 9; тек S = 6; тек R = 7; тек D және S = 4; тек D және R = 2; тек S және R = 3; үшеуіне де ортақ = 3.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="150" r="110" fill="#80b6ec" fill-opacity=".24"/><circle cx="300" cy="150" r="110" fill="#ebc561" fill-opacity=".24"/><circle cx="240" cy="240" r="110" fill="#74c9a4" fill-opacity=".24"/><circle data-set="D" cx="180" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="S" cx="300" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2"/><circle data-set="R" cx="240" cy="240" r="110" fill="none" stroke="#203549" stroke-width="2"/><text x="125" y="150" text-anchor="middle" fill="#203549" font-size="30" data-region="A" data-count="9">9</text><text x="355" y="145" text-anchor="middle" fill="#203549" font-size="30" data-region="B" data-count="6">6</text><text x="240" y="302" text-anchor="middle" fill="#203549" font-size="30" data-region="C" data-count="7">7</text><text x="240" y="88" text-anchor="middle" fill="#203549" font-size="30" data-region="AB" data-count="4">4</text><text x="162" y="235" text-anchor="middle" fill="#203549" font-size="30" data-region="AC" data-count="2">2</text><text x="316" y="235" text-anchor="middle" fill="#203549" font-size="30" data-region="BC" data-count="3">3</text><text x="240" y="178" text-anchor="middle" fill="#203549" font-size="30" data-region="ABC" data-count="3">3</text><text x="65" y="70" text-anchor="middle" fill="#203549" font-size="28" >D</text><text x="415" y="70" text-anchor="middle" fill="#203549" font-size="28" >S</text><text x="365" y="330" text-anchor="middle" fill="#203549" font-size="28" >R</text></g></svg>