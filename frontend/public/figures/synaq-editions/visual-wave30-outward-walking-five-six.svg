<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Арифметикалық амалдардың қасиеттері</title><desc id="desc">Ортақ O нүктесінен солға 5 км/сағ, оңға 6 км/сағ бағытталған екі нұсқар.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="62" y1="230" x2="418" y2="230" stroke="#203549" stroke-width="2.3" /><circle cx="240" cy="230" r="5" fill="#203549"/><text x="240" y="267" font-size="24" fill="#203549" text-anchor="middle">O</text><line x1="220" y1="183" x2="91" y2="183" stroke="#315ce8" stroke-width="3" data-direction="left" data-speed="5"/><polygon points="84,183 95,177 95,189" fill="#315ce8"/><line x1="260" y1="183" x2="389" y2="183" stroke="#8459ce" stroke-width="3" data-direction="right" data-speed="6"/><polygon points="396,183 385,177 385,189" fill="#8459ce"/><text x="151" y="157" font-size="23" fill="#315ce8" text-anchor="middle">5 км/сағ</text><text x="329" y="157" font-size="23" fill="#8459ce" text-anchor="middle">6 км/сағ</text></g></svg>