<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі аралас сандар</title><desc id="desc">Сағатпен берілген екі уақыт жолағы: көк бару (5 + (1/5)), күлгін қайту (4 + (3/4)). Екеуі бірдей сол жақтан басталып, ұзындықтары уақыттарына пропорционал.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="22">Жолға кеткен уақыт — сағатпен</text><rect data-trip="0" x="42" y="103" width="396" height="70" fill="#9ec8ed" stroke="#203549" stroke-width="2"/><g data-mixed="5,1,5"><text x="218" y="143" text-anchor="middle" fill="#203549" font-size="27">5</text><text x="252" y="126" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="236" y1="135" x2="268" y2="135" stroke="#203549" stroke-width="2" /><text x="252" y="161" text-anchor="middle" fill="#203549" font-size="22">5</text></g><rect data-trip="1" x="42" y="232" width="361.7307692307692" height="70" fill="#c1a1de" stroke="#203549" stroke-width="2"/><g data-mixed="4,3,4"><text x="200.8653846153846" y="272" text-anchor="middle" fill="#203549" font-size="27">4</text><text x="234.8653846153846" y="255" text-anchor="middle" fill="#203549" font-size="22">3</text><line x1="218.8653846153846" y1="264" x2="250.8653846153846" y2="264" stroke="#203549" stroke-width="2" /><text x="234.8653846153846" y="290" text-anchor="middle" fill="#203549" font-size="22">4</text></g></g></svg>