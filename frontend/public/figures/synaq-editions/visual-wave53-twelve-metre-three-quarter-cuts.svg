<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сурет бойынша бөлшектерді бөлу</title><desc id="desc">Толық таспа 12 м. Сол жақтағы бір көк кесіндінің ұзындығы (3/4) м, қалған таспа ақ. Қалған бөлікте жеке кесу сызықтары салынбаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="22">Бірдей кесінділерге бөлу</text><line x1="42" y1="116" x2="438" y2="116" stroke="#203549" stroke-width="2" data-bracket="whole-wire"/><line x1="42" y1="116" x2="48" y2="112" stroke="#203549" stroke-width="2" /><line x1="42" y1="116" x2="48" y2="120" stroke="#203549" stroke-width="2" /><line x1="438" y1="116" x2="432" y2="112" stroke="#203549" stroke-width="2" /><line x1="438" y1="116" x2="432" y2="120" stroke="#203549" stroke-width="2" /><text x="240" y="94" text-anchor="middle" fill="#203549" font-size="26">12 м</text><rect data-wire="whole" x="42" y="167" width="396" height="64" fill="#fff" stroke="#203549" stroke-width="2"/><rect data-wire="piece" x="42" y="167" width="24.75" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="2"/><line x1="42" y1="260" x2="66.75" y2="260" stroke="#203549" stroke-width="2" data-bracket="one-piece"/><line x1="42" y1="260" x2="48" y2="256" stroke="#203549" stroke-width="2" /><line x1="42" y1="260" x2="48" y2="264" stroke="#203549" stroke-width="2" /><line x1="66.75" y1="260" x2="60.75" y2="256" stroke="#203549" stroke-width="2" /><line x1="66.75" y1="260" x2="60.75" y2="264" stroke="#203549" stroke-width="2" /><g data-fraction="3/4"><text x="54.375" y="292" text-anchor="middle" fill="#203549" font-size="23">3</text><line x1="37.375" y1="299" x2="71.375" y2="299" stroke="#203549" stroke-width="2" /><text x="54.375" y="324" text-anchor="middle" fill="#203549" font-size="23">4</text></g><text x="104" y="312" text-anchor="middle" fill="#203549" font-size="22">м</text></g></svg>