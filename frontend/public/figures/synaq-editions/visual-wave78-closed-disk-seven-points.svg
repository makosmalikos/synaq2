<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">O центрлі көк дөңгелек және P,Q,R,S,T,U,V,W,X,Y әріптері бар нүктелер. Шеңбер шекарасы тұтас сызықпен көрінеді; нүктелердің қайсысы ішінде/бойында/сыртында екені сызбада көрсетілген, санақ жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="main" cx="240" cy="140.71428571428572" r="96.42857142857142" fill="#abcdf4" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-point="P" cx="259.2857142857143" cy="121.42857142857143" r="3.8" fill="#213a53"/><text x="271.2857142857143" y="112.42857142857143" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="P">P</text><circle data-point="Q" cx="201.42857142857144" cy="121.42857142857143" r="3.8" fill="#213a53"/><text x="213.42857142857144" y="112.42857142857143" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="Q">Q</text><circle data-point="R" cx="240" cy="179.28571428571428" r="3.8" fill="#213a53"/><text x="252" y="170.28571428571428" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="R">R</text><circle data-point="S" cx="297.85714285714283" cy="160" r="3.8" fill="#213a53"/><text x="309.85714285714283" y="151" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="S">S</text><circle data-point="T" cx="336.42857142857144" cy="140.71428571428572" r="3.8" fill="#213a53"/><text x="348.42857142857144" y="131.71428571428572" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="T">T</text><circle data-point="U" cx="240" cy="44.28571428571429" r="3.8" fill="#213a53"/><text x="252" y="35.28571428571429" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="U">U</text><circle data-point="V" cx="182.14285714285714" cy="217.85