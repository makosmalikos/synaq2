<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Өзендегі қозғалыс</title><desc id="desc">Жасыл кеме солда, күлгін қайық оңда; олардың бастапқы аралығы 78 км. Екеуінің де нұсқары оңға, меншікті жылдамдықтары 29 және 16 км/сағ. Ағыс оңға 3 км/сағ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="28" y="126" width="424" height="176" rx="12" fill="#e3f2fc"/><line x1="28" y1="126" x2="452" y2="126" stroke="#91b6ce" stroke-width="1.7" /><line x1="28" y1="302" x2="452" y2="302" stroke="#91b6ce" stroke-width="1.7" /><line x1="120" y1="66" x2="360" y2="66" stroke="#203549" stroke-width="1.7" /><line x1="120" y1="61" x2="120" y2="71" stroke="#203549" stroke-width="1.7" /><line x1="360" y1="61" x2="360" y2="71" stroke="#203549" stroke-width="1.7" /><text x="240" y="43" text-anchor="middle" fill="#203549" font-size="28" data-distance="78">78 км</text><line x1="187" y1="278" x2="291" y2="278" stroke="#5e9dba" stroke-width="2.3" data-current-direction="1"/><line x1="291" y1="278" x2="283" y2="273" stroke="#5e9dba" stroke-width="2.3" /><line x1="291" y1="278" x2="283" y2="283" stroke="#5e9dba" stroke-width="2.3" /><text x="240" y="342" text-anchor="middle" fill="#203549" font-size="24" >Ағыс: 3 км/сағ</text><text x="120" y="168" text-anchor="middle" fill="#203549" font-size="24" >29 км/сағ</text><line x1="89" y1="187" x2="151" y2="187" stroke="#203549" stroke-width="2.3" data-own-speed="29" data-direction="1"/><line x1="151" y1="187" x2="143" y2="182" stroke="#203549" stroke-width="2.3" /><line x1="151" y1="187" x2="143" y2="192" stroke="#203549" stroke-width="2.3" /><g data-boat="0" data-direction="1" transform="translate(120 233) scale(1 1)"><path d="M -36 0 H 45 L 28 19 H -24 Z" fill="#95c6aa" stroke="#203549" stroke-width="1.7"/><rect x="-18" y="-22" width="34" height="22" rx="3" fill