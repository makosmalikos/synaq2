<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ еселік</title><desc id="desc">Бір блоктың көлденең қыры 12 см, тереңдігі 10 см, биіктігі 15 см. Біртұтас текше құрастыру көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon points="116,50 316,50 384,22 184,22" fill="#d9dbed" stroke="#203549" stroke-width="1.8"/><polygon points="316,300 384,272 384,22 316,50" fill="#a5accf" stroke="#203549" stroke-width="1.8"/><polygon points="116,300 316,300 316,50 116,50" fill="#c0c7e4" stroke="#203549" stroke-width="1.8"/><text x="216" y="341" text-anchor="middle" fill="#203549" font-size="27" >12 см</text><text x="72" y="182" text-anchor="middle" fill="#203549" font-size="27" transform="rotate(-90 72 182)">15 см</text><text x="368" y="320" text-anchor="middle" fill="#203549" font-size="25" >10 см</text></g></svg>