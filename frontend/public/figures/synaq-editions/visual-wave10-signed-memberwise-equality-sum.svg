<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Алгебралық сызба</title><desc id="desc">Берілген тура теңдіктер -11 + 4 = -7; 5 × 3 = 15. Төменде сол жақтары қосылған, оң жақта сұрақ белгісі тұр.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="255" y="113" font-size="27" fill="#203549" text-anchor="middle">-11 + 4 = -7</text><text x="255" y="171" font-size="27" fill="#203549" text-anchor="middle">5 × 3 = 15</text><text x="43" y="160" font-size="36" fill="#8459ce" >+</text><line x1="65" y1="196" x2="435" y2="196" stroke="#203549" stroke-width="2" /><text x="240" y="247" font-size="24" fill="#203549" text-anchor="middle">(-11 + 4) + (5 × 3) = ?</text></g></svg>