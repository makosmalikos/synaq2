<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Екі ондық санға суретті есеп</title><desc id="desc">Төрт бөлік. Сол баған ені 2,8, оң баған 1,4 м. Жоғарғы жол биіктігі 1,5, төменгі 2,25 м. Төменгі сол және жоғарғы оң бөліктер көк; басқа екеуі ақ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="110" y="65" width="173.6" height="93" fill="#fff" stroke="#203549" stroke-width="1.6" data-field="upper-left"/><rect x="283.6" y="65" width="86.8" height="93" fill="#a9d1f6" stroke="#203549" stroke-width="1.6" data-field="upper-right"/><rect x="110" y="158" width="173.6" height="139.5" fill="#a9d1f6" stroke="#203549" stroke-width="1.6" data-field="lower-left"/><rect x="283.6" y="158" width="86.8" height="139.5" fill="#fff" stroke="#203549" stroke-width="1.6" data-field="lower-right"/><text x="240" y="30" text-anchor="middle" fill="#203549" font-size="24">Өлшемдер — м</text><line x1="87" y1="65" x2="87" y2="158" stroke="#203549" stroke-width="2" /><line x1="83" y1="61" x2="91" y2="69" stroke="#203549" stroke-width="2" /><line x1="83" y1="154" x2="91" y2="162" stroke="#203549" stroke-width="2" /><text x="48" y="119.5" text-anchor="middle" fill="#203549" font-size="25">1,5</text><line x1="87" y1="158" x2="87" y2="297.5" stroke="#203549" stroke-width="2" /><line x1="83" y1="154" x2="91" y2="162" stroke="#203549" stroke-width="2" /><line x1="83" y1="293.5" x2="91" y2="301.5" stroke="#203549" stroke-width="2" /><text x="48" y="235.75" text-anchor="middle" fill="#203549" font-size="25">2,25</text><line x1="110" y1="321" x2="283.6" y2="321" stroke="#203549" stroke-width="2" /><line x1="106" y1="317" x2="114" y2="325" stroke="#203549" stroke-width="2" /><line x1="279.6" y1="317" x2="287.6" y2="325" stroke="#203549" stroke-width="2" /><text x="196.8" y="349" text-anchor="middle" fill="#203549"