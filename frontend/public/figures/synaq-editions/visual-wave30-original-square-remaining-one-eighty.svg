<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Формуланы қолдану</title><desc id="desc">Белгісіз қабырғалы толық шаршының оң жағындағы сары жолақтың ені 3 см. Қалған көк тіктөртбұрыштың ауданы 180 см².</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-retained-area="180" x="139" y="97" width="168" height="210" fill="#cddcff" stroke="#203549" stroke-width="1.8"/><rect data-cut-width="3" x="307" y="97" width="42" height="210" fill="#f6d98e" stroke="#203549" stroke-width="1.8"/><text x="223" y="212" text-anchor="middle" fill="#203549" font-size="25">180 см²</text><line x1="307" y1="79" x2="349" y2="79" stroke="#203549" stroke-width="1.6" /><text x="328" y="66" text-anchor="middle" fill="#203549" font-size="24">3 см</text></g></svg>