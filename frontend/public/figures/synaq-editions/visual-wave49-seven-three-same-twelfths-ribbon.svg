<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі аралас сандар</title><desc id="desc">Бір таспа: жалпы ұзындық (7 + (5/12)) метр, қиылған көк бөлік (3 + (5/12)) метр. Қалған ақ бөлікте «?».</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="22">Барлық ұзындық — метрмен</text><line x1="42" y1="118" x2="438" y2="118" stroke="#203549" stroke-width="2" data-total-bracket="true"/><line x1="42" y1="118" x2="50" y2="113" stroke="#203549" stroke-width="2" /><line x1="42" y1="118" x2="50" y2="123" stroke="#203549" stroke-width="2" /><line x1="438" y1="118" x2="430" y2="113" stroke="#203549" stroke-width="2" /><line x1="438" y1="118" x2="430" y2="123" stroke="#203549" stroke-width="2" /><g data-mixed="7,5,12"><text x="203" y="87" text-anchor="middle" fill="#203549" font-size="27">7</text><text x="237" y="70" text-anchor="middle" fill="#203549" font-size="22">5</text><line x1="221" y1="79" x2="253" y2="79" stroke="#203549" stroke-width="2" /><text x="237" y="105" text-anchor="middle" fill="#203549" font-size="22">12</text></g><rect data-cut="0" x="42" y="177" width="182.42696629213484" height="74" fill="#9ec8ed" stroke="#203549" stroke-width="2"/><g data-mixed="3,5,12"><text x="109.2134831460674" y="218" text-anchor="middle" fill="#203549" font-size="27">3</text><text x="143.2134831460674" y="201" text-anchor="middle" fill="#203549" font-size="22">5</text><line x1="127.2134831460674" y1="210" x2="159.2134831460674" y2="210" stroke="#203549" stroke-width="2" /><text x="143.2134831460674" y="236" text-anchor="middle" fill="#203549" font-size="22">12</text></g><rect data-leftover="true" x="224.42696629213484" y="177" width="213.57303370786516" height="74" fill="#fff" stroke="#203549" stroke-width="2"/><text x="331.21348314