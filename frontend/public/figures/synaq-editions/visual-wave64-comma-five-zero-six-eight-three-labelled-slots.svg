<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық үтір мен он дәрежелерін оқу</title><desc id="desc">Бес ұяшықтағы цифрлар солдан 5, 0, 6, 8, 3. Үтірге арналған алты шекара солдан P, Q, R, S, T, U. Бастапқы үтір S тұсында.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="24">Үтірдің алты мүмкін орны</text><rect x="70" y="131" width="68" height="67" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="104" y="177" text-anchor="middle" fill="#203549" font-size="36">5</text><rect x="138" y="131" width="68" height="67" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="172" y="177" text-anchor="middle" fill="#203549" font-size="36">0</text><rect x="206" y="131" width="68" height="67" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="240" y="177" text-anchor="middle" fill="#203549" font-size="36">6</text><rect x="274" y="131" width="68" height="67" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="308" y="177" text-anchor="middle" fill="#203549" font-size="36">8</text><rect x="342" y="131" width="68" height="67" rx="5" fill="#fff" stroke="#203549" stroke-width="1.8" /><text x="376" y="177" text-anchor="middle" fill="#203549" font-size="36">3</text><line x1="70" y1="200" x2="70" y2="224" stroke="#203549" stroke-width="2" /><circle cx="70" cy="200" r="3" fill="#cd5366" data-slot="P"/><text x="70" y="261" text-anchor="middle" fill="#cd5366" font-size="29">P</text><line x1="138" y1="200" x2="138" y2="224" stroke="#203549" stroke-width="2" /><circle cx="138" cy="200" r="3" fill="#cd5366" data-slot="Q"/><text x="138" y="261" text-anchor="middle" fill="#cd5366" font-size="29">Q</text><line x1="206" y1="200" x2="206" y2="224" stroke="#203549" stroke-width="2" /><circle cx="206" cy="200" r="3" fill="#cd5366" data-slot="R"/><text x="206" y="261" text-anchor="middle" fill="#cd5366" font-size="29">R</text><line x1="274" y1="200" x2="274" y2="224" stroke="#203549" stroke-width="2" /><circle cx="274" cy="200" r="3" fill="#cd5366" data-slot="S"/><text x="274" y="261" text-anchor="middle" fill="#cd5366" font-size="29">S</text><line x1="342" y1="200" x2="342" y2="224" stroke="#203549" stroke-width="2" /><circle cx="342" cy="200" r="3" fill="#cd5366" data-slot="T"/><text x="342" y="261" text-anchor="middle" fill="#cd5366" font-size="29">T</text><line x1="410" y1="200" x2="410" y2="224" stroke="#203549" stroke-width="2" /><circle cx="410" cy="200" r="3" fill="#cd5366" data-slot="U"/><text x="410" y="261" text-anchor="middle" fill="#cd5366" font-size="29">U</text><path d="M 274 194 q 2 13 -7 20" stroke="#203549" stroke-width="6" fill="none" data-initial-comma="S"/></g></svg>