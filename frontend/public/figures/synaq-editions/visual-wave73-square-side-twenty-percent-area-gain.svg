<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Санның бөлігін пайызбен табу</title><desc id="desc">Бастапқы шаршы. Үстіңгі қабырғасына 25 см деп жазылған. Өскен шаршы не жаңа қабырға мәні суретте көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-dimension-shape="true" x="115" y="70" width="250" height="250" fill="#f2f7ff" stroke="#23394b" stroke-width="2.2"/><text x="240" y="50" text-anchor="middle" fill="#23394b" font-size="29" data-length="true">25 см</text></g></svg>