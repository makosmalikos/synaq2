<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ бөлгіш</title><desc id="desc">Жоғарғы көк таспа 84 м, төменгі күлгін таспа 132 м. Екі жолақ бірдей масштабпен салынған, кесу сызықтары әзірге жоқ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="177.72727272727275" y="72" text-anchor="middle" fill="#203549" font-size="28" >84 м</text><rect data-strip-length="84" x="60" y="91" width="235.45454545454547" height="42" fill="#a9cbf4" stroke="#203549" stroke-width="1.8"/><text x="245" y="212" text-anchor="middle" fill="#203549" font-size="28" >132 м</text><rect data-strip-length="132" x="60" y="231" width="370" height="42" fill="#c8b6e6" stroke="#203549" stroke-width="1.8"/></g></svg>