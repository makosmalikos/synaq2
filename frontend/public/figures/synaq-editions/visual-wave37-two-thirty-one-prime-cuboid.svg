<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай көбейткіштер</title><desc id="desc">Тікбұрышты параллелепипедтің төменгі қыры a, биіктігі b, тереңдігі c. Жоғарғы бөлек жазу V = 231 см³.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-box-face="top" points="78,148 327,148 415,81 166,81" fill="#f1f4fb" stroke="#203549" stroke-width="2"/><polygon data-box-face="right" points="327,294 415,227 415,81 327,148" fill="#c4d8f2" stroke="#203549" stroke-width="2"/><polygon data-box-face="front" points="78,294 327,294 327,148 78,148" fill="#b4d3f8" stroke="#203549" stroke-width="2"/><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="28" >V = 231 см³</text><text x="204" y="333" text-anchor="middle" fill="#203549" font-size="26" >a</text><text x="51" y="228" text-anchor="middle" fill="#203549" font-size="26" >b</text><text x="390" y="289" text-anchor="middle" fill="#203549" font-size="26" >c</text></g></svg>