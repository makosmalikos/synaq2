<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Формуланы қолдану</title><desc id="desc">Төменгі қабырғалары бір түзуде жатқан 12 см және 7 см шаршылар, ортақ ішкі 7 см сызық үзікпен көрсетілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-square="large" x="110" y="90" width="144" height="144" fill="#cddcff"/><rect data-square="small" x="254" y="150" width="84" height="84" fill="#f6d98e"/><polygon data-outer-boundary="true" points="110,90 254,90 254,150 338,150 338,234 110,234" fill="none" stroke="#203549" stroke-width="1.8"/><line x1="254" y1="150" x2="254" y2="234" stroke="#203549" stroke-width="1.6" stroke-dasharray="5 4" data-shared-edge="true"/><text x="68" y="170" text-anchor="middle" fill="#203549" font-size="24">12 см</text><text x="296" y="271" text-anchor="middle" fill="#203549" font-size="24">7 см</text></g></svg>