<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай көбейткіштер</title><desc id="desc">Жоғарғы ?, оның сол баласы 3, оң баласы ?. Оң аралық ? астында 5 және 11 жапырағы. Жасырын сандар жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="180" y1="57" x2="80" y2="174" stroke="#7389a4" stroke-width="2.2" data-tree-edge="0-1"/><line x1="180" y1="57" x2="290" y2="174" stroke="#7389a4" stroke-width="2.2" data-tree-edge="0-2"/><line x1="290" y1="174" x2="224" y2="292" stroke="#7389a4" stroke-width="2.2" data-tree-edge="2-3"/><line x1="290" y1="174" x2="389" y2="292" stroke="#7389a4" stroke-width="2.2" data-tree-edge="2-4"/><rect data-node="0" data-visible-value="?" x="148" y="32" width="64" height="50" rx="12" fill="#fff" stroke="#203549" stroke-width="2"/><text x="180" y="67" text-anchor="middle" fill="#203549" font-size="30" >?</text><rect data-node="1" data-visible-value="3" x="48" y="149" width="64" height="50" rx="12" fill="#c3dcfb" stroke="#203549" stroke-width="2"/><text x="80" y="184" text-anchor="middle" fill="#203549" font-size="30" >3</text><rect data-node="2" data-visible-value="?" x="258" y="149" width="64" height="50" rx="12" fill="#fff" stroke="#203549" stroke-width="2"/><text x="290" y="184" text-anchor="middle" fill="#203549" font-size="30" >?</text><rect data-node="3" data-visible-value="5" x="192" y="267" width="64" height="50" rx="12" fill="#c3dcfb" stroke="#203549" stroke-width="2"/><text x="224" y="302" text-anchor="middle" fill="#203549" font-size="30" >5</text><rect data-node="4" data-visible-value="11" x="357" y="267" width="64" height="50" rx="12" fill="#c3dcfb" stroke="#203549" stroke-width="2"/><text x="389" y="302" text-anchor="middle" fill="#203549" font-size="30" >11</text></g></svg>