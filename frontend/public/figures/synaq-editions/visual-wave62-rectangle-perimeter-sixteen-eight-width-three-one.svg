<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлуді суретпен оқу</title><desc id="desc">Тіктөртбұрыш ішінде P = 16,8 дм. Қысқа қабырға 3,1 дм, ұзын қабырға сұрақ белгісі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="87" y="87" width="300" height="175.47169811320754" fill="#b6d9f8" stroke="#203549" stroke-width="1.6" data-rectangle="true"/><text x="240" y="182.73584905660377" text-anchor="middle" fill="#203549" font-size="26">P = 16,8 дм</text><text x="240" y="301.47169811320754" text-anchor="middle" fill="#203549" font-size="29">?</text><text x="438" y="182.73584905660377" text-anchor="middle" fill="#203549" font-size="25">3,1</text></g></svg>