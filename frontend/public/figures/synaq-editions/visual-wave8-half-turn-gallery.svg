<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Координаталар және симметрия</title><desc id="desc">Төрт фигураның қайсысы бір нүкте төңірегінде 180° бұрылғанда өзімен толық беттеседі? Фигураның нөмірін таңдаңыз. Әр фигураның жергілікті торындағы (баған; қатар) төбелері, шекара бойымен: 1: (0; 0), (5; 0), (2; 4) | 2: (0; 0), (6; 0), (5; 3), (1; 3) | 3: (0; 0), (5; 0), (7; 3), (2; 3) | 4: (3; 0), (6; 2), (3; 6), (0; 2). </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a8"/></marker></defs><rect width="480" height="360" fill="white"/><line x1="57" y1="46" x2="57" y2="154" stroke="#edf1f7"/><line x1="75" y1="46" x2="75" y2="154" stroke="#edf1f7"/><line x1="93" y1="46" x2="93" y2="154" stroke="#edf1f7"/><line x1="111" y1="46" x2="111" y2="154" stroke="#edf1f7"/><line x1="129" y1="46" x2="129" y2="154" stroke="#edf1f7"/><line x1="147" y1="46" x2="147" y2="154" stroke="#edf1f7"/><line x1="165" y1="46" x2="165" y2="154" stroke="#edf1f7"/><line x1="183" y1="46" x2="183" y2="154" stroke="#edf1f7"/><line x1="57" y1="46" x2="183" y2="46" stroke="#edf1f7"/><line x1="57" y1="64" x2="183" y2="64" stroke="#edf1f7"/><line x1="57" y1="82" x2="183" y2="82" stroke="#edf1f7"/><line x1="57" y1="100" x2="183" y2="100" stroke="#edf1f7"/><line x1="57" y1="118" x2="183" y2="118" stroke="#edf1f7"/><line x1="57" y1="136" x2="183" y2="136" stroke="#edf1f7"/><line x1="57" y1="154" x2="183" y2="154" stroke="#edf1f7"/><polygon points="75,64 165,64 111,136" fill="#cedbfa" stroke="#6c83b8" stroke-width="1.8" data-polygon="1" data-vertices="0,0;5,0;2,4"/><text x="120" y="22" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="24" fill="#3f587c" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">1</text><line x1="288" y1="55" x