<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">O центрлі толық дөңгелек, 4 радиус. Сектор ішіндегі жазулар ретімен: x°; 2x°; x + 30; өлшем жазылмаған. Шаршы тік бұрыш белгісі бар. Сұралған сектор немесе құрамдас бөліктер көкпен боялған. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><path data-shaded-sector="1" d="M240 172 L297.5 72.40707856478956 A115 115 0 0 0 125 172 Z" fill="#7baeea" fill-opacity=".7"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="0"/><line x1="240" y1="172" x2="297.5" y2="72.40707856478956" stroke="#233c56" stroke-width="1.8" data-radius="1"/><line x1="240" y1="172" x2="125" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="2"/><line x1="240" y1="172" x2="239.99999999999997" y2="287" stroke="#233c56" stroke-width="1.8" data-radius="3"/><text x="298.88972745734185" y="146" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="0">x°</text><text x="206" y="121.11027254265817" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="1">2x°</text><text x="187.67409819219546" y="232.3259018078045" text-anchor="middle" fill="#233c56" font-size="25" data-angle-label="2">x + 30</text><path data-right="3" d="M240 187 L255 187 L255 172" fill="none" stroke="#233c56" stroke-width="1.7"/><circle cx="240" cy="172" r="3.6" fill="#233c56"/><text x="228" y="159.21539030917347" text-anchor="middle" fill="#233c56" font-size="26" data-center="true">O</text></g></svg>