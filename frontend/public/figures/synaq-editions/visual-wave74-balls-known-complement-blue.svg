<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Пайызы бойынша бүтінді табу</title><desc id="desc">Сары сол жақ бөлікте 40% жазылған. Қалған көк оң бөлікті қамтитын жақшаның үстінде 42 доп жазылған. Бүкіл жолақ 100%.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-color="yellow" x="30" y="165" width="165.6" height="64" fill="#ecc95c" stroke="#23394b" stroke-width="1.5"/><rect data-color="blue" x="195.6" y="165" width="248.4" height="64" fill="#81b8ed" stroke="#23394b" stroke-width="1.5"/><text x="112.8" y="207" text-anchor="middle" fill="#23394b" font-size="29" data-percent="yellow">40%</text><line x1="195.6" y1="125" x2="444" y2="125" stroke="#23394b" stroke-width="1.4" data-brace="blue"/><line x1="195.6" y1="118" x2="195.6" y2="132" stroke="#23394b" stroke-width="1.4" /><line x1="444" y1="118" x2="444" y2="132" stroke="#23394b" stroke-width="1.4" /><text x="319.8" y="111" text-anchor="middle" fill="#23394b" font-size="27" data-known="blue">42 доп</text><text x="30" y="272" text-anchor="middle" fill="#23394b" font-size="25" >0%</text><text x="444" y="272" text-anchor="middle" fill="#23394b" font-size="25" >100%</text></g></svg>