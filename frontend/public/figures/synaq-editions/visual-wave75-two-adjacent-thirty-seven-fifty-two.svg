<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: P; Q; R. Суреттегі доға жазулары: ∠PVQ: 37°; ∠QVR: 52°. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="2.1" data-ray="P"/><text x="453" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="390.1434758888911" y2="161.85877564741492" stroke="#23394b" stroke-width="2.1" data-ray="Q"/><text x="410.1093636400734" y="154.81340006861373" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="243.28105241020927" y2="87.02863331059845" stroke="#23394b" stroke-width="2.1" data-ray="R"/><text x="243.71736257114136" y="70.03244093168865" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text><path data-arc="PQ" d="M335 275 A95 95 0 0 0 315.87037345449284 217.8275728005554" fill="none" stroke="#80b5ef" stroke-width="2.5"/><text x="350.9538676591253" y="245.87535520060422" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="PQ">37°</text><path data-arc="QR" d="M315.87037345449284 217.8275728005554 A95 95 0 0 0 241.65797861154192 180.01446896014284" fill="none" stroke="#80b5ef" stroke-width="2.5"/><text x="293.116888469527" y="178.75223666996095" text-anchor="middle" fill="#23394b" font-size="26" data-angle-label="QR">52°</text></g></svg>