<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Санның бөлігін пайызбен табу</title><desc id="desc">Ақ 100% жолақ бастапқы 4800 теңгеге сәйкес. Оның оң жағына ұзындығы бастапқының 25%-ындай сары бөлік қосылған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="108" x2="350" y2="108" stroke="#23394b" stroke-width="1.3" data-brace="original"/><line x1="30" y1="101" x2="30" y2="115" stroke="#23394b" stroke-width="1.3" /><line x1="350" y1="101" x2="350" y2="115" stroke="#23394b" stroke-width="1.3" /><text x="190" y="94" text-anchor="middle" fill="#23394b" font-size="27" data-whole="original">4800 ₸</text><rect data-price-part="original" x="30" y="156" width="320" height="64" fill="#fff" stroke="#23394b" stroke-width="1.8"/><text x="190" y="197" text-anchor="middle" fill="#23394b" font-size="27" data-percent="original">100%</text><rect data-price-part="increase" x="350" y="156" width="80" height="64" fill="#ecc95c" stroke="#23394b" stroke-width="1.8"/><text x="390" y="197" text-anchor="middle" fill="#23394b" font-size="27" data-percent="increase">25%</text></g></svg>