<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кері сандар мен жұмыс үлестері</title><desc id="desc">Тіктөртбұрышты бак 6 тең көлденең жолаққа бөлінген. Төменгі 5 жолақ көк, жоғарғысы бос. Бастапқыда бак бос, сорғы сағатына толық бактың (1/12) бөлігін құяды.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="40" text-anchor="middle" fill="#203549" font-size="23">Мақсатты су деңгейі</text><rect data-band="0" data-painted="false" x="170" y="70" width="140" height="40" fill="#fff" stroke="#203549" stroke-width="1.8"/><rect data-band="1" data-painted="true" x="170" y="110" width="140" height="40" fill="#9ec8ed" stroke="#203549" stroke-width="1.8"/><rect data-band="2" data-painted="true" x="170" y="150" width="140" height="40" fill="#9ec8ed" stroke="#203549" stroke-width="1.8"/><rect data-band="3" data-painted="true" x="170" y="190" width="140" height="40" fill="#9ec8ed" stroke="#203549" stroke-width="1.8"/><rect data-band="4" data-painted="true" x="170" y="230" width="140" height="40" fill="#9ec8ed" stroke="#203549" stroke-width="1.8"/><rect data-band="5" data-painted="true" x="170" y="270" width="140" height="40" fill="#9ec8ed" stroke="#203549" stroke-width="1.8"/><line x1="158" y1="311" x2="322" y2="311" stroke="#203549" stroke-width="2" /></g></svg>