<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық көбейтуге суретті тапсырма</title><desc id="desc">a: 4 тең бөлік, бір бөлікте 0,95 дм. b: 3 тең бөлік, бір бөлікте 1,28 дм. Екеуі бір масштабта және сол жақ шеттері бірдей.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="37" y="143" text-anchor="middle" fill="#203549" font-size="30">a</text><rect x="74" y="104" width="85.5" height="63" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-strip="a" data-part="0"/><rect x="159.5" y="104" width="85.5" height="63" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-strip="a" data-part="1"/><rect x="245" y="104" width="85.5" height="63" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-strip="a" data-part="2"/><rect x="330.5" y="104" width="85.5" height="63" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-strip="a" data-part="3"/><text x="116.75" y="145" text-anchor="middle" fill="#203549" font-size="24">0,95</text><text x="37" y="271" text-anchor="middle" fill="#203549" font-size="30">b</text><rect x="74" y="232" width="115.2" height="63" fill="#fff0c2" stroke="#203549" stroke-width="1.6" data-strip="b" data-part="0"/><rect x="189.2" y="232" width="115.2" height="63" fill="#fff0c2" stroke="#203549" stroke-width="1.6" data-strip="b" data-part="1"/><rect x="304.4" y="232" width="115.2" height="63" fill="#fff0c2" stroke="#203549" stroke-width="1.6" data-strip="b" data-part="2"/><text x="131.6" y="273" text-anchor="middle" fill="#203549" font-size="24">1,28</text><text x="240" y="44" text-anchor="middle" fill="#203549" font-size="23">Бір бөліктің ұзындығы — дм</text></g></svg>