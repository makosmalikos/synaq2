<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бірлік бөлшектердің үлестері</title><desc id="desc">Бүкіл кітап бір толық жолақ. Көк 1/4 бөлігі бірінші күні, сары 1/6 бөлігі екінші күні оқылған, қалған ақ бөлікте «?». Барлығы бастапқы кітапқа қатысты.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="23">Бүкіл кітап — бір бүтін</text><rect data-share="0" x="42" y="166" width="99" height="79" fill="#9ec8ed" stroke="#203549" stroke-width="1.7"/><g data-unit="1/4"><text x="91.5" y="194" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="76.5" y1="201" x2="106.5" y2="201" stroke="#203549" stroke-width="2"/><text x="91.5" y="225" text-anchor="middle" fill="#203549" font-size="22">4</text></g><rect data-share="1" x="141" y="166" width="66" height="79" fill="#f6d16e" stroke="#203549" stroke-width="1.7"/><g data-unit="1/6"><text x="174" y="194" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="159" y1="201" x2="189" y2="201" stroke="#203549" stroke-width="2"/><text x="174" y="225" text-anchor="middle" fill="#203549" font-size="22">6</text></g><rect data-white="true" x="207" y="166" width="231" height="79" fill="#fff" stroke="#203549" stroke-width="1.7"/><text x="322.5" y="216" text-anchor="middle" fill="#203549" font-size="29">?</text></g></svg>