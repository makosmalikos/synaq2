<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Деректер мен нұсқалар</title><desc id="desc">Әр нүкте бір ойын. Гол саны мен нүкте жиіліктері: 0 — 1; 1 — 3; 2 — 4; 3 — 7; 4 — 2; 5 — 1; 6 — 0.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="40" y1="282" x2="445" y2="282" stroke="#203549" stroke-width="2" /><text x="50" y="40" font-size="19" fill="#8459ce" >● — 1 ойын</text><text x="65" y="312" font-size="21" fill="#203549" text-anchor="middle">0</text><circle cx="65" cy="260" r="7" fill="#315ce8" data-category="0" data-observation="1"/><text x="123" y="312" font-size="21" fill="#203549" text-anchor="middle">1</text><circle cx="123" cy="260" r="7" fill="#315ce8" data-category="1" data-observation="1"/><circle cx="123" cy="236" r="7" fill="#315ce8" data-category="1" data-observation="2"/><circle cx="123" cy="212" r="7" fill="#315ce8" data-category="1" data-observation="3"/><text x="181" y="312" font-size="21" fill="#203549" text-anchor="middle">2</text><circle cx="181" cy="260" r="7" fill="#315ce8" data-category="2" data-observation="1"/><circle cx="181" cy="236" r="7" fill="#315ce8" data-category="2" data-observation="2"/><circle cx="181" cy="212" r="7" fill="#315ce8" data-category="2" data-observation="3"/><circle cx="181" cy="188" r="7" fill="#315ce8" data-category="2" data-observation="4"/><text x="239" y="312" font-size="21" fill="#203549" text-anchor="middle">3</text><circle cx="239" cy="260" r="7" fill="#315ce8" data-category="3" data-observation="1"/><circle cx="239" cy="236" r="7" fill="#315ce8" data-category="3" data-observation="2"/><circle cx="239" cy="212" r="7" fill="#315ce8" data-category="3" data-observation="3"/><circle cx="239" cy="188" r="7" fill="#315ce8" data-category="3" data-observation="4"/><circle cx="239" cy="164" r="7" fill="#315ce8" data-category="3" data-observation="5"/><circle cx="239" cy="140" r="7" fill="#315ce8" data-category="3" data-observation="6"/><circle cx="239" cy="116" r="7" fill="#315ce8" data-category="3" data-observation="7"/><text x="297" y="312" font-size="21" fill="#203549" text-anchor="middle">4</text><circle cx="297" cy="260" r="7" fill="#315ce8" data-category="4" data-observation="1"/><circle cx="297" cy="236" r="7" fill="#315ce8" data-category="4" data-observation="2"/><text x="355" y="312" font-size="21" fill="#203549" text-anchor="middle">5</text><circle cx="355" cy="260" r="7" fill="#315ce8" data-category="5" data-observation="1"/><text x="413" y="312" font-size="21" fill="#203549" text-anchor="middle">6</text><text x="240" y="344" font-size="19" fill="#203549" text-anchor="middle">Гол саны</text></g></svg>