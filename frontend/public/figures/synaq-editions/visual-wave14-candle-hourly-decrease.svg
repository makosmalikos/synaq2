<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Тәуелділік сызбасы</title><desc id="desc">Екі жолды кесте. t (сағ): 0, 1, 2, 3, 4. h (см): 30, 26, 22, 18, 14. Бір бағанда тұрғандар өзара сәйкес.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="117" width="430" height="64" fill="#eaf0ff" stroke="#315ce8" stroke-width="2"/><text x="65" y="157" font-size="18" fill="#203549" text-anchor="middle">t (сағ)</text><rect x="25" y="181" width="430" height="64" fill="#f6f3ff" stroke="#315ce8" stroke-width="2"/><text x="65" y="221" font-size="18" fill="#203549" text-anchor="middle">h (см)</text><line x1="105" y1="117" x2="105" y2="245" stroke="#315ce8" stroke-width="1.6" /><text x="140" y="158" font-size="23" fill="#203549" text-anchor="middle">0</text><text x="140" y="222" font-size="23" fill="#203549" text-anchor="middle">30</text><g data-column="0" data-independent="0" data-dependent="30"/><line x1="175" y1="117" x2="175" y2="245" stroke="#315ce8" stroke-width="1.4" /><text x="210" y="158" font-size="23" fill="#203549" text-anchor="middle">1</text><text x="210" y="222" font-size="23" fill="#203549" text-anchor="middle">26</text><g data-column="1" data-independent="1" data-dependent="26"/><line x1="245" y1="117" x2="245" y2="245" stroke="#315ce8" stroke-width="1.4" /><text x="280" y="158" font-size="23" fill="#203549" text-anchor="middle">2</text><text x="280" y="222" font-size="23" fill="#203549" text-anchor="middle">22</text><g data-column="2" data-independent="2" data-dependent="22"/><line x1="315" y1="117" x2="315" y2="245" stroke="#315ce8" stroke-width="1.4" /><text x="350" y="158" font-size="23" fill="#203549" text-anchor="middle">3</text><text x="350" y="222" font-size="23" fill="#203549" text-anchor="middle">18</text><g data-column="3" data-independent="3" data-dependent="18"/><line x1="385" y1="117" x2="385" y2="245" stroke="#315ce8" stroke-width="1.4" /><text x="420" y="158" font-size="23" fill="#203549" text-anchor="middle">4</text><text x="420" y="222" font-size="23" fill="#203549" text-anchor="middle">14</text><g data-column="4" data-independent="4" data-dependent="14"/></g></svg>