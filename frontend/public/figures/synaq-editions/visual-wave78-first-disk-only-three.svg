<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">A центрлі көк және B центрлі сары дөңгелек қиылысып, ортақ бөлік екі түстің қоспасымен көрінеді. P,Q,R,S,T,U,V,W нүктелері белгіленген. Қай тізім дұрыс екені сызбада жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="first" cx="176.25" cy="170.625" r="106.25" fill="#85b4f0" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="second" cx="303.75" cy="170.625" r="106.25" fill="#f4ce68" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-point="P" cx="112.5" cy="149.375" r="3.8" fill="#213a53"/><text x="124.5" y="139.375" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="P">P</text><circle data-point="Q" cx="133.75" cy="213.125" r="3.8" fill="#213a53"/><text x="145.75" y="203.125" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="Q">Q</text><circle data-point="R" cx="176.25" cy="106.875" r="3.8" fill="#213a53"/><text x="188.25" y="96.875" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="R">R</text><circle data-point="S" cx="240" cy="149.375" r="3.8" fill="#213a53"/><text x="252" y="139.375" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="S">S</text><circle data-point="T" cx="240" cy="213.125" r="3.8" fill="#213a53"/><text x="252" y="203.125" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="T">T</text><circle data-point="U" cx="367.5" cy="170.625" r="3.8" fill="#213a53"/><text x="379.5" y="160.625" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="U">U</text><circle data-point="V" cx="325" cy="234.375" r="3.8" fill="#213a53"/><text x="337" y="224.375" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="V">V</text><circle data-point="W" cx="91.25" cy="64.375" r="3.8" fill="#213a53"/><text x="103.25" y="54.375" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="W">W</text><circle data-point="A" cx="176.25" cy="170.625" r="3.8" fill="#213a53"/><text x="161.25" y="158.625" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text><circle data-point="B" cx="303.75" cy="170.625" r="3.8" fill="#213a53"/><text x="288.75" y="158.625" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="B">B</text></g></svg>