<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлгіштер мен еселіктер</title><desc id="desc">Қағаз тіктөртбұрыш: ұзындығы 35 см, ені 20 см. Ішкі бөлу сызықтары көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-outer="rectangle" x="90" y="95" width="315" height="180" rx="0" fill="#eff5ff" stroke="#315ce8" stroke-width="2.4"/><text x="247.5" y="71" text-anchor="middle" fill="#203549" font-size="27" >35 см</text><text x="45" y="193" text-anchor="middle" fill="#203549" font-size="25" >20 см</text></g></svg>