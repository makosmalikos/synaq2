<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ішкі жиындардың орналасуы</title><desc id="desc">T ішкі шеңбері S ішінде, ол R ішінде. Терең ішкіде 1; 3, орта сақинада 2; 6; 9; 18, сыртқы сақинада 4; 12; 36.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Ішкі жиындар</text><circle data-set="R" cx="240" cy="190" r="145" fill="#e0edff" stroke="#203549" stroke-width="2"/><circle data-set="S" cx="210" cy="200" r="108" fill="#fff1bc" stroke="#203549" stroke-width="2"/><circle data-set="T" cx="178" cy="220" r="53" fill="#ccebdc" stroke="#203549" stroke-width="2"/><text x="114" y="81" text-anchor="middle" fill="#203549" font-size="29">R</text><text x="135" y="155" text-anchor="middle" fill="#203549" font-size="25">S</text><text x="178" y="194" text-anchor="middle" fill="#203549" font-size="24">T</text><g data-entry="0"><circle cx="153" cy="218" r="2.8" fill="#203549"/><text x="175" y="227" text-anchor="middle" fill="#203549" font-size="26">1</text></g><g data-entry="1"><circle cx="153" cy="250" r="2.8" fill="#203549"/><text x="175" y="259" text-anchor="middle" fill="#203549" font-size="26">3</text></g><g data-entry="2"><circle cx="188" cy="116" r="2.8" fill="#203549"/><text x="210" y="125" text-anchor="middle" fill="#203549" font-size="26">2</text></g><g data-entry="3"><circle cx="251" cy="166" r="2.8" fill="#203549"/><text x="273" y="175" text-anchor="middle" fill="#203549" font-size="26">6</text></g><g data-entry="4"><circle cx="248" cy="235" r="2.8" fill="#203549"/><text x="270" y="244" text-anchor="middle" fill="#203549" font-size="26">9</text></g><g data-entry="5"><circle cx="202" cy="284" r="2.8" fill="#203549"/><text x="224" y="293" text-anchor="middle" fill="#203549" font-size="26">18</text></g><g data-entry="6"><circle cx="303" cy="105" r="2.8" fill="#203549"/><text x="325" y="114" text-anchor="middle" fill="#203549" font-size="26">4</text></g><g data-entry="7"><circle cx="343" cy="190" r="2.8" fill="#203549"/><text x="365" y="199" text-anchor="middle" fill="#203549" font-size="26">12</text></g><g data-entry="8"><circle cx="298" cy="290" r="2.8" fill="#203549"/><text x="320" y="299" text-anchor="middle" fill="#203549" font-size="26">36</text></g></g></svg>