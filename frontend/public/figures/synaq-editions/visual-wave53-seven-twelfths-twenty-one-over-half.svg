<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сурет бойынша бөлшектерді бөлу</title><desc id="desc">Оқылған көк үлес (7/12). Толық жолақтың дәл ортасындағы қызыл үзік сызық — жартысы. Сол сызықтан көк бөліктің шетіне дейінгі қысқа нұсқар 21 бет деп белгіленген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="42" y1="110" x2="273" y2="110" stroke="#203549" stroke-width="2" data-bracket="blue-share"/><line x1="42" y1="110" x2="48" y2="106" stroke="#203549" stroke-width="2" /><line x1="42" y1="110" x2="48" y2="114" stroke="#203549" stroke-width="2" /><line x1="273" y1="110" x2="267" y2="106" stroke="#203549" stroke-width="2" /><line x1="273" y1="110" x2="267" y2="114" stroke="#203549" stroke-width="2" /><g data-fraction="7/12"><text x="157.5" y="58" text-anchor="middle" fill="#203549" font-size="23">7</text><line x1="140.5" y1="65" x2="174.5" y2="65" stroke="#203549" stroke-width="2" /><text x="157.5" y="90" text-anchor="middle" fill="#203549" font-size="23">12</text></g><line x1="240" y1="147" x2="273" y2="147" stroke="#203549" stroke-width="2" data-bracket="excess-half"/><line x1="240" y1="147" x2="246" y2="143" stroke="#203549" stroke-width="2" /><line x1="240" y1="147" x2="246" y2="151" stroke="#203549" stroke-width="2" /><line x1="273" y1="147" x2="267" y2="143" stroke="#203549" stroke-width="2" /><line x1="273" y1="147" x2="267" y2="151" stroke="#203549" stroke-width="2" /><text x="256.5" y="132" text-anchor="middle" fill="#203549" font-size="23">21</text><rect data-strip="halfgap" data-part="0" data-painted="true" x="42" y="183" width="33" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="halfgap" data-part="1" data-painted="true" x="75" y="183" width="33" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-stri