<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлшектердің қосындысы мен айырмасы</title><desc id="desc">Бірдей толық ұзындықтағы екі жолақ. Жоғарғы көк үлес 1/3. Төменгі көк үлес 1/4 және оған жалғасқан сары «?» бөлік жоғарғы көк бөліктің соңына дейін жетеді.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="48" text-anchor="middle" fill="#203549" font-size="23">Бірдей екі толық жолақ</text><rect data-whole="0" x="42" y="108" width="396" height="66" fill="#fff" stroke="#203549" stroke-width="2"/><rect data-blue="0" x="42" y="108" width="132" height="66" fill="#9ec8ed" stroke="#203549" stroke-width="2"/><g data-fraction="1/3"><text x="108" y="127" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="92" y1="134" x2="124" y2="134" stroke="#203549" stroke-width="2" /><text x="108" y="158" text-anchor="middle" fill="#203549" font-size="22">3</text></g><rect data-whole="1" x="42" y="222" width="396" height="66" fill="#fff" stroke="#203549" stroke-width="2"/><rect data-blue="1" x="42" y="222" width="99" height="66" fill="#9ec8ed" stroke="#203549" stroke-width="2"/><g data-fraction="1/4"><text x="91.5" y="241" text-anchor="middle" fill="#203549" font-size="22">1</text><line x1="75.5" y1="248" x2="107.5" y2="248" stroke="#203549" stroke-width="2" /><text x="91.5" y="272" text-anchor="middle" fill="#203549" font-size="22">4</text></g><rect data-unknown="true" x="141" y="222" width="33" height="66" fill="#f6d16e" stroke="#203549" stroke-width="2"/><text x="157.5" y="265" text-anchor="middle" fill="#203549" font-size="28">?</text><line x1="174" y1="97" x2="174" y2="302" stroke="#203549" stroke-width="2" stroke-dasharray="6 5" data-common-end="true"/></g></svg>