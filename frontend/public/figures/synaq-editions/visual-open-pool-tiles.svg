<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Үсті ашық су ыдысы</title><desc id="desc">Тікбұрышты ыдыстың ұзындығы 12 м, ені 9 м, тереңдігі 3 м; қақпағы жоқ</desc><rect width="480" height="320" rx="14" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#20324e"><polygon points="75,243 338,243 408,167 145,167" fill="#b8cef4" stroke="#4163a3" stroke-width="2"/><polygon points="145,167 408,167 408,109 145,109" fill="#edf3ff" stroke="#4163a3" stroke-width="2"/><polygon points="75,243 145,167 145,109 75,185" fill="#e1ebff" stroke="#4163a3" stroke-width="2"/><polygon points="408,167 338,243 338,185 408,109" fill="#c1d4f5" stroke="#4163a3" stroke-width="2"/><polygon points="338,243 75,243 75,185 338,185" fill="#dae6fb" stroke="#4163a3" stroke-width="2"/><polygon points="75,185 338,185 408,109 145,109" fill="none" stroke="#4163a3" stroke-width="3"/><text x="240" y="49" text-anchor="middle" font-size="23">Үсті ашық</text><text x="205" y="281" text-anchor="middle" font-size="23">12 м</text><text x="397" y="235" text-anchor="middle" font-size="22">9 м</text><text x="49" y="218" text-anchor="middle" font-size="22">3 м</text></g></svg>
