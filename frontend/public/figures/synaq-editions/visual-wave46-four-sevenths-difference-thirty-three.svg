<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Тең бөлшектер және ортақ бөлім</title><desc id="desc">a қысқа жолағы мен b ұзын жолағы сол жақтан бірдей басталады. b жолағындағы артық бөлік астындағы жақша 33 деп белгіленген. Алым мен бөлімнің нақты мәндері көрсетілмеген. Сызба масштабсыз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="59" text-anchor="middle" fill="#203549" font-size="23" >Сызба масштабсыз</text><rect x="84" y="100" width="200" height="48" fill="#a6caed" stroke="#203549" stroke-width="1.8"/><rect x="84" y="228" width="200" height="48" fill="#a6caed" stroke="#203549" stroke-width="1.8"/><rect x="284" y="228" width="100" height="48" fill="#bfa4d7" stroke="#203549" stroke-width="1.8"/><text x="49" y="133" text-anchor="middle" fill="#203549" font-size="29" >a</text><text x="49" y="261" text-anchor="middle" fill="#203549" font-size="29" >b</text><line x1="284" y1="155" x2="284" y2="222" stroke="#8697ab" stroke-width="1.3" stroke-dasharray="4 5"/><line x1="284" y1="302" x2="384" y2="302" stroke="#203549" stroke-width="1.6" /><line x1="284" y1="296" x2="284" y2="308" stroke="#203549" stroke-width="1.6" /><line x1="384" y1="296" x2="384" y2="308" stroke="#203549" stroke-width="1.6" /><text x="334" y="337" text-anchor="middle" fill="#203549" font-size="27" >33</text></g></svg>