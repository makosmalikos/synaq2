<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай сандар мен бөлінгіштік</title><desc id="desc">Бүтін кесінді 90 оқушы; көк бөлікте 30 оқушы, сары бөлікте сұрақ белгісі. Бөліктер бір-бірін қайталамайды.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="90" y1="116" x2="390" y2="116" stroke="#203549" stroke-width="1.6" /><line x1="90" y1="111" x2="90" y2="121" stroke="#203549" stroke-width="1.6" /><line x1="390" y1="111" x2="390" y2="121" stroke="#203549" stroke-width="1.6" /><text x="240" y="101" text-anchor="middle" fill="#203549" font-size="25" >90</text><rect x="90" y="152" width="100" height="70" fill="#8eb3ef" stroke="#203549" stroke-width="1.5" data-known="30"/><rect x="190" y="152" width="200" height="70" fill="#f9d57a" stroke="#203549" stroke-width="1.5" data-unknown="complement"/><text x="140" y="197" text-anchor="middle" fill="#203549" font-size="27" >30</text><text x="290" y="197" text-anchor="middle" fill="#203549" font-size="29" >?</text></g></svg>