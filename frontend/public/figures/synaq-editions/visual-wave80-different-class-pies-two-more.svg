<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Деректерді оқу және салыстыру</title><desc id="desc">Екі бөлек дөңгелек: A сыныбында 30 оқушы, көк үлес 40%; B сыныбында 40 оқушы, көк үлес 25%. Футболды таңдағандардың дайын саны жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-dual-pie="0" cx="125" cy="155" r="80" fill="#fff" stroke="#23394e" stroke-width="1.8"/><path data-dual-share="0" d="M125 155 L125 75 A80 80 0 0 1 172.02282018339787 219.72135954999578 Z" fill="#78aef0" stroke="#23394e" stroke-width="1.8"/><text x="165.8954302006916" y="149.71226924187727" text-anchor="middle" fill="#23394e" font-size="26" data-dual-given="0">40%</text><text x="125" y="285" text-anchor="middle" fill="#23394e" font-size="24" data-dual-whole="0">A: 30 оқушы</text><circle data-dual-pie="1" cx="355" cy="155" r="80" fill="#fff" stroke="#23394e" stroke-width="1.8"/><path data-dual-share="1" d="M355 155 L355 75 A80 80 0 0 1 435 155 Z" fill="#78aef0" stroke="#23394e" stroke-width="1.8"/><text x="385.40559159102156" y="132.59440840897847" text-anchor="middle" fill="#23394e" font-size="26" data-dual-given="1">25%</text><text x="355" y="285" text-anchor="middle" fill="#23394e" font-size="24" data-dual-whole="1">B: 40 оқушы</text></g></svg>