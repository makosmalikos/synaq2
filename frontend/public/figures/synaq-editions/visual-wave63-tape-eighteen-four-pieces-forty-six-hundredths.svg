<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық бөлгішпен суретті есеп</title><desc id="desc">Таспаның толық ұзындығы 18,4 м. Алғашқы үш бірдей бөлікте 0,46 м, кейін көп нүкте сол бөліктердің жалғасатынын көрсетеді; соңғы кең ұяшық бір бөлік ретінде ұсынылмайды.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="24">Ұзындықтар — м</text><line x1="38" y1="117" x2="442" y2="117" stroke="#203549" stroke-width="2" /><line x1="38" y1="112" x2="38" y2="122" stroke="#203549" stroke-width="2" /><line x1="442" y1="112" x2="442" y2="122" stroke="#203549" stroke-width="2" /><text x="240" y="101" text-anchor="middle" fill="#203549" font-size="26">18,4</text><rect x="38" y="177" width="86" height="67" fill="#8fc2f0" stroke="#203549" stroke-width="1.6" data-displayed-part="0"/><text x="81" y="220" text-anchor="middle" fill="#203549" font-size="25">0,46</text><rect x="124" y="177" width="86" height="67" fill="#8fc2f0" stroke="#203549" stroke-width="1.6" data-displayed-part="1"/><text x="167" y="220" text-anchor="middle" fill="#203549" font-size="25">0,46</text><rect x="210" y="177" width="86" height="67" fill="#8fc2f0" stroke="#203549" stroke-width="1.6" data-displayed-part="2"/><text x="253" y="220" text-anchor="middle" fill="#203549" font-size="25">0,46</text><rect x="296" y="177" width="146" height="67" fill="#fff" stroke="#203549" stroke-width="1.6" data-ellipsis="true"/><text x="369" y="220" text-anchor="middle" fill="#203549" font-size="31">…</text></g></svg>