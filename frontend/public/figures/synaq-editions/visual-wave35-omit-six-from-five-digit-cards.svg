<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Цифрлар қосындысы</title><desc id="desc">Бөлек цифр карточкалары: 1, 5, 6, 7, 8. Әр цифр бір рет берілген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-digit="1" x="28" y="132" width="64" height="96" rx="12" fill="#fff1c8" stroke="#a38a56" stroke-width="2"/><text x="60" y="196" text-anchor="middle" fill="#203549" font-size="42" >1</text><rect data-digit="5" x="114" y="132" width="64" height="96" rx="12" fill="#fff1c8" stroke="#a38a56" stroke-width="2"/><text x="146" y="196" text-anchor="middle" fill="#203549" font-size="42" >5</text><rect data-digit="6" x="200" y="132" width="64" height="96" rx="12" fill="#fff1c8" stroke="#a38a56" stroke-width="2"/><text x="232" y="196" text-anchor="middle" fill="#203549" font-size="42" >6</text><rect data-digit="7" x="286" y="132" width="64" height="96" rx="12" fill="#fff1c8" stroke="#a38a56" stroke-width="2"/><text x="318" y="196" text-anchor="middle" fill="#203549" font-size="42" >7</text><rect data-digit="8" x="372" y="132" width="64" height="96" rx="12" fill="#fff1c8" stroke="#a38a56" stroke-width="2"/><text x="404" y="196" text-anchor="middle" fill="#203549" font-size="42" >8</text></g></svg>