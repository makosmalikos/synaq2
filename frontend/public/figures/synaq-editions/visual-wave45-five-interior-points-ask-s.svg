<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлшек координаталар</title><desc id="desc">Сәуледегі бүтін сандар 0, 1, 2, 3. 2 және 3 координаталарының арасында P, Q, R, S, T нүктелері бірдей аралықпен орналасқан. Олардың арасында қосымша қысқа сызықша жоқ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="48" y1="190" x2="447" y2="190" stroke="#203549" stroke-width="2" /><path d="M447 190 L437 184 L437 196 Z" fill="#203549"/><line x1="48" y1="178" x2="48" y2="202" stroke="#203549" stroke-width="2" data-ray-tick="0"/><text x="48" y="240" text-anchor="middle" fill="#203549" font-size="26" data-whole-label="0">0</text><line x1="168" y1="178" x2="168" y2="202" stroke="#203549" stroke-width="2" data-ray-tick="6"/><text x="168" y="240" text-anchor="middle" fill="#203549" font-size="26" data-whole-label="6">1</text><line x1="288" y1="178" x2="288" y2="202" stroke="#203549" stroke-width="2" data-ray-tick="12"/><text x="288" y="240" text-anchor="middle" fill="#203549" font-size="26" data-whole-label="12">2</text><line x1="408" y1="178" x2="408" y2="202" stroke="#203549" stroke-width="2" data-ray-tick="18"/><text x="408" y="240" text-anchor="middle" fill="#203549" font-size="26" data-whole-label="18">3</text><text x="48" y="155" text-anchor="middle" fill="#203549" font-size="25" >O</text><circle data-ray-point="P" cx="308" cy="190" r="5" fill="#6873ba"/><text x="308" y="156" text-anchor="middle" fill="#203549" font-size="25" font-weight="600">P</text><circle data-ray-point="Q" cx="328" cy="190" r="5" fill="#6873ba"/><text x="328" y="228" text-anchor="middle" fill="#203549" font-size="25" font-weight="600">Q</text><circle data-ray-point="R" cx="348" cy="190" r="5" fill="#6873ba"/><text x="348" y="156" text-anchor="middle" fill="#203549" font-size="25" font-weight="600">R</text><cir