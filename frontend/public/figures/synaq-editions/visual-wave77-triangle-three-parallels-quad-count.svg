<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Үшбұрыш ішінде табанға параллель үш толық кесінді және төбеден табан ортасына бір кесінді жүргізілген. Шекаралар да салынған сызықтарға жатады.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="280" x2="120" y2="40" stroke="#243a51" stroke-width="2" data-ray="true"/><line x1="240" y1="280" x2="240" y2="40" stroke="#243a51" stroke-width="2" data-ray="true"/><line x1="240" y1="280" x2="360" y2="40" stroke="#243a51" stroke-width="2" data-ray="true"/><line x1="210" y1="220" x2="270" y2="220" stroke="#243a51" stroke-width="2" data-level="true"/><line x1="180" y1="160" x2="300" y2="160" stroke="#243a51" stroke-width="2" data-level="true"/><line x1="150" y1="100" x2="330" y2="100" stroke="#243a51" stroke-width="2" data-level="true"/><line x1="120" y1="40" x2="360" y2="40" stroke="#243a51" stroke-width="2" data-level="true"/></g></svg>