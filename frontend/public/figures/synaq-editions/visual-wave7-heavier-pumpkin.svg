<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Рет пен аралықтар зертханасы</title><desc id="desc">Сол табақтағы асқабақтың массасы x кг. Оң жақтағы кір тастардың массалары килограммен жазылған. Таразының көлбеуін ескерсек, x қай мән болуы мүмкін? Сол табақ оң табақтан төмен. Оңдағы кір тастар 5 және 4 кг. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#7186a7"/></marker></defs><rect width="480" height="360" fill="white"/><path d="M240,124 L210,295 L270,295 Z" fill="#c7d9ef" stroke="#7795bb" stroke-width="1.5"/><line x1="100" y1="161" x2="380" y2="99" stroke="#706b9e" stroke-width="8"/><circle cx="240" cy="130" r="9" fill="#6f67a6"/><line x1="100" y1="161" x2="48" y2="264" stroke="#8b91aa" stroke-width="1.8"/><line x1="100" y1="161" x2="152" y2="264" stroke="#8b91aa" stroke-width="1.8"/><path d="M42,264 Q100,287 158,264 Z" fill="#b8cce7" stroke="#7895b9" stroke-width="1.5"/><line x1="380" y1="99" x2="328" y2="202" stroke="#8b91aa" stroke-width="1.8"/><line x1="380" y1="99" x2="432" y2="202" stroke="#8b91aa" stroke-width="1.8"/><path d="M322,202 Q380,225 438,202 Z" fill="#b8cce7" stroke="#7895b9" stroke-width="1.5"/><ellipse cx="100" cy="235" rx="37" ry="29" fill="#efb96a" stroke="#b17b46" stroke-width="1.8"/><line x1="100" y1="206" x2="106" y2="195" stroke="#7a9b64" stroke-width="4"/><text x="100" y="238" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#805736" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">x кг</text><rect x="338" y="162" width="34" height="39" rx="5" fill="#d7d6ec" stroke="#9490b5" stroke-width="1.5"/><text x="355" y="181" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">5</text><rect x="378" y="162" width="34" height="39" rx="5" fill="#d7d6ec" stroke="#9490b5" stroke-width="1.5"/><text x="395" y="181" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="21" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">4</text><text x="382" y="235" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#38557b" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Кір тастар, кг</text></svg>
