<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ішкі жиындардың орналасуы</title><desc id="desc">B түгел A ішінде. Ішкіде 3; 7; 11; 15, сыртқы сақинада 2; 6; 10.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Ішкі жиындар</text><circle data-set="A" cx="240" cy="185" r="145" fill="#e0edff" stroke="#203549" stroke-width="2"/><circle data-set="B" cx="198" cy="210" r="80" fill="#fff1bc" stroke="#203549" stroke-width="2"/><text x="118" y="72" text-anchor="middle" fill="#203549" font-size="29">A</text><text x="142" y="214" text-anchor="middle" fill="#203549" font-size="26">B</text><g data-entry="0"><circle cx="148" cy="175" r="2.8" fill="#203549"/><text x="170" y="184" text-anchor="middle" fill="#203549" font-size="26">3</text></g><g data-entry="1"><circle cx="202" cy="175" r="2.8" fill="#203549"/><text x="224" y="184" text-anchor="middle" fill="#203549" font-size="26">7</text></g><g data-entry="2"><circle cx="148" cy="235" r="2.8" fill="#203549"/><text x="170" y="244" text-anchor="middle" fill="#203549" font-size="26">11</text></g><g data-entry="3"><circle cx="202" cy="235" r="2.8" fill="#203549"/><text x="224" y="244" text-anchor="middle" fill="#203549" font-size="26">15</text></g><g data-entry="4"><circle cx="208" cy="84" r="2.8" fill="#203549"/><text x="230" y="93" text-anchor="middle" fill="#203549" font-size="26">2</text></g><g data-entry="5"><circle cx="308" cy="157" r="2.8" fill="#203549"/><text x="330" y="166" text-anchor="middle" fill="#203549" font-size="26">6</text></g><g data-entry="6"><circle cx="299" cy="265" r="2.8" fill="#203549"/><text x="321" y="274" text-anchor="middle" fill="#203549" font-size="26">10</text></g></g></svg>