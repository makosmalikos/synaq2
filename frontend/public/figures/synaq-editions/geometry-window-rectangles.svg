<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-edition="geometry-window-rectangles" data-model="grid-rectangle-count"><title id="title">Терезе торындағы тіктөртбұрыштар</title><desc id="desc">Терезе торы үш қатар мен төрт бағанға бөлінген. Барлық шекаралар толық жүргізілген.</desc><rect width="720" height="480" fill="white"/><g stroke="#233b5d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" text-anchor="middle"><style>text{fill:#18304e;stroke:none}</style><text x="360" y="57" data-given="columns" data-value="4">4 баған</text><text x="65" y="270" data-given="rows" data-value="3">3 қатар</text><line x1="160" y1="110" x2="160" y2="410" data-role="vertical-grid-line"/><line x1="260" y1="110" x2="260" y2="410" data-role="vertical-grid-line"/><line x1="360" y1="110" x2="360" y2="410" data-role="vertical-grid-line"/><line x1="460" y1="110" x2="460" y2="410" data-role="vertical-grid-line"/><line x1="560" y1="110" x2="560" y2="410" data-role="vertical-grid-line"/><line x1="160" y1="110" x2="560" y2="110" data-role="horizontal-grid-line"/><line x1="160" y1="210" x2="560" y2="210" data-role="horizontal-grid-line"/><line x1="160" y1="310" x2="560" y2="310" data-role="horizontal-grid-line"/><line x1="160" y1="410" x2="560" y2="410" data-role="horizontal-grid-line"/></g></svg>
