<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Бөлек бұрыш сызбалары. 1-сызбаның жазуы «∠1»; 2-сызбаның жазуы «∠2»; 3-сызбаның жазуы «∠3», шаршы тік бұрыш белгісі бар; 4-сызбаның жазуы «∠4». Өлшемі жазылмаған бұрыштарға сан қосылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><g data-panel="0"><line x1="95" y1="105" x2="160" y2="105" stroke="#23394b" stroke-width="1.8" data-panel-ray="base"/><line x1="95" y1="105" x2="132.282468362818" y2="51.755117121215534" stroke="#23394b" stroke-width="1.8" data-panel-ray="other"/><text x="119" y="140" text-anchor="middle" fill="#23394b" font-size="26" data-panel-label="0">∠1</text><path data-arc="panel0" d="M118 105 A23 23 0 0 0 108.19225803607407 86.15950298135319" fill="none" stroke="#80b5ef" stroke-width="2.3"/></g><g data-panel="1"><line x1="325" y1="105" x2="390" y2="105" stroke="#23394b" stroke-width="1.8" data-panel-ray="base"/><line x1="325" y1="105" x2="279.03805922287444" y2="59.03805922287441" stroke="#23394b" stroke-width="1.8" data-panel-ray="other"/><text x="349" y="140" text-anchor="middle" fill="#23394b" font-size="26" data-panel-label="1">∠2</text><path data-arc="panel1" d="M348 105 A23 23 0 0 0 308.7365440327094 88.7365440327094" fill="none" stroke="#80b5ef" stroke-width="2.3"/></g><g data-panel="2"><line x1="95" y1="255" x2="160" y2="255" stroke="#23394b" stroke-width="1.8" data-panel-ray="base"/><line x1="95" y1="255" x2="95" y2="190" stroke="#23394b" stroke-width="1.8" data-panel-ray="other"/><text x="119" y="290" text-anchor="middle" fill="#23394b" font-size="26" data-panel-label="2">∠3</text><path data-arc="panel2" d="M118 255 A23 23 0 0 0 95 232" fill="none" stroke="#80b5ef" stroke-width="2.3"/><path data-right="panel2" d="M106 255 L106 244 L95 244" fill="