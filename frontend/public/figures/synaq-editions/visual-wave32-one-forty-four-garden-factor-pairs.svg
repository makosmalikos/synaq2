<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бөлгіштер мен еселіктер</title><desc id="desc">Масштабсыз тіктөртбұрыштың қабырғалары a м және b м, ауданы 144 м². a мен b-ның нақты мәндері көрсетілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-outer="rectangle" x="90" y="95" width="300" height="170" rx="0" fill="#eff5ff" stroke="#315ce8" stroke-width="2.4"/><text x="240" y="71" text-anchor="middle" fill="#203549" font-size="27" >a м</text><text x="45" y="188" text-anchor="middle" fill="#203549" font-size="25" >b м</text><text x="240" y="189" text-anchor="middle" fill="#203549" font-size="27" >S = 144 м²</text></g></svg>