<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">O центрлі шеңбердің A,B нүктелері O-мен қосылып үшбұрыш жасайды. AB хордасында 12 см, төменгі жазуда үшбұрыш периметрі 34 см. Радиустарға сан берілмеген.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="main" cx="240" cy="160" r="112.5" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="240" y1="160" x2="334.29079558595" y2="98.63636363636364" stroke="#213a53" stroke-width="2" data-segment="OA"/><line x1="240" y1="160" x2="334.29079558595" y2="221.36363636363637" stroke="#213a53" stroke-width="2" data-segment="OB"/><line x1="334.29079558595" y1="98.63636363636364" x2="334.29079558595" y2="221.36363636363637" stroke="#213a53" stroke-width="2" data-segment="AB"/><circle data-point="O" cx="240" cy="160" r="3.8" fill="#213a53"/><text x="223" y="182" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="O">O</text><circle data-point="A" cx="334.29079558595" cy="98.63636363636364" r="3.8" fill="#213a53"/><text x="351.05360369011885" y="94.72727272727273" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text><circle data-point="B" cx="334.29079558595" cy="221.36363636363637" r="3.8" fill="#213a53"/><text x="351.05360369011885" y="239.27272727272728" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="B">B</text><text x="396.29079558595" y="168" text-anchor="middle" fill="#213a53" font-size="27" data-given="chord">12 см</text><text x="240" y="337" text-anchor="middle" fill="#213a53" font-size="27" data-given="triangleP">Pүшбұрыш = 34 см</text></g></svg>