<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Деректер мен нұсқалар</title><desc id="desc">Сорпа-тағам ағашы: P сорпасынан 1, 2, 3, 4 тағамдарына бұтақтар шығады; Q сорпасынан 1, 2, 3 тағамдарына бұтақтар шығады.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="170" width="68" height="40" rx="9" fill="#eaf0ff" stroke="#315ce8"/><text x="44" y="196" font-size="23" fill="#203549" text-anchor="middle">Ас</text><line x1="78" y1="190" x2="162" y2="107.5" stroke="#dbe5f1" stroke-width="2" /><circle cx="180" cy="107.5" r="17" fill="#8459ce" /><text x="180" y="115.5" font-size="25" fill="#fff" text-anchor="middle">P</text><line x1="198" y1="107.5" x2="386" y2="40" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="40" r="16" fill="#315ce8" data-path="P1"/><text x="405" y="47" font-size="23" fill="#fff" text-anchor="middle">1</text><line x1="198" y1="107.5" x2="386" y2="85" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="85" r="16" fill="#315ce8" data-path="P2"/><text x="405" y="92" font-size="23" fill="#fff" text-anchor="middle">2</text><line x1="198" y1="107.5" x2="386" y2="130" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="130" r="16" fill="#315ce8" data-path="P3"/><text x="405" y="137" font-size="23" fill="#fff" text-anchor="middle">3</text><line x1="198" y1="107.5" x2="386" y2="175" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="175" r="16" fill="#315ce8" data-path="P4"/><text x="405" y="182" font-size="23" fill="#fff" text-anchor="middle">4</text><line x1="78" y1="190" x2="162" y2="285" stroke="#dbe5f1" stroke-width="2" /><circle cx="180" cy="285" r="17" fill="#8459ce" /><text x="180" y="293" font-size="25" fill="#fff" text-anchor="middle">Q</text><line x1="198" y1="285" x2="386" y2="240" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="240" r="16" fill="#315ce8" data-path="Q1"/><text x="405" y="247" font-size="23" fill="#fff" text-anchor="middle">1</text><line x1="198" y1="285" x2="386" y2="285" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="285" r="16" fill="#315ce8" data-path="Q2"/><text x="405" y="292" font-size="23" fill="#fff" text-anchor="middle">2</text><line x1="198" y1="285" x2="386" y2="330" stroke="#315ce8" stroke-width="2" /><circle cx="405" cy="330" r="16" fill="#315ce8" data-path="Q3"/><text x="405" y="337" font-size="23" fill="#fff" text-anchor="middle">3</text></g></svg>