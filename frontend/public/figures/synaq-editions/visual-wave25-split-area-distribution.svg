<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Арифметикалық амалдардың қасиеттері</title><desc id="desc">Екі жалғас тіктөртбұрыштың ұзындықтары 20 және 4, ортақ ені 9.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-rectangle-part="first" x="100" y="125" width="266.6666666666667" height="120" fill="#cddcff" stroke="#203549" stroke-width="2"/><rect data-rectangle-part="second" x="366.6666666666667" y="125" width="53.333333333333336" height="120" fill="#f7dda0" stroke="#203549" stroke-width="2"/><text x="233.33333333333334" y="107" font-size="25" fill="#203549" text-anchor="middle">20</text><text x="393.33333333333337" y="107" font-size="25" fill="#203549" text-anchor="middle">4</text><text x="76" y="193" font-size="25" fill="#203549" text-anchor="middle">9</text></g></svg>