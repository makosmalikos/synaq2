<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Сурет бойынша бірлескен жұмыс</title><desc id="desc">A 12 сағат, B 20 сағат, C 15 сағат деп жазылған жеке толық уақыттар. A мен B нұсқары бакқа төмен қарай, C нұсқары бактан сыртқа қарай бағытталған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="29" text-anchor="middle" fill="#203549" font-size="22">Жеке толық уақыт — сағатпен</text><path data-tank="true" d="M 70 148 L 70 313 L 410 313 L 410 148" fill="none" stroke="#203549" stroke-width="2.2"/><text x="130" y="70" text-anchor="middle" fill="#203549" font-size="23">A: 12 сағ</text><line x1="130" y1="91" x2="130" y2="180" stroke="#203549" stroke-width="2" data-flow="in" data-pipe="A" style="stroke:#5d9cdf"/><line x1="130" y1="180" x2="124" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><line x1="130" y1="180" x2="136" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><text x="300" y="70" text-anchor="middle" fill="#203549" font-size="23">B: 20 сағ</text><line x1="300" y1="91" x2="300" y2="180" stroke="#203549" stroke-width="2" data-flow="in" data-pipe="B" style="stroke:#5d9cdf"/><line x1="300" y1="180" x2="294" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><line x1="300" y1="180" x2="306" y2="171" stroke="#203549" stroke-width="2" style="stroke:#5d9cdf"/><text x="350" y="223" text-anchor="middle" fill="#203549" font-size="22">C: 15 сағ</text><line x1="352" y1="258" x2="447" y2="258" stroke="#203549" stroke-width="2" data-flow="out" data-pipe="C" style="stroke:#da5c68"/><line x1="447" y1="258" x2="438" y2="252" stroke="#203549" stroke-width="2" style="stroke:#da5c68"/><line x1="447" y1="258" x2="438" y2="264" stroke="#203549" stroke-width="2" style="stroke:#da5c68"/></g></svg>