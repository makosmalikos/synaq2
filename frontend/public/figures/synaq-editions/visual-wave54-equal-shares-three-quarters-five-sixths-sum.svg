<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Суреттегі бөлік пен бүтін</title><desc id="desc">A жолағы 4 тең ұяшық, алғашқы 3 көк. B жолағы 6 тең ұяшық, алғашқы 5 көк. Масштаб бірдей, көк ұзындықтар тең, толық жолақтар әртүрлі. Екеуінде бірге 152 төсбелгі.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="39" text-anchor="middle" fill="#203549" font-size="23">Барлығы 152 төсбелгі</text><text x="20" y="153" text-anchor="middle" fill="#203549" font-size="25">A</text><rect data-strip="A" data-part="0" data-painted="true" x="42" y="113" width="99" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="A" data-part="1" data-painted="true" x="141" y="113" width="99" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="A" data-part="2" data-painted="true" x="240" y="113" width="99" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="A" data-part="3" data-painted="false" x="339" y="113" width="99" height="64" fill="#fff" stroke="#203549" stroke-width="1.5"/><text x="20" y="283" text-anchor="middle" fill="#203549" font-size="25">B</text><rect data-strip="B" data-part="0" data-painted="true" x="42" y="243" width="59.4" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="B" data-part="1" data-painted="true" x="101.4" y="243" width="59.4" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="B" data-part="2" data-painted="true" x="160.8" y="243" width="59.4" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="B" data-part="3" data-painted="true" x="220.19999999999996" y="243" width="59.4" height="64" fill="#9ec8ed" stroke="#203549" stroke-width="1.5"/><rect data-strip="B" data-part="4" data-painted="true"