<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ондық көбейтуге суретті тапсырма</title><desc id="desc">Төрт қабырғасында бірдей теңдік сызықшасы бар квадрат. Төменгі қабырғасында 2,65 см.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="35" text-anchor="middle" fill="#203549" font-size="24">Ұзындық — см</text><rect x="130" y="70" width="220" height="220" fill="#d9eafb" stroke="#203549" stroke-width="1.6" data-square="true"/><text x="240" y="329" text-anchor="middle" fill="#203549" font-size="28">2,65</text><line x1="240" y1="62" x2="240" y2="78" stroke="#203549" stroke-width="2" data-equal-tick="true"/><line x1="240" y1="282" x2="240" y2="298" stroke="#203549" stroke-width="2" data-equal-tick="true"/><line x1="122" y1="180" x2="138" y2="180" stroke="#203549" stroke-width="2" data-equal-tick="true"/><line x1="342" y1="180" x2="358" y2="180" stroke="#203549" stroke-width="2" data-equal-tick="true"/></g></svg>