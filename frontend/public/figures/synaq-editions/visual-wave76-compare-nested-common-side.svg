<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштардың түрлері мен өлшемдері</title><desc id="desc">Барлық сәуле V төбесінен шығады. Сағат тіліне қарсы реті: P; R; Q. Белгісіз өлшемдер санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="428" y2="275" stroke="#23394b" stroke-width="1.8" data-ray="P"/><text x="452" y="283" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="P">P</text><line x1="240" y1="275" x2="194.51868362726245" y2="92.58440346011267" stroke="#23394b" stroke-width="1.8" data-ray="Q"/><text x="188.7125581328704" y="77.29730602948874" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Q">Q</text><line x1="240" y1="275" x2="365.79655399546533" y2="135.2887728102499" stroke="#23394b" stroke-width="1.8" data-ray="R"/><text x="381.855688548078" y="125.45329699879241" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="R">R</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">V</text></g></svg>