<svg xmlns="http://www.w3.org/2000/svg" width="480" height="245" viewBox="0 0 480 245" role="img" aria-labelledby="title desc"><title id="title">Қозғалыс пен өзгерістер сызбасы</title><desc id="desc">Салымға әр жылдың соңында бірдей пайызбен күрделі өсім қосылады. Сызбада бастапқы сома мен бір жылдан кейінгі сома берілген. Екі жылдан кейін салым неше теңге болады? Жауапқа тек санды жазыңыз. Бастапқы сома 64000 теңге; 1 жылдан кейін 72000 теңге; 2 жылдан кейінгі сома белгісіз. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6b80ae"/></marker></defs><rect width="480" height="245" fill="white"/><rect x="15" y="87" width="132" height="82" rx="13" fill="#eaf2ff" stroke="#93a9cf" stroke-width="1.5"/><text x="81" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Бастапқы</text><text x="81" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="28" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">64000</text><rect x="174" y="87" width="132" height="82" rx="13" fill="#eaf2ff" stroke="#93a9cf" stroke-width="1.5"/><text x="240" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">1 жылдан соң</text><text x="240" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="28" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">72000</text><rect x="333" y="87" width="132" height="82" rx="13" fill="#f0eaff" stroke="#93a9cf" stroke-width="1.5"/><text x="399" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">2 жылдан соң</text><text x="399" y="127" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="28" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">?</text><line x1="149" y1="128" x2="171" y2="128" stroke="#5f7fba" stroke-width="2.8" marker-end="url(#tip)" /><line x1="308" y1="128" x2="330" y2="128" stroke="#5f7fba" stroke-width="2.8" marker-end="url(#tip)" /><text x="240" y="214" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="20" fill="#345076" stroke="white" stroke-width="2.7" paint-order="stroke" stroke-linejoin="round">Барлық сомалар теңгемен</text></svg>
