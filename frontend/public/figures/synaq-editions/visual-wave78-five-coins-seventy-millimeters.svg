<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">5 бірдей шеңбердің центрлері бір көлденең түзуде. Көрші шеңберлер бір нүктеде сырттай жанасады. Екі сыртқы шет арасындағы өлшем 70 мм.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="row0" cx="100" cy="160" r="35" fill="#f6d170" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="row1" cx="170" cy="160" r="35" fill="#f6d170" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="row2" cx="240" cy="160" r="35" fill="#f6d170" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="row3" cx="310" cy="160" r="35" fill="#f6d170" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><circle data-circle="row4" cx="380" cy="160" r="35" fill="#f6d170" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="65" y1="246" x2="65" y2="266" stroke="#213a53" stroke-width="2" data-measure-end="left"/><line x1="415" y1="246" x2="415" y2="266" stroke="#213a53" stroke-width="2" data-measure-end="right"/><line x1="65" y1="260" x2="415" y2="260" stroke="#213a53" stroke-width="2" data-measure="total"/><text x="240" y="302" text-anchor="middle" fill="#213a53" font-size="28" data-given="span">70 мм</text></g></svg>