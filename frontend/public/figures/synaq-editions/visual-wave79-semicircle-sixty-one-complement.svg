<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">O центрлі толық дөңгелек, 3 радиус. Шеңберді сағат тіліне қарсы айналғандағы әріп реті A, C, B. Сектор ішіндегі жазулар ретімен: 61°; ?; өлшем жазылмаған. Сұралған сектор немесе құрамдас бөліктер көкпен боялған. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><path data-shaded-sector="1" d="M240 172 L295.7531063283288 71.41873367896949 A115 115 0 0 0 125 172 Z" fill="#7baeea" fill-opacity=".7"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="A"/><text x="379" y="180" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="A">A</text><line x1="240" y1="172" x2="295.7531063283288" y2="71.41873367896949" stroke="#233c56" stroke-width="1.8" data-radius="C"/><text x="307.38853721424084" y="58.42786070762399" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="C">C</text><line x1="240" y1="172" x2="125" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="B"/><text x="101" y="179.99999999999997" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="B">B</text><text x="298.59078291002373" y="145.4873913186721" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="0">61°</text><text x="205.4873913186721" y="121.40921708997625" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="1">?</text><circle cx="240" cy="172" r="3.6" fill="#233c56"/><text x="240" y="204" text-anchor="middle" fill="#233c56" font-size="26" data-center="true">O</text></g></svg>