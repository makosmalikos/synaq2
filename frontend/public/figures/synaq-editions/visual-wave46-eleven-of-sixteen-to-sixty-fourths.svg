<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Тең бөлшектер және ортақ бөлім</title><desc id="desc">Бір үлкен шаршы 4 қатар мен 4 бағандағы 16 тең ұяшыққа бөлінген. Қатарлар жоғарыдан төмен саналады. Әр қатардағы көк ұяшықтардың солдан оңға орындары: 1-қатар 1, 2, 3; 2-қатар 1, 2, 4; 3-қатар 1, 2, 3; 4-қатар 2, 4.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect data-grid-cell="0" data-painted="true" x="100" y="40" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="1" data-painted="true" x="170" y="40" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="2" data-painted="true" x="240" y="40" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="3" data-painted="false" x="310" y="40" width="70" height="70" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="4" data-painted="true" x="100" y="110" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="5" data-painted="true" x="170" y="110" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="6" data-painted="false" x="240" y="110" width="70" height="70" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="7" data-painted="true" x="310" y="110" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="8" data-painted="true" x="100" y="180" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="9" data-painted="true" x="170" y="180" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="10" data-painted="true" x="240" y="180" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="11" data-painted="false" x="310" y="180" width="70" height="70" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="12" data-painted="false" x="100" y="250" width="70" height="70" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="13" data-painted="true" x="170" y="250" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="14" data-painted="false" x="240" y="250" width="70" height="70" fill="#fff" stroke="#203549" stroke-width="1.6"/><rect data-grid-cell="15" data-painted="true" x="310" y="250" width="70" height="70" fill="#a6caed" stroke="#203549" stroke-width="1.6"/></g></svg>