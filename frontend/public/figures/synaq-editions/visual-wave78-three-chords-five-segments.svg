<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Шеңбер мен дөңгелек</title><desc id="desc">O центрлі шеңбер. Салынған толық кесінділер: AB, CD, EF, OG, HM. M — ішкі нүкте, O — центр; A, B, C, D, E, F, G, H шеңбердің бойында. Кесінділердің жіктелуі суретте жауап ретінде жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-circle="main" cx="240" cy="160" r="115" fill="#fff" fill-opacity=".45" stroke="#213a53" stroke-width="2.3"/><line x1="145.79751490676597" y1="94.03870981962966" x2="279.3323164824519" y2="51.93534860962055" stroke="#213a53" stroke-width="2" data-segment="AB"/><line x1="355" y1="160" x2="125" y2="160" stroke="#213a53" stroke-width="2" data-segment="CD"/><line x1="220.030459568303" y1="273.2528915964039" x2="328.0951109586824" y2="233.92057511395205" stroke="#213a53" stroke-width="2" data-segment="EF"/><line x1="240" y1="160" x2="140.40707856478957" y2="217.5" stroke="#213a53" stroke-width="2" data-segment="OG"/><line x1="200.66768351754808" y1="51.93534860962052" x2="217" y2="183" stroke="#213a53" stroke-width="2" data-segment="HM"/><circle data-point="A" cx="145.79751490676597" cy="94.03870981962966" r="3.8" fill="#213a53"/><text x="129.41447402098612" y="89.56718109260873" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="A">A</text><circle data-point="B" cx="279.3323164824519" cy="51.93534860962055" r="3.8" fill="#213a53"/><text x="286.1727193489653" y="40.14149619390238" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="B">B</text><circle data-point="C" cx="355" cy="160" r="3.8" fill="#213a53"/><text x="375" y="167" text-anchor="middle" fill="#213a53" font-size="28" data-point-name="C">C</text><circle data-point="D" cx="125" cy="160" r="3.8" fill="#213a53"/><text x="105" y="167" text-anchor="middle" fill="#