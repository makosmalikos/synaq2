<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Бұрыштар мен сәулелер</title><desc id="desc">Барлық сәуле R төбесінен шығады. Сағат тіліне қарсы реті: X; Y. Белгісіз бұрыштар санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="240" y1="275" x2="421.59405534234486" y2="226.3420195207261" stroke="#23394b" stroke-width="2.1" data-ray="X"/><text x="445.74220099957154" y="227.87154339316308" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="X">X</text><line x1="240" y1="275" x2="191.34201952072607" y2="93.40594465765517" stroke="#23394b" stroke-width="2.1" data-ray="Y"/><text x="184.87154339316305" y="77.25779900042846" text-anchor="middle" fill="#23394b" font-size="29" data-endpoint="Y">Y</text><circle cx="240" cy="275" r="4" fill="#23394b"/><text x="224" y="305" text-anchor="middle" fill="#23394b" font-size="29" data-vertex="true">R</text></g></svg>