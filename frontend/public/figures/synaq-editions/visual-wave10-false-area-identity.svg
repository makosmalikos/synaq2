<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Алгебралық сызба</title><desc id="desc">Тіктөртбұрыштың биіктігі 4. Көлденең ұзындығы a және 6 бөліктерінен тұрады. Бөліктердің ортақ шекарасы тік.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="75" y="148.33333333333334" width="220" height="73.33333333333333" fill="#eaf0ff" stroke="#315ce8" stroke-width="2" data-side="variable"/><rect x="295" y="148.33333333333334" width="110" height="73.33333333333333" fill="#fff1c2" stroke="#315ce8" stroke-width="2" data-side="constant"/><line x1="75" y1="128.33333333333334" x2="295" y2="128.33333333333334" stroke="#203549" stroke-width="1.5" /><line x1="75" y1="123.33333333333334" x2="75" y2="133.33333333333334" stroke="#203549" stroke-width="1.5" /><line x1="295" y1="123.33333333333334" x2="295" y2="133.33333333333334" stroke="#203549" stroke-width="1.5" /><text x="185" y="118.33333333333334" font-size="23" fill="#203549" text-anchor="middle">a</text><line x1="295" y1="128.33333333333334" x2="405" y2="128.33333333333334" stroke="#203549" stroke-width="1.5" /><line x1="295" y1="123.33333333333334" x2="295" y2="133.33333333333334" stroke="#203549" stroke-width="1.5" /><line x1="405" y1="123.33333333333334" x2="405" y2="133.33333333333334" stroke="#203549" stroke-width="1.5" /><text x="350" y="118.33333333333334" font-size="23" fill="#203549" text-anchor="middle">6</text><text x="50" y="193" font-size="25" fill="#203549" text-anchor="middle">4</text></g></svg>