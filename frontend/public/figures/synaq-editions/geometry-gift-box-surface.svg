<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-edition="geometry-gift-box-surface" data-model="closed-box-surface"><title id="title">Қағазбен қапталатын жабық қорап</title><desc id="desc">Қораптың ұзындығы 8 см, ені 5 см, биіктігі 3 см. Қақпағы мен табаны да сыртқы бетке кіреді.</desc><rect width="720" height="480" fill="white"/><g stroke="#233b5d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" text-anchor="middle"><style>text{fill:#18304e;stroke:none}</style><polygon points="140,180 470,180 470,350 140,350" fill="#e4edff"/><polygon points="140,180 260,90 590,90 470,180" fill="#c8dafd"/><polygon points="470,180 590,90 590,260 470,350" fill="#a5c3fc"/><line x1="140" y1="385" x2="470" y2="385" /><line x1="140" y1="375" x2="140" y2="395" /><line x1="470" y1="375" x2="470" y2="395" /><text x="305" y="433" data-given="lengthCm" data-value="8">8 см</text><text x="570" y="369" data-given="widthCm" data-value="5">5 см</text><text x="80" y="276" data-given="heightCm" data-value="3">3 см</text><text x="360" y="46" font-size="28">Табаны мен қақпағы да қапталады</text></g></svg>
