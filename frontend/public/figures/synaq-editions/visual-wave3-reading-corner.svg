<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Құрама фигуралар шеберханасы</title><desc id="desc">Кітапхана бұрышындағы төсеніш 6 × 4 м тіктөртбұрыштан және оған жалғасқан тікбұрышты үшбұрыштан тұрады. Үшбұрыштың 4 м катеті тіктөртбұрыштың қысқа қабырғасымен толық беттеседі, екінші катеті 3 м. Төсеніштің ауданы неше м²? Көк бөліктер есепке алынады; ашық түсті ойықтар мен бос орындар алынбайды.</desc><rect width="480" height="360" fill="white"/><rect x="107.5" y="96.111" width="176.667" height="117.778" fill="#a8bfff" fill-opacity="1" /><polygon points="284.167,96.111 284.167,213.889 372.5,213.889" fill="#a8bfff" stroke="#496fa7" stroke-width="2.3"/><path d="M107.5,96.111L136.944,96.111 M107.5,125.556L107.5,96.111 M136.944,96.111L166.389,96.111 M166.389,96.111L195.833,96.111 M195.833,96.111L225.278,96.111 M225.278,96.111L254.722,96.111 M254.722,96.111L284.167,96.111 M284.167,96.111L284.167,125.556 M107.5,155L107.5,125.556 M284.167,125.556L284.167,155 M107.5,184.444L107.5,155 M284.167,155L284.167,184.444 M136.944,213.889L107.5,213.889 M107.5,213.889L107.5,184.444 M166.389,213.889L136.944,213.889 M195.833,213.889L166.389,213.889 M225.278,213.889L195.833,213.889 M254.722,213.889L225.278,213.889 M284.167,184.444L284.167,213.889 M284.167,213.889L254.722,213.889" fill="none" stroke="#496fa7" stroke-width="2.3" stroke-linecap="square"/><path d="M107.5,72.111L284.167,72.111 M107.5,68.111v8 M284.167,68.111v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="195.833" y="59.111" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">6 м</text><path d="M83.5,96.111L83.5,213.889 M79.5,96.111h8 M79.5,213.889h8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="58.5" y="155" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">4 м</text><path d="M284.167,237.889L372.5,237.889 M284.167,233.889v8 M372.5,233.889v8" fill="none" stroke="#667d98" stroke-width="1.2"/><text x="328.333" y="224.889" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#20374f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3 м</text><text x="240" y="350" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#4164a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Көк бөлік есепке алынады</text></svg>
