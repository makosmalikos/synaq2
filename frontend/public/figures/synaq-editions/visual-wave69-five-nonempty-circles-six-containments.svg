<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ішкі жиындардың орналасуы</title><desc id="desc">E ішінде бөлек F және G. F ішінде өзара бөлек H және J.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Ішкі жиындар</text><circle data-set="E" cx="240" cy="190" r="143" fill="#e0edff" stroke="#203549" stroke-width="2"/><circle data-set="F" cx="196" cy="200" r="84" fill="#fff1bc" stroke="#203549" stroke-width="2"/><circle data-set="G" cx="339" cy="203" r="30" fill="#fff1bc" stroke="#203549" stroke-width="2"/><circle data-set="H" cx="164" cy="180" r="26" fill="#ccebdc" stroke="#203549" stroke-width="2"/><circle data-set="J" cx="217" cy="233" r="26" fill="#ccebdc" stroke="#203549" stroke-width="2"/><text x="130" y="75" text-anchor="middle" fill="#203549" font-size="29">E</text><text x="179" y="144" text-anchor="middle" fill="#203549" font-size="26">F</text><text x="339" y="212" text-anchor="middle" fill="#203549" font-size="26">G</text><text x="164" y="189" text-anchor="middle" fill="#203549" font-size="25">H</text><text x="217" y="242" text-anchor="middle" fill="#203549" font-size="25">J</text></g></svg>