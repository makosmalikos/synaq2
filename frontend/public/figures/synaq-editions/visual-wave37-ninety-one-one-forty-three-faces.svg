<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жай көбейткіштер</title><desc id="desc">Көк алдыңғы жақта 91 см², күлгін оң жақта 143 см² жазылған. Бұл жақтардың ортақ шекарасы бір тік қыр. Жоғарғы жақтың ауданы белгісіз.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-box-face="top" points="78,148 327,148 415,81 166,81" fill="#f1f4fb" stroke="#203549" stroke-width="2"/><polygon data-box-face="right" points="327,294 415,227 415,81 327,148" fill="#d1c2ed" stroke="#203549" stroke-width="2"/><polygon data-box-face="front" points="78,294 327,294 327,148 78,148" fill="#b4d3f8" stroke="#203549" stroke-width="2"/><text x="202" y="230" text-anchor="middle" fill="#203549" font-size="29" >91 см²</text><text x="370" y="181" text-anchor="middle" fill="#203549" font-size="25" >143</text><text x="370" y="207" text-anchor="middle" fill="#203549" font-size="23" >см²</text></g></svg>