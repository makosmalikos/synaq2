<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Квадрат пен куб</title><desc id="desc">Ішкі кеңістігі текше қорап. Алдыңғы жақта V = 512 дм³ жазылған, төменгі қырда ? дм.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-cube-face="top" points="96,76 311,76 391,26 176,26" fill="#c5dcfb" stroke="#203549" stroke-width="2"/><polygon data-cube-face="right" points="311,291 391,241 391,26 311,76" fill="#92b4df" stroke="#203549" stroke-width="2"/><polygon data-cube-face="front" points="96,291 311,291 311,76 96,76" fill="#d9e9ff" stroke="#203549" stroke-width="2"/><text x="203" y="168" text-anchor="middle" fill="#203549" font-size="28" >V =</text><text x="203" y="212" text-anchor="middle" fill="#203549" font-size="30" >512 дм³</text><line x1="96" y1="309" x2="311" y2="309" stroke="#203549" stroke-width="1.7" /><line x1="96" y1="309" x2="103" y2="304" stroke="#203549" stroke-width="1.7" /><line x1="96" y1="309" x2="103" y2="314" stroke="#203549" stroke-width="1.7" /><line x1="311" y1="309" x2="304" y2="304" stroke="#203549" stroke-width="1.7" /><line x1="311" y1="309" x2="304" y2="314" stroke="#203549" stroke-width="1.7" /><text x="203.5" y="339" text-anchor="middle" fill="#203549" font-size="25" >? дм</text></g></svg>