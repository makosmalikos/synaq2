<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Үзік тіктөртбұрыш ішінде көк трапеция. Жоғарғы қабырғадағы бөліктер солдан оңға 3, 7, 2 см, биіктік 8 см. Екі шеткі тікбұрышты үшбұрыш ақ түсті.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><polygon data-polygon="main" points="85,288.3333333333333 395,288.3333333333333 343.3333333333333,81.66666666666667 162.5,81.66666666666667" fill="#9fc9fa" fill-opacity=".7" stroke="#335e8c" stroke-width="2.5"/><line x1="85" y1="288.3333333333333" x2="85" y2="81.66666666666667" stroke="#243a51" stroke-width="2" stroke-dasharray="5 5" data-box="true"/><line x1="85" y1="81.66666666666667" x2="395" y2="81.66666666666667" stroke="#243a51" stroke-width="2" stroke-dasharray="5 5" data-box="true"/><line x1="395" y1="81.66666666666667" x2="395" y2="288.3333333333333" stroke="#243a51" stroke-width="2" stroke-dasharray="5 5" data-box="true"/><line x1="162.5" y1="288.3333333333333" x2="162.5" y2="81.66666666666667" stroke="#243a51" stroke-width="2" stroke-dasharray="3 5" stroke-opacity=".4"/><line x1="343.3333333333333" y1="288.3333333333333" x2="343.3333333333333" y2="81.66666666666667" stroke="#243a51" stroke-width="2" stroke-dasharray="3 5" stroke-opacity=".4"/><text x="123.75" y="61.66666666666667" text-anchor="middle" fill="#243a51" font-size="27" data-given="top">3 см</text><text x="252.91666666666666" y="61.66666666666667" text-anchor="middle" fill="#243a51" font-size="27" data-given="top">7 см</text><text x="369.16666666666663" y="61.66666666666667" text-anchor="middle" fill="#243a51" font-size="27" data-given="top">2 см</text><text x="41" y="193" text-anchor="middle" fill="#243a51" font-size="27" data-given="height">8 см</text></g></svg>