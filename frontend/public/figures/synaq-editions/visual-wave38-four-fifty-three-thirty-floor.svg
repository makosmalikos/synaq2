<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Ортақ бөлгіш</title><desc id="desc">Тіктөртбұрыштың төменгі қабырғасы 4 м 50 см, сол қабырғасы 3 м 30 см. Ішкі тақталар салынбаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="112" y="56" width="310" height="227.33333333333334" fill="#d2e6fb" stroke="#203549" stroke-width="1.8"/><text x="267" y="323.33333333333337" text-anchor="middle" fill="#203549" font-size="27" >4 м 50 см</text><text x="65" y="169.66666666666669" text-anchor="middle" fill="#203549" font-size="27" transform="rotate(-90 65 169.66666666666669)">3 м 30 см</text></g></svg>