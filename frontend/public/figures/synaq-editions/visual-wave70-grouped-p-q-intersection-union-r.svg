<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Жиындардың бірігуі мен қиылысуы</title><desc id="desc">P/Q/R үш шеңбері, орындары: A аймағында 3; 7. B аймағында 17. C аймағында 29; 31. AB аймағында 11. AC аймағында 13. BC аймағында 19; 23. ABC аймағында 5. A/B/C орындары тиісінше P, Q, R.</desc><defs></defs><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="31" text-anchor="middle" fill="#203549" font-size="25">Бірігу және қиылысу</text><circle data-set="P" cx="180" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="Q" cx="300" cy="150" r="110" fill="none" stroke="#203549" stroke-width="2" /><circle data-set="R" cx="240" cy="240" r="110" fill="none" stroke="#203549" stroke-width="2" /><text x="65" y="70" text-anchor="middle" fill="#203549" font-size="28">P</text><text x="415" y="70" text-anchor="middle" fill="#203549" font-size="28">Q</text><text x="365" y="330" text-anchor="middle" fill="#203549" font-size="28">R</text><g data-entry="0"><circle cx="103" cy="125" r="2.8" fill="#203549"/><text x="125" y="134" text-anchor="middle" fill="#203549" font-size="26">3</text></g><g data-entry="1"><circle cx="103" cy="175" r="2.8" fill="#203549"/><text x="125" y="184" text-anchor="middle" fill="#203549" font-size="26">7</text></g><g data-entry="2"><circle cx="333" cy="145" r="2.8" fill="#203549"/><text x="355" y="154" text-anchor="middle" fill="#203549" font-size="26">17</text></g><g data-entry="3"><circle cx="188" cy="300" r="2.8" fill="#203549"/><text x="210" y="309" text-anchor="middle" fill="#203549" font-size="26">29</text></g><g data-entry="4"><circle cx="250" cy="300" r="2.8" fill="#203549"/><text x="272" y="309" text-anchor="middle" fill="#203549" font-size="26">31</text></g><g data-entry="5"><circle cx="218" cy="88" r="2.8" fill="#203549"/><text x="240" y="97" text-anchor="middle" fill="#203549" font-size="26">11</text></g><g data-entry="6"><circle cx="140" cy="235" r="2.8" fill="#203549"/><text x="162" y="244" text-anchor="middle" fill="#203549" font-size="26">13</text></g><g data-entry="7"><circle cx="303" cy="200" r="2.8" fill="#203549"/><text x="325" y="209" text-anchor="middle" fill="#203549" font-size="26">19</text></g><g data-entry="8"><circle cx="278" cy="238" r="2.8" fill="#203549"/><text x="300" y="247" text-anchor="middle" fill="#203549" font-size="26">23</text></g><g data-entry="9"><circle cx="218" cy="178" r="2.8" fill="#203549"/><text x="240" y="187" text-anchor="middle" fill="#203549" font-size="26">5</text></g></g></svg>