<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">K центрлі толық дөңгелек, 3 радиус. Шеңберді сағат тіліне қарсы айналғандағы әріп реті P, Q, R. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="P"/><text x="379" y="180" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="P">P</text><line x1="240" y1="172" x2="204.46304564688106" y2="62.62850062605733" stroke="#233c56" stroke-width="1.8" data-radius="Q"/><text x="197.0466377818823" y="47.803144234973644" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="Q">Q</text><line x1="240" y1="172" x2="182.49999999999994" y2="271.5929214352104" stroke="#233c56" stroke-width="1.8" data-radius="R"/><text x="170.49999999999994" y="300.37753112603696" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="R">R</text><circle cx="240" cy="172" r="3.6" fill="#233c56"/><text x="216.13147451116146" y="177.49131688157632" text-anchor="middle" fill="#233c56" font-size="26" data-center="true">K</text></g></svg>