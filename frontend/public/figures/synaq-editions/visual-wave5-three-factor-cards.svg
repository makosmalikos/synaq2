<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="title desc"><title id="title">Сандар мен үлестер зертханасы</title><desc id="desc">Үш карточкадағы сандардың көбейтіндісін табыңыз. Алдымен дөңгелек сан беретін көбейткіштерді топтастыруға болады. Жауапқа тек санды жазыңыз. Карточкалардағы сандар: -20, 9, -5. </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6778ae"/></marker></defs><rect width="480" height="220" fill="white"/><rect x="53.333" y="64" width="100" height="92" rx="14" fill="#fff0e9" stroke="#dba88c" stroke-width="1.5"/><text x="103.333" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#a9543d" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">-20</text><rect x="190" y="64" width="100" height="92" rx="14" fill="#e7edff" stroke="#8ba1d9" stroke-width="1.5"/><text x="240" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#4a59af" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">9</text><rect x="326.667" y="64" width="100" height="92" rx="14" fill="#fff0e9" stroke="#dba88c" stroke-width="1.5"/><text x="376.667" y="110" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#a9543d" stroke="white" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">-5</text></svg>
