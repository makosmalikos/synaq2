<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Дөңгелек секторлары</title><desc id="desc">O центрлі толық дөңгелек, 4 радиус. Шеңберді сағат тіліне қарсы айналғандағы әріп реті A, B, C, D. Сұралған сектор немесе құрамдас бөліктер көкпен боялған. Жасырын өлшемдер дайын санмен жазылмаған.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle data-disk="true" cx="240" cy="172" r="115" fill="#fff" stroke="#233c56" stroke-width="2.2"/><path data-shaded-sector="2" d="M240 172 L125 172 A115 115 0 0 0 186.01077027962256 273.5389731787766 Z" fill="#7baeea" fill-opacity=".7"/><line x1="240" y1="172" x2="355" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="A"/><text x="379" y="180" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="A">A</text><line x1="240" y1="172" x2="293.98922972037747" y2="70.46102682122341" stroke="#233c56" stroke-width="1.8" data-radius="B"/><text x="305.2565472272388" y="57.27028459260916" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="B">B</text><line x1="240" y1="172" x2="125" y2="172" stroke="#233c56" stroke-width="1.8" data-radius="C"/><text x="101" y="179.99999999999997" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="C">C</text><line x1="240" y1="172" x2="186.01077027962256" y2="273.5389731787766" stroke="#233c56" stroke-width="1.8" data-radius="D"/><text x="174.7434527727612" y="302.72971540739087" text-anchor="middle" fill="#233c56" font-size="28" data-endpoint="D">D</text><text x="181.71262355225636" y="215.02258909388368" text-anchor="middle" fill="#233c56" font-size="27" data-angle-label="2">?</text><circle cx="240" cy="172" r="3.6" fill="#233c56"/><text x="227.6390862021587" y="159.4279847831493" text-anchor="middle" fill="#233c56" font-size="26" data-center="true">O</text></g></svg>