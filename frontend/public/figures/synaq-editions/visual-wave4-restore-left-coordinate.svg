<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="title desc"><title id="title">Таңбалы шамалар зертханасы</title><desc id="desc">K нүктесінің координатасы мен MK арақашықтығы берілген. M нүктесі K-дан сол жақта жатыр. M координатасын табыңдар. Көрсетілген нүктелер: M — белгісіз координата, K(3). </desc><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7Z" fill="#6574b1"/></marker></defs><rect width="480" height="190" fill="white"/><line x1="40" y1="100" x2="444" y2="100" stroke="#38557d" stroke-width="2" marker-end="url(#tip)"/><text x="366.667" y="125" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" dominant-baseline="middle" fill="#335b9b" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" data-scale-value="3">3</text><circle cx="113.333" cy="100" r="4" fill="#4b5ed3"/><text x="113.333" y="76" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#394fc5" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" data-point="M" data-tick-index="2">M</text><circle cx="366.667" cy="100" r="4" fill="#4b5ed3"/><text x="366.667" y="76" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#394fc5" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" data-point="K" data-tick-index="10">K</text><line x1="113.333" y1="154" x2="366.667" y2="154" stroke="#5579aa" stroke-width="1.5"/><line x1="113.333" y1="148" x2="113.333" y2="160" stroke="#5579aa"/><line x1="366.667" y1="148" x2="366.667" y2="160" stroke="#5579aa"/><text x="240" y="141" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#243b54" stroke="white" stroke-width="3" paint-order="stroke" stroke-linejoin="round" >8 бірлік</text></svg>
