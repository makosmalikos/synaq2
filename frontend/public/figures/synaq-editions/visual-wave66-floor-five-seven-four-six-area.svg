<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Өлшемдер мен координаталарды дөңгелектеу</title><desc id="desc">Тіктөртбұрыштың төменгі қабырғасы 5,7, сол қабырғасы 4,6. Бірлік м.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="30" text-anchor="middle" fill="#203549" font-size="24">Өлшемдер — м</text><rect x="115" y="69" width="300" height="242.10526315789474" fill="#c0dfff" stroke="#203549" stroke-width="1.7" data-rectangle="true"/><text x="265" y="353.10526315789474" text-anchor="middle" fill="#203549" font-size="27">5,7</text><text x="59" y="198.05263157894737" text-anchor="middle" fill="#203549" font-size="26">4,6</text></g></svg>