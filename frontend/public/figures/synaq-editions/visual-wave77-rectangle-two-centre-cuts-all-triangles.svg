<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Көпбұрыштар мен құрама фигуралар</title><desc id="desc">Тіктөртбұрыштың екі диагоналі, ортасы арқылы өтетін бір тік және бір көлденең толық кесінді. Барлық қиылысу нүктесі көрінеді, қосымша сызық жоқ.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="80" y1="270" x2="400" y2="270" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="400" y1="270" x2="400" y2="70" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="400" y1="70" x2="80" y2="70" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="80" y1="70" x2="80" y2="270" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="80" y1="270" x2="400" y2="70" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="400" y1="270" x2="80" y2="70" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="240" y1="270" x2="240" y2="70" stroke="#243a51" stroke-width="2" data-graph="true"/><line x1="80" y1="170" x2="400" y2="170" stroke="#243a51" stroke-width="2" data-graph="true"/></g></svg>