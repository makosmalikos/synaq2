<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Кеңістіктегі фигура</title><desc id="desc">T төбесі, C табан центрі, M мен N табанның сол және оң шетінде. TC тік биіктігі мен MN центр арқылы өтетін кесіндісі үзік берілген. TM мен TN бүйір шеттері тұтас.</desc><rect width="480" height="360" rx="18" fill="#fff"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M 95 255 A 145 35 0 0 1 385 255" fill="none" stroke="#315ce8" stroke-width="2" stroke-dasharray="7 5"/><path d="M 95 255 A 145 35 0 0 0 385 255" fill="none" stroke="#315ce8" stroke-width="2.5"/><line x1="240" y1="45" x2="95" y2="255" stroke="#315ce8" stroke-width="2.5" /><line x1="240" y1="45" x2="385" y2="255" stroke="#315ce8" stroke-width="2.5" /><line x1="240" y1="45" x2="240" y2="255" stroke="#8459ce" stroke-width="1.8" stroke-dasharray="6 5"/><line x1="95" y1="255" x2="385" y2="255" stroke="#8459ce" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="240" cy="255" r="4" fill="#203549"/><text x="240" y="30" font-size="24" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">T</text><text x="253" y="277" font-size="24" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">C</text><text x="80" y="267" font-size="24" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">M</text><text x="400" y="267" font-size="24" fill="#203549" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">N</text></g></svg>