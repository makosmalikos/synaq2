<!doctype html><html><head><meta charset="utf-8"><title>SYNAQ — демо</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#14213b;background:#f1f5ff}.stage{width:1280px;height:720px;padding:38px 64px;background:radial-gradient(ellipse at 90% 0,#dbe9ff,transparent 50%);overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;color:#7c88a0;font-size:15px}header b{font-size:26px;color:#2854ed;letter-spacing:2px}.layout{display:grid;grid-template-columns:420px 1fr;gap:45px;align-items:center;height:540px}.step{color:#2854ed;font-size:14px;letter-spacing:2px;font-weight:bold}h1{font-size:48px;line-height:1.1;letter-spacing:-1.8px;margin:20px 0}p{font-size:21px;line-height:1.5;color:#63718b}.card{background:white;border:1px solid #dce5f5;border-radius:28px;padding:32px;box-shadow:0 20px 50px #204bbb0b;min-height:390px}.label{display:flex;justify-content:space-between;font-size:17px;font-weight:bold;color:#556681;border-bottom:1px solid #edf0f6;padding-bottom:20px}.label span{color:#2854ed}.formula{font-size:55px;font-weight:bold;text-align:center;margin:36px 0}.options{display:flex;gap:10px}.options span{border:2px solid #e2e8f2;border-radius:12px;padding:16px;text-align:center;flex:1;font-size:24px}.options .selected{border-color:#20b482;background:#ebfaf4;color:#138b60}.note{padding:18px;border-radius:14px;background:#edf8f3;color:#257c59;font-size:19px;line-height:1.5;margin-top:22px}.chat{background:#eef3ff;color:#354f8b}.bar{display:grid;grid-template-columns:140px 1fr 50px;gap:12px;align-items:center;font-size:17px;margin:25px 0}.track{height:12px;background:#eef2f9;border-radius:8px}.track i{display:block;height:100%;border-radius:8px;background:#2e64f3}.orange{background:#ffa23c!important}.big{font-size:50px;font-weight:bold;color:#2854ed;margin:25px 0}.vs{display:flex;justify-content:space-around;align-items:center;margin:35px 0}.player{text-align:center;font-size:20px}.avatar{display:grid;place-items:center;border-radius:50%;background:#eaf0ff;color:#2854ed;width:65px;height:65px;margin:0 auto 12px;font-size:26px;font-weight:bold}.score{font-size:38px;color:#2854ed;margin-top:15px}.reward{display:flex;align-items:center;gap:12px;margin:15px 0}.reward img{width:190px;height:190px;object-fit:contain}.reward strong{display:block;font-size:35px;color:#2854ed;margin:15px 0}.muted{font-size:15px;color:#8b97ab}.metrics{display:flex;gap:12px;margin:25px 0}.metrics div{flex:1;background:#f3f6fd;border-radius:14px;padding:18px;font-size:14px;color:#65758f}.metrics b{display:block;font-size:28px;color:#253858;margin-bottom:8px}footer{display:flex;gap:10px;align-items:center;color:#7c88a0;font-size:13px}footer i{height:4px;flex:1;background:#dce5f5;border-radius:3px}footer i.on{background:#2854ed}footer span{margin-left:20px}
</style></head><body><div class="stage"><header><b>SYNAQ</b><span id="tag"></span></header><div class="layout"><section><div class="step" id="step"></div><h1 id="title"></h1><p id="copy"></p></section><div class="card" id="screen"></div></div><footer id="progress"></footer></div><script>
const q=new URLSearchParams(location.search),ru=q.get('lang')!=='kk',n=Math.max(0,Math.min(5,Number(q.get('scene'))||0));const tr=(a,b)=>ru?a:b;
const label=(a,b)=>`<div class="label">${a}<span>${b}</span></div>`;
const bar=(a,p,orange=false)=>`<div class="bar"><span>${a}</span><div class="track"><i class="${orange?'orange':''}" style="width:${p}%"></i></div><b>${p}%</b></div>`;
const rows=[
[tr('Узнайте, с чего начать','Неден бастау керегін біліңіз'),tr('Пройдите 10 заданий. Результат покажет, какие темы стоит повторить.','10 тапсырманы орындаңыз. Нәтиже қай тақырыптарды қайталау керегін көрсетеді.'),label(tr('Диагностика','Диагностика'),tr('Результат','Нәтиже'))+bar(tr('Вычисления','Есептеулер'),80)+bar(tr('Дроби','Бөлшектер'),60)+bar(tr('Геометрия','Геометрия'),40,true)+`<div class="note chat">${tr('Начните с геометрии — здесь больше всего ошибок.','Геометриядан бастаңыз — ең көп қате осы тақырыпта.')}</div>`],
[tr('Решайте по одной задаче','Есептерді біртіндеп шешіңіз'),tr('Выберите тему и ответ. Сразу увидите, получилось ли решить задачу.','Тақырып пен жауапты таңдаңыз. Есепті дұрыс шешкеніңізді бірден көресіз.'),label(tr('Практика · Деление','Жаттығу · Бөлу'),'3 / 5')+`<div class="formula">48 ÷ 6 = ?</div><div class="options"><span>6</span><span>7</span><span class="selected">8 ✓</span><span>9</span></div><div class="note">${tr('Верно! 8 × 6 = 48.','Дұрыс! 8 × 6 = 48.')}</div>`],
[tr('Поймите ход решения','Шешу жолын түсініңіз'),tr('Если непонятно — задайте вопрос ИИ-помощнику. Разберите решение по шагам.','Түсінбесеңіз, ЖИ-көмекшіге сұрақ қойыңыз. Шешімді қадам бойынша талдаңыз.'),label(tr('ИИ-помощник','ЖИ-көмекші'),'✦')+`<div class="note chat">${tr('Почему 48 ÷ 6 = 8?','Неге 48 ÷ 6 = 8?')}</div><p style="font-size:22px">${tr('Представь 48 карандашей.<br>Разделим их поровну на 6 групп.<br>В каждой группе будет 8 карандашей.','48 қарындашты елестет.<br>Оларды 6 топқа тең бөлейік.<br>Әр топта 8 қарындаш болады.')}</p><div class="note">${tr('Проверим: 6 × 8 = 48 ✓','Тексерейік: 6 × 8 = 48 ✓')}</div>`],
[tr('Бросьте вызов другу','Досыңызды сайысқа шақырыңыз'),tr('В дуэлях решайте задачи на скорость и точность. Учиться вместе интереснее.','Дуэльде есептерді жылдам әрі дәл шешіңіз. Бірге оқу қызығырақ.'),label(tr('Математическая дуэль','Математикалық дуэль'),'00:24')+`<div class="vs"><div class="player"><div class="avatar">A</div>${tr('Вы','Сіз')}<div class="score">3</div></div><b style="font-size:25px;color:#ff9d31">VS</b><div class="player"><div class="avatar">Д</div>${tr('Друг','Дос')}<div class="score">2</div></div></div><div class="note chat">${tr('Следующая задача: 7 × 8 = ?','Келесі есеп: 7 × 8 = ?')}</div>`],
[tr('Замечайте каждый успех','Әр жетістікті байқаңыз'),tr('За активность получайте XP и коины. Набирайте опыт и открывайте новые уровни.','Белсенділік үшін XP мен коин жинаңыз. Тәжірибе жинап, жаңа деңгейлерге жетіңіз.'),label(tr('Ваши достижения','Жетістіктеріңіз'),'★')+`<div class="reward"><img src="/landing/reward-star.webp"><div><strong>+ XP</strong><strong>+ ${tr('коины','коин')}</strong></div></div><div class="note chat">${tr('Больше практики — больше опыта.','Көбірек жаттығу — көбірек тәжірибе.')}</div>`],
[tr('Следите за прогрессом','Прогресті бақылаңыз'),tr('Родитель видит результаты ребёнка и темы для повторения. Начните с бесплатной диагностики.','Ата-ана баланың нәтижелерін және қайталайтын тақырыптарын көреді. Тегін диагностикадан бастаңыз.'),label(tr('Кабинет родителя','Ата-ана кабинеті'),tr('Эта неделя','Осы апта'))+`<div class="big">74% <span style="font-size:18px;color:#5c7398">${tr('по пройденным темам','өтілген тақырыптар бойынша')}</span></div><div class="metrics"><div><b>12</b>${tr('задач','есеп')}</div><div><b>4,2</b>${tr('часа занятий','сағат оқу')}</div></div><div class="note chat">${tr('Фокус недели: повторить дроби.','Аптаның мақсаты: бөлшектерді қайталау.')}</div>`]
];document.documentElement.lang=ru?'ru':'kk';document.getElementById('tag').textContent=tr('Пример работы платформы','Платформа жұмысының мысалы');document.getElementById('step').textContent=`0${n+1} / 06`;document.getElementById('title').textContent=rows[n][0];document.getElementById('copy').textContent=rows[n][1];document.getElementById('screen').innerHTML=rows[n][2];document.getElementById('progress').innerHTML=rows.map((_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('')+'<span>synaq.app</span>';
</script></body></html>
