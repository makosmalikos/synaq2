    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f9ff;color:#102942}button{font:inherit}.stage{width:100vw;height:100vh;background:radial-gradient(circle at 85% 0,rgba(57,172,255,.16),transparent 32%),linear-gradient(150deg,#f7fbff,#eff7ff);position:relative;overflow:hidden}.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(50,148,235,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}.header{height:86px;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(28,123,205,.13);display:flex;align-items:center;padding:0 70px;gap:44px;position:relative;z-index:2;box-shadow:0 10px 35px -30px #0a69b5}.brand{padding:14px 27px;border-radius:15px;background:linear-gradient(135deg,#48acff,#2388eb);color:#fff;font-weight:900;letter-spacing:.08em;font-size:23px;box-shadow:0 12px 25px -15px #197ace}.nav{display:flex;align-items:center;justify-content:center;gap:10px;flex:1}.nav span{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;color:#687d91;font-size:14px;font-weight:750;white-space:nowrap}.nav b{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#f0f6fd;color:#91a8bc}.nav span.active{color:#fff;background:var(--accent);box-shadow:0 8px 20px -12px var(--accent)}.nav span.active b{background:rgba(255,255,255,.2);color:#fff}.account{display:flex;align-items:center;gap:10px;color:#698095;font-weight:800}.xp{padding:10px 14px;border-radius:13px;background:#fff6d7;color:#bd7e09}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4d9cff,#19c6d4);color:#fff}.main{position:relative;z-index:1;width:1100px;height:598px;margin:18px auto 0}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:900;margin:0 0 ter;background:color-mix(in srgb,var(--accent) 13%,white);color:var(--accent);font-size:22px;font-weight:900}.metric small{display:block;color:#7890a4;font-weight:850;letter-spacing:.08em;font-size:10px;text-transform:uppercase}.metric strong{display:block;font-size:26px;margin-top:5px}.bar{height:8px;background:#e8f1fa;border-radius:99px;margin-top:13px;overflow:hidden}.bar i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--accent),#38c8d4);border-radius:inherit}.question-wrap{display:grid;grid-template-columns:230px 1fr;gap:16px}.side-stats{display:grid;gap:12px}.stat{padding:17px 19px;height:75px}.stat strong{font-size:22px;color:var(--accent)}.stat span{display:block;color:#6f8396;font-size:11px;font-weight:800;margin-top:3px}.question{padding:26px 30px;height:340px}.route{display:flex;align-items:center;justify-content:space-between;border-radius:15px;padding:13px 16px;margin-bottom:20px;background:color-mix(in srgb,var(--accent) 8%,white);color:var(--accent);font-weight:850}.question small{color:#778a9c;font-weight:750}.question h2{font-size:20px;line-height:1.5;margin:15px 0 18px}.answer{height:62px;border:2px solid color-mix(in srgb,var(--accent) 55%,white);border-radius:15px;display:flex;align-items:center;padding:0 20px;color:#a3b0bd;font-weight:700}.question .check{float:right;margin-top:16px;border:0;padding:12px 25px;border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#fff));font-weight:900}.progress-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.progress-card{height:135px;padding:20px}.progress-card .icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,white);color:var(--accent);font-size:21px}.progress-card small{display:block;color:var(--accent);font-weight:850;margin:12px 0 4px}.progress-card strong{font-size:25px}.path{height:225px;margin-top:15px;padding:24px 28px}.path h2{font-size:18px;margin:0 0 26px}.path-line{height:8px;background:#e8eff7;border-radius:99px;position:relative;margin:52px 30px}.path-line i{display:block;width:76%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#27b66f,#30c996)}.node{position:absolute;top:-28px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#25b66e;color:#fff;font-size:27px;font-weight:900;border:6px solid #dff7e9}.node.one{left:7%}.node.two{left:35%}.node.three{left:64%}.node.four{left:88%;background:#fff3cf;color:#d69311;border-color:#ffe7a2}.school-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}.school{height:285px;padding:27px;position:relative;overflow:hidden}.school.red{--school:#ee4750}.school.green{--school:#66ad38}.school.blue{--school:#278fdf}.school:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-100px;bottom:-120px;background:color-mix(in srgb,var(--school) 13%,transparent)}.school-logo{width:78px;height:78px;border-radius:19px;background:#fff;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--school) 18%,#e9eef5);box-shadow:0 12px 25px -20px var(--school)}.school-logo img{max-width:62px;max-height:62px;object-fit:contain}.school h2{font-size:26px;margin:22px 0 5px}.school p{color:#7b8ea1;margin:0;font-weight:700}.school .go{position:absolute;right:22px;bottom:22px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--school) 12%,white);color:var(--school);font-size:24px;font-weight:900}.mock-note{margin-top:15px;height:110px;padding:20px 26px;display:flex;align-items:center;justify-content:space-between}.mock-note strong{font-size:20px}.mock-note span{color:#6f8295}.duel{height:400px;padding:32px;background:linear-gradient(130deg,#5949ec,#8048dd);position:relative;overflow:hidden;color:#fff}.duel:before{content:"";position:absolute;width:500px;height:500px;border:90px solid rgba(255,255,255,.055);border-radius:50%;left:300px;top:-190px}.duel-head{text-align:center;position:relative;z-index:2}.duel-head h2{font-size:32px;margin:6px}.duel-head p{margin:0;color:rgba(255,255,255,.75)}.fighters{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:50px;margin-top:30px}.fighter{width:300px;height:210px;padding:20px;text-align:center;background:rgba(255,255,255,.96);color:#102942;border-radius:21px}.fighter .face{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#53a9ff,#19c3d1);color:#fff;font-weight:900;font-size:28px}.fighter h3{margin:12px 0 2px}.fighter p{margin:0;color:#8292a2;font-size:12px}.versus{font-size:32px;font-weight:1000}.pro{height:430px;padding:32px 42px;display:grid;grid-template-columns:1fr 430px;gap:40px;align-items:center}.pro-copy h1{font-size:43px;line-height:1.02;margin:10px 0 14px;letter-spacing:-.04em}.pro-copy h1 em{font-style:normal;color:#2f8ff0}.pro-copy p{color:#6d8194;font-size:16px;line-height:1.5}.trust{display:flex;gap:8px;margin-top:25px}.trust span{padding:9px 12px;border-radius:999px;background:#eef8ff;color:#257fcf;font-size:11px;font-weight:800}.price{padding:27px 30px;border:2px solid #328ff1;border-radius:23px;background:linear-gradient(145deg,#fff,#eaf6ff);box-shadow:0 25px 50px -35px #227dce}.price .checkmark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#318ff1;color:#fff}.price h2{font-size:26px;margin:15px 0 3px}.price .amount{display:block;color:#2385e3;font-size:42px;font-weight:950;margin:20px 0}.price .amount small{font-size:13px;color:#718499}.price ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:#4f6579;font-size:13px;font-weight:750}.price a{margin-top:20px;display:block;text-align:center;padding:14px;border-radius:13px;background:linear-gradient(135deg,#3da5fb,#2f79ec);color:#fff;font-weight:900}.scene-tag{position:absolute;right:28px;bottom:22px;color:#91a7bb;font-size:11px;letter-spacing:.15em;font-weight:900}

<body>
  <div class="stage" id="stage"><div class="dots"></div><div class="header"><div class="brand">SYNAQ</div><div class="nav" id="nav"></div><div class="account"><span class="xp">★ 1 240</span><span>ҚАЗ</span><span class="avatar">А</span></div></div><main class="main" id="main"></main><div class="scene-tag" id="tag"></div></div>
  <script>
    const scenes = {
      home:{accent:'#318ff2',deep:'#245ae7',active:'home',label:'ЖЕКЕ ЖОСПАР',title:'Бүгінгі дайындықты бастайық',sub:'Әр тапсырмадан кейін түсінікті талдау және нақты прогресс.',body:`<section class="hero"><div class="hero-copy"><span class="hero-chip">БҮГІНГІ ЖЕКЕ ЖОСПАР</span><h2>Бүгінгі дайындықты<br>бастайық</h2><p>Тақырып таңдап, есептерді шығар. ЖИ әр қатені талдап, келесі қадамыңды ұсынады.</p><span class="cta">▶&nbsp; Бастау →</span></div><span class="bubble a">+5 XP</span><span class="bubble b">68%</span><img class="student" src="/hero/students/cutout-2.png"></section><section class="cards"><div class="panel metric"><span class="metric-icon">★</span><div><small>XP ҰПАЙЫ</small><strong>1 240 XP</strong></div></div><div class="panel metric"><span class="metric-icon">◆</span><div><small>ДЕҢГЕЙ</small><strong>3</strong></div></div><div class="panel metric"><div style="width:100%"><small>КЕЛЕСІ ДЕҢГЕЙГЕ</small><strong>340 XP</strong><div class="bar"><i></i></div></div></div></section>`},
      training:{accent:'#ff8a27',deep:'#f36b1d',active:'training',label:'ЖИ-ТРЕНЕР',title:'Ақылды жаттығу',sub:'Қате жіберсең — бірден түсінікті талдау аласың.',body:`<div class="question-wrap"><div class="side-stats"><div class="panel stat"><strong>8</strong><span>БҮГІН ДҰРЫС</span></div><div class="panel stat"><strong>12</strong><span>БАРЛЫҚ ЕСЕП</span></div><div class="panel stat"><strong>4 🔥</strong><span>КҮН ҚАТАРЫМЕН</span></div></div><section class="panel question"><div class="route"><span>✦ ЖЕКЕ ОҚУ МАРШРУТЫ</span><b>72%</b></div><small>Тақырып: Логикалық есептер · РФМШ / НИШ</small><h2>1, 2, 3, 4, 5, 6 сандарынан үш әртүрлі санды неше тәсілмен таңдауға болады?</h2><div class="answer">Жауапты енгіз...</div><button class="check">Тексеру</button></section></div>`},
      progress:{accent:'#974be8',deep:'#6544dd',active:'progress',label:'НӘТИЖЕЛЕР',title:'Прогресс анық көрінеді',sub:'Күшті және әлсіз тақырыптар бір экранда.',body:`<section class="progress-grid"><div class="panel progress-card"><div class="icon">◔</div><small>ЖАЛПЫ НӘТИЖЕ</small><strong>78%</strong></div><div class="panel progress-card"><div class="icon">▤</div><small>ТАҚЫРЫПТАР</small><strong>13</strong></div><div class="panel progress-card"><div class="icon">✓</div><small>ШЕШІЛГЕН ЕСЕП</small><strong>246</strong></div><div class="panel progress-card"><div class="icon">↗</div><small>ОСЫ АПТА</small><strong>+18%</strong></div></section><section class="panel path"><h2>Сенің тақырыптар бойынша жолың</h2><div class="path-line"><i></i><span class="node one">✓</span><span class="node two">✓</span><span class="node three">✓</span><span class="node four">↗</span></div></section>`},
      mock:{accent:'#20baa9',deep:'#169e9d',active:'mock',label:'SYNAQ MOCK',title:'Нақты емтихан форматы',sub:'РФМШ, НИШ және БИЛ сынақтары — бір жерде.',body:`<section class="school-cards"><article class="panel school red"><div class="school-logo"><img src="/brands/rfmsh.png"></div><h2>РФМШ</h2><p>Нақты формат · 30 тапсырма</p><span class="go">→</span></article><article class="panel school green"><div class="school-logo"><img src="/brands/nis.png"></div><h2>НИШ</h2><p>Нақты формат · 40 тапсырма</p><span class="go">→</span></article><article class="panel school blue"><div class="school-logo"><img src="/brands/bil.png"></div><h2>БИЛ</h2><p>Нақты формат · 30 тапсырма</p><span class="go">→</span></article></section><section class="panel mock-note"><div><strong>Апталық тегін сынақ</strong><br><span>Емтиханнан кейін 2 әлсіз тақырыпты бірден көресің</span></div><span class="cta" style="background:var(--accent);color:white">Сынақты бастау →</span></section>`},
      duel:{accent:'#694ee4',deep:'#4737c9',active:'duel',label:'LIVE DUEL',title:'Досыңмен жарыс',sub:'15 раунд. Бірдей есептер. Нәтиже бірден көрінеді.',body:`<section class="duel panel"><div class="duel-head"><span class="hero-chip">⚔ LIVE DUEL</span><h2>Кім жылдам әрі дәл?</h2><p>Досыңды кодпен шақыр және XP жина</p></div><div class="fighters"><div class="fighter"><div class="face">А</div><h3>Аружан</h3><p>1 240 XP · 3 деңгей</p><div class="bar"><i style="width:78%"></i></div></div><div class="versus">VS</div><div class="fighter"><div class="face" style="background:linear-gradient(135deg,#ff8b4b,#f44ea0)">Д</div><h3>Данияр</h3><p>1 190 XP · 3 деңгей</p><div class="bar"><i style="width:64%;background:linear-gradient(90deg,#ff8b4b,#f44ea0)"></i></div></div></div></section>`},
      pro:{accent:'#2f8ff0',deep:'#216fd9',active:'rewards',label:'SYNAQ PRO',title:'Барлық мүмкіндік — бір жазылымда',sub:'Бір Pro жазылымы ата-анаға да, балаға да ашылады.',body:`<section class="panel pro"><div class="pro-copy"><span class="eyebrow">⚡ БІР МИНУТТА ҚОСЫЛУ</span><h1>SYNAQ <em>Pro</em><br>мүмкіндігін аш</h1><p>ЖИ-талдау, барлық тақырыптар, толық сынақтар және ата-анаға арналған прогресс есебі.</p><div class="trust"><span>✓ Бүкіл отбасыға</span><span>● Бірден қосылады</span></div></div><article class="price"><div class="checkmark">✓</div><h2>SYNAQ Pro</h2><span class="amount">5 999 ₸ <small>/ ай</small></span><ul><li>✓ Барлық мектеп форматтары</li><li>✓ ЖИ қателерді талдайды</li><li>✓ Ата-ана кабинеті</li></ul><a>WhatsApp арқылы қосу →</a></article></section>`}
    };
    const names={home:['⌂','Басты бет'],training:['▶','Дайындық'],progress:['▤','Прогресс'],mock:['✓','Сынақ'],duel:['⚔','Дуэль'],rewards:['◇','Pro']};
    const key=new URLSearchParams(location.search).get('scene')||'home',s=scenes[key]||scenes.home;
    document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--accent-deep',s.deep);
    document.getElementById('nav').innerHTML=Object.entries(names).map(([id,n])=>`<span class="${id===s.active?'active':''}"><b>${n[0]}</b>${n[1]}</span>`).join('');
    document.getElementById('main').innerHTML=`<div class="title-row"><div><div class="eyebrow">${s.label}</div><h1>${s.title}</h1></div><p>${s.sub}</p></div>${s.body}`;
    document.getElementById('tag').textContent=`SYNAQ · ${key.toUpperCase()}`;
  </script>
</body>
</html>
